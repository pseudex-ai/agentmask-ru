# Loki: логи ищутся по МЕТКАМ, а содержимое не индексируется вовсе.
#
# ПОЧЕМУ НЕ ELK. Elasticsearch индексирует каждое слово каждой строки — это его
# сила и его цена: на нашем объёме он один съест больше памяти, чем весь
# остальной стек. Loki индексирует только метки (сервис, уровень), а строки
# жмёт и кладёт чанками; поиск внутри чанка — это grep по уже отобранному
# маленькому куску. На объёме одной машины разница в памяти в десять раз, а в
# удобстве — никакой.
#
# ХРАНИЛИЩЕ — ФАЙЛОВАЯ СИСТЕМА, А НЕ S3. Логи не переживают хост намеренно: их
# ценность в первые часы после аварии, а то, что должно пережить машину, — это
# базы, и они вывозятся restic-ом. Отправлять туда же ещё и логи значило бы
# платить за хранение того, что никто никогда не прочитает.

auth_enabled: false

server:
  http_listen_port: 3100
  # Loki по умолчанию очень болтлив на уровне info: он логирует каждый запрос
  # чтения, а читает его Grafana при каждом обновлении панели. Логи про логи —
  # самый быстрый способ заполнить диск.
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # СРОК ХРАНЕНИЯ ЗАДАЁТСЯ ЗДЕСЬ И СОБЛЮДАЕТСЯ compactor-ом НИЖЕ. Без второго
  # первое — только фильтр на чтении: старые чанки продолжают лежать на диске,
  # а диск у нас общий с базами, и его заполнение останавливает выдачу аренды.
  retention_period: 720h   # 30 суток
  # Витрина пишет немного, но авария пишет много: всплеск не должен приводить к
  # отбрасыванию именно тех строк, ради которых всё это стоит.
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16
  max_query_series: 5000
  reject_old_samples: true
  reject_old_samples_max_age: 168h

compactor:
  working_directory: /loki/compactor
  delete_request_store: filesystem
  retention_enabled: true
  retention_delete_delay: 2h

analytics:
  # НИКАКОЙ ТЕЛЕМЕТРИИ НАРУЖУ. Loki по умолчанию отправляет статистику
  # использования в Grafana Labs. Для продукта, который продаёт «ваши данные не
  # покидают контур», собственный стек, звонящий домой, — это не мелочь.
  reporting_enabled: false
