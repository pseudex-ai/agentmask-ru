# Бот поддержки — bostrot/telegram-support-bot v5.0.0, наш конфиг.
#
# ЭТО ШАБЛОН. Бот читает `config/config.yaml` и переменных окружения не знает,
# поэтому токен и id группы подставляет одноразовый сервис `supportbot-config`
# из `deploy/.env` — тем же способом, что и chat_id для Alertmanager. Вторая копия
# токена в гите однажды разойдётся с `.env`, и выяснится это, когда клиент
# напишет в бота, который молчит.
#
# РЕШЕНИЕ ОТ 29.08.2026 (docs/decisions.md), КОТОРОЕ ЭТОТ ФАЙЛ РЕАЛИЗУЕТ:
# поддержка в Telegram с первого дня, почта вторым каналом; бот ОТДЕЛЬНЫЙ от
# ops-бота; первое сообщение просит ТОКЕН СОБЫТИЯ И ВРЕМЯ, а не значение, и
# говорит вслух, что настоящее значение поддержке не нужно. Через поддержку
# клиент неизбежно пришлёт настоящие ПД — скриншот быстрее описания, — и тогда
# в переписке появится вторая копия того, ради ограничения чего построено всё
# остальное. Текст ниже — единственная защита, и она должна быть первой.
#
# КАЖДЫЙ КЛЮЧ ЗДЕСЬ СВЕРЯЕТСЯ СО СБОРКОЙ. `Dockerfile` сверяет имена ключей с
# исходниками закреплённого коммита апстрима и падает, если ключа там нет.
# Причина — первая версия файла: семь ключей (`allow_user_close`,
# `ticket_per_message`, `allow_broadcast`, `forward_edited_messages`,
# `forward_stickers`, `show_replied_mark`, `user_commands`) в v5.0.0 не
# существуют вовсе. Они молча ничего не делали, а комментарии рядом описывали
# поведение, которого нет — то есть конфиг врал тому, кто по нему принимает
# решения. Прочитать список ключей апстрима глазами нельзя: он меняется от
# версии к версии, а `config-sample.yaml` документирует не всё, что читает код.
#
# ЧТО ЗДЕСЬ ЕСТЬ ИЗ ВОЗМОЖНОСТЕЙ АПСТРИМА (и чего нет — с причиной, ниже).

# The compose service is `supportbot-db`; the bot's own default says `mongodb`
# and ignores MONGO_URI in the environment (db.js reads the config first).
mongodb_uri: mongodb://supportbot-db:27017/support

bot_token: '__PSEUDEX_SUPPORT_BOT_TOKEN__'
staffchat_id: '__PSEUDEX_SUPPORT_CHAT__'
staffchat_type: 'telegram'
owner_id: '__PSEUDEX_SUPPORT_OWNER__'

# Пять сообщений за пять минут — потолок для человека, у которого что-то
# горит; сверх — это скрипт.
spam_cant_msg: 5
spam_time: 300000

# ДВА РАЗНЫХ РЕЖИМА РАЗМЕТКИ, И ЭТО НЕ НЕБРЕЖНОСТЬ. Тексты клиенту — наши, в
# HTML (<b>, <code>). Служебные сообщения в группу — апстрима, в Markdown:
# «Тикет #… от [Igor](tg://user?id=…)». С HTML для группы ссылка на автора
# приходила сырым текстом. Найдено первым тикетом.
parse_mode: 'HTML'
staffchat_parse_mode: 'MarkdownV2'

# ОПЕРАТОР НЕ ПИШЕТ КЛИЕНТУ В ЛИЧКУ МИМО БОТА. Разговор, ушедший в личку, не
# виден второму оператору и не закрывается тикетом; всё, что нужно сказать,
# говорится через reply на тикет. С несколькими коллегами в группе это уже не
# вкус, а условие: личка превращает общий тикет в частную переписку.
allow_private: false
direct_reply: false

# ТИКЕТ ЗАКРЫВАЕТСЯ РУКАМИ, а не первым ответом. «Проверьте порт 443» — это не
# конец разговора; закрытие по первому ответу учит клиента писать заново, и
# история рассыпается на тикеты по одному сообщению.
auto_close_tickets: false

# НО РУКАМИ ЕГО ЗАКРЫВАТЬ И НЕ ОБЯЗАТЕЛЬНО: через неделю молчания с обеих
# сторон он закроется сам (`workflows.ts:91`, проверка каждые 30 минут), а
# клиент, написавший снова, откроет ЕГО ЖЕ — номер тот же, история одна. Это и
# есть «постоянный диалог»: закрытие перестаёт быть решением оператора, а
# `/open` перестаёт быть списком всего, что когда-либо писали.
auto_close_after_days: 7

# КЛИЕНТ НОМЕРА ТИКЕТА НЕ ВИДИТ, оператор видит КТО ПИШЕТ. «Тикет #T000001»
# под ответом — бюрократия для продукта, где владелец отвечает лично, а
# клиентов единицы: ссылаться ему не на что, а выглядит как колл-центр.
# Решение владельца 14.09. Второе — потому что один и тот же человек в третий
# раз с одной проблемой это другой разговор, чем трое с разными, а анонимный
# тикет этого не показывает.
show_user_ticket: false
anonymous_tickets: false

# ПОДПИСЬ КЛИЕНТУ — ОДНА, И ЭТО ДВЕ ЕЁ ПОЛОВИНЫ. `anonymous_replies: true`
# подставляет в подпись `regardsGroup` вместо имени оператора («staff.ts:30`),
# а `regards` идёт строкой выше. Первая версия держала в обоих ключах одну и ту
# же строку, и клиент получал «С уважением, поддержка Pseudex» ДВАЖДЫ —
# буквально, как на скриншоте первого тикета. Это не режим сломан, это две
# половины одной подписи, в которые положили одно и то же.
anonymous_replies: true

autoreply_confirmation: true
clean_replies: false
pass_start: false

# РОЛИ. Без этого блока `cache.staffMembers` пуст — в логе стоит «Loaded 0 staff
# members from config», `/staff` показывает пусто, `/assign` отвечает «not a
# registered staff member», а `/stats` — «You do not have permission»: роли
# проверяются именно здесь (`team.ts:27`). Отвечать при этом может ЛЮБОЙ, кто
# состоит в рабочей группе (`permissions.ts:32`: `ctx.chat.id === staffchat_id`),
# поэтому роли — это про права, а не про допуск к переписке. Роль считается по
# `telegram_id`, а его каждый печатает в группе сам: команда `/id`.
#
# `owner_id` и telegram_id владельца — одно и то же число, и второй копии в
# гите не нужно: подставляется тем же рендером, что и `owner_id`.
staff_roles:
  - telegram_id: '__PSEUDEX_SUPPORT_OWNER__'
    role: 'admin'
    name: 'Поддержка'
  # Коллега добавляется строкой ниже — telegram_id взятый из `/id` в группе.
  # Роли: admin (всё, включая /assign и /stats), supervisor (то же), agent
  # (отвечать может, /stats и /assign — нет).
  # - telegram_id: '123456789'
  #   role: 'agent'
  #   name: 'Имя'

# ГОТОВЫЕ ОТВЕТЫ — И ОНИ РАБОТАЮТ ТОЛЬКО ПОСЛЕ ПАТЧА. Апстрим обещает в README
# «`/<key>` — отправить шаблон ответом на тикет», а на деле ставит текст в
# `ctx.message.text` и выходит из обработчика: grammY останавливает цепочку на
# первом хендлере без `next()`, и шаблон не уходил НИКУДА — ни клиенту, ни в
# группу, ни ошибкой. Проверено экспериментом на grammy@1.43.0, лечится патчем
# `handlers.ts`. `/templates` печатает список ключей.
#
# Текст шаблона уходит клиенту ДОСЛОВНО (плюс приветствие и подпись), в режиме
# HTML его разметка экранируется — поэтому здесь обычный текст, без тегов.
canned_responses:
  - key: 'logs'
    text: 'Пришлите, пожалуйста, вывод `docker logs <имя контейнера> --tail 100` за первую минуту после запуска. Ключ и всё, что похоже на значения из трафика, можно вырезать — по логу видно, на каком шаге он встал.'
  - key: 'lease'
    text: 'Аренда лицензии продлевается сама, раз в сутки, и контейнер переживает наш простой двое суток. Если в логе видно `LEASED` → `STALE` → `EXPIRED`, пришлите эти строки со временем: по ним найдём, что именно не доехало.'
  - key: 'mask'
    text: 'Настоящее значение присылать не нужно. Нужны токен из журнала (вид «REDACTED…» или подмена) и время — по ним операторский интерфейс найдёт событие, а значение вы посмотрите у себя через /reveal, под запись в журнал.'
  - key: 'invoice'
    text: 'Счёт и акт формируются в кабинете, раздел «Счета»: https://pseudex.ru/app/ — там же видно, на какое юрлицо они выписаны. Если нужен документ за прошлый период или правка реквизитов, напишите номер счёта (PS-…) и что поправить.'
  - key: 'deploy'
    text: 'Пришлите команду запуска контейнера и первые строки лога: `docker logs <имя> --tail 50`. Чаще всего дело в том, что не задан том для базы или не поднялся порт — по первым строкам это видно сразу.'

# НИКАКОГО ВЕБ-СЕРВЕРА: наружу открыто ровно три порта, и четвёртый для бота
# поддержки не нужен — долгий опрос идёт исходящим соединением.
web_server: false
signal_enabled: false
log_level: 'ERROR'
dev_mode: false

# СВОДКА ЗА СУТКИ — в 09:00 UTC, то есть в 12:00 по Москве (`index.ts:140`).
daily_summary_time: '09:00'

# ── ЧТО ВЫКЛЮЧЕНО И ПОЧЕМУ ЭТО НЕ ЛЕНЬ ──────────────────────────────────────
#
# `use_llm`, `staff_assist`, `translate_enabled` — ВСЕ ТРИ отправляют переписку
# клиента во внешнюю модель (`addons/llm.ts`, `triage.ts:11`). Продукт, который
# продаёт «ваши данные не уходят в модель», не может так делать сам. Это не
# настройка, это то же решение, что и в docs/decisions.md.
use_llm: false
# `auto_triage` классифицирует обращения тем же LLM (`triage.ts:56`) — то же
# основание. Выключен.
auto_triage: false
# `enable_csat` шлёт оценку 1–5 ТОЛЬКО из ветки `auto_close_tickets`
# (`staff.ts:242`), то есть после каждого ответа оператора. Включать его —
# значит выбрать «разговор закрыт после первого ответа», а это ровно то, что
# отвергнуто выше. Понадобится оценка — сначала патч на ветку автозакрытия.
enable_csat: false
# `escalation_rules` в v5.0.0 НЕ РАБОТАЮТ: `checkEscalation` не вызывается
# ниоткуда (`runWorkflowChecks` зовёт только `checkAutoClose`). Ставить правило,
# которое никогда не сработает, — это та же ложь в конфиге, что и мёртвые ключи.
escalation_rules: []
# `autoreply` — подстрочное совпадение (`users.ts:92`, `messageText.includes`):
# короткий вопрос вида «ключ» срабатывает на любое письмо со словом «ключ».
# Клиентов единицы, а ложный автоответ дороже сэкономленной минуты.
autoreply: []
# Нечего подключать: веб-виджета у нас нет (свой сайт), Slack/Discord не
# используем, REST API потребовал бы открыть четвёртый порт, а вебхукам нужен
# принимающий конец, которого нет. Перечислены явно, чтобы «почему пусто» не
# искали заново.
web_chat:
  enabled: false
webhooks: []
api_enabled: false
slack_enabled: false
discord_enabled: false
# `business_hours` НЕ ВКЛЮЧАТЬ. Это не «отвечаем с 10 до 19»: вне часов
# `users.ts:234` отвечает офлайн-текстом и ВЫБРАСЫВАЕТ сообщение — тикет не
# создаётся вовсе, и клиент, написавший вечером, для нас не существует. Плюс
# `businessHoursClosed` содержит literal `{start}`/`{end}`, которые нигде не
# подставляются. Ночное сообщение обязано стать тикетом, пусть и отвеченным
# утром.

# Категории — ярлыки в ОДНОЙ группе: операторов пока один-два, и раскладывать
# тикеты по пяти группам значило бы пять мест, куда смотреть в три ночи.
#
# `group_id` У КАЖДОЙ КАТЕГОРИИ ОБЯЗАТЕЛЕН, ДАЖЕ КОГДА ГРУППА ОДНА. Первая
# версия давала только `tag`, как в примере апстрима, — и категория не
# запоминалась: `inline.ts:42` пишет `session.group = category.group_id`, а
# `text.ts:33` показывает клавиатуру заново, пока `session.group` пуст. Клиент
# выбирал категорию, читал подсказку, писал вопрос — и получал «О чём речь?»
# вместо тикета. Найдено живым разговором с ботом, не чтением конфига.
# `msg` У КАЖДОЙ КАТЕГОРИИ ОБЯЗАТЕЛЕН, И НЕ ПО ДОКУМЕНТАЦИИ. В интерфейсе он
# необязателен, а `text.ts:18` в v5.0.0 читает `category.msg.includes(...)` без
# проверки — категория без `msg` роняет бота ПЕРВЫМ ЖЕ сообщением клиента.
# Найдено запуском, не чтением. Обход совпадает с пользой: `msg` — подсказка
# после выбора категории, и именно здесь клиенту говорят, ЧТО прислать.
#
# `subgroups` НЕ ЗАПОЛНЯЕМ. Подкатегории нужны, когда одна категория уходит в
# отдельную группу; у нас группа одна. Но пустой список (`subgroups: []`) — не
# то же, что отсутствие ключа, и это ловушка: `commands.ts:110` проверяет
# `if (!category.subgroups)`, для `[]` это ложь, и `/open` перестал бы видеть
# хоть один тикет. Оставлено отсутствие ключа — как у всех, кто читает конфиг
# через `!category.subgroups`.
categories:
  - name: "Ключ и аренда"
    tag: "#key"
    group_id: "__PSEUDEX_SUPPORT_CHAT__"
    msg: "Пришлите строки из <code>docker logs</code> про licence/lease — без значений. Ключ показывается один раз; потеряли — выпустите новый в кабинете, это одна кнопка."
  - name: "Счёт, акт, реквизиты"
    tag: "#invoice"
    group_id: "__PSEUDEX_SUPPORT_CHAT__"
    msg: "Назовите номер счёта (PS-…) или период и на какое юрлицо нужен документ."
  - name: "Развёртывание контейнера"
    tag: "#deploy"
    group_id: "__PSEUDEX_SUPPORT_CHAT__"
    msg: "Пришлите команду запуска и вывод <code>docker logs</code> за первую минуту — без ключа и без значений из трафика."
  - name: "Что-то маскируется не так"
    tag: "#mask"
    group_id: "__PSEUDEX_SUPPORT_CHAT__"
    msg: "Настоящее значение НЕ присылайте. Нужны токен из журнала (вид «REDACTED…» или подмена) и время — по ним найдём событие, а значение вы посмотрите у себя через /reveal."
  - name: "Другое"
    tag: "#other"
    group_id: "__PSEUDEX_SUPPORT_CHAT__"
    msg: "Опишите, что случилось, — сообщение уйдёт человеку."

language:
  # ПЕРВОЕ СООБЩЕНИЕ — И ЕДИНСТВЕННОЕ МЕСТО, ГДЕ КЛИЕНТА МОЖНО ОСТАНОВИТЬ ДО
  # ТОГО, КАК ОН ВСТАВИТ СКРИНШОТ. Всё, что здесь сказано, сказано до первого
  # его слова.
  startCommandText: >-
    Это поддержка Pseudex. Выберите, о чём речь, и напишите — сообщение уйдёт
    человеку, ответим в рабочие часы по Москве.


    <b>Настоящие значения — телефоны, адреса, СНИЛС ваших клиентов — сюда
    присылать не нужно.</b> По устройству продукта они нам не видны, и видеть их
    мы не хотим. Если что-то замаскировалось не так, пришлите <b>токен из
    журнала</b> (вид «REDACTED…» или подмена) и <b>время</b> — по ним операторский
    интерфейс найдёт событие, а настоящее значение вы посмотрите у себя через
    /reveal, под запись в журнал.
  # ССЫЛКИ, А НЕ КОМАНДЫ. Здесь стояли `/docs` и `/cabinet` из блока
  # `user_commands`, которого в апстриме не существует: бот таких команд не
  # знает, а неизвестный текст уходит в `text.ts` и СТАНОВИТСЯ ТИКЕТОМ. То есть
  # клиент, послушав подсказку, создавал обращение с текстом «/docs».
  faqCommandText: "Как устроено: https://pseudex.ru/architecture · Что распознаём: https://pseudex.ru/detection · Кабинет — ключи, счета, документы: https://pseudex.ru/app/ · Оферта: https://pseudex.ru/offer"
  # `/close` У КЛИЕНТА НЕ РАБОТАЕТ и не может: в `commands.ts:143` первая строка
  # обработчика — `if (!ctx.session.admin) return`, то есть у клиента команда
  # молча не делает ничего, даже не отвечает. Обещать её в подсказке — врать.
  helpCommandText: "Просто напишите сообщение — оно станет тикетом, ответим здесь же в рабочие часы по Москве. Документация и кабинет: /faq."
  # `helpCommand` дописывает к этому списку команды группы и аналитики сам
  # (`commands.ts:64`), поэтому здесь — только то, что нужно каждый день, и
  # главный жест: ответ на карточку тикета.
  helpCommandStaffText: "<b>Как отвечать:</b> свайп по карточке тикета → «Ответить». Ответ уходит клиенту с приветствием и подписью; текст шаблона можно взять из /templates.\n<b>Тикеты:</b> /open — открытые, /close — закрыть (ответом на карточку), /reopen — открыть заново.\n<b>Себе:</b> /note — заметка, клиент её не видит; /notes — заметки по тикету; /mute и /unmute — не получать уведомления по тикету.\n<b>Группе:</b> /id — id этого чата и ваш; /staff — состав; /stats — сводка."
  confirmationMessage: "Принято. Ответим в рабочие часы по Москве — здесь же."
  blockedSpam: "Слишком много сообщений подряд. Подождите, пока оператор прочитает уже отправленное."
  ticket: "Тикет"
  closed: "закрыт"
  acceptedBy: "принял"
  dear: "Здравствуйте"
  # ДВЕ ПОЛОВИНЫ ОДНОЙ ПОДПИСИ, см. `anonymous_replies` выше.
  regards: "С уважением,"
  regardsGroup: "поддержка Pseudex"
  from: "от"
  language: "Язык"
  msg_sent: "Отправлено клиенту"
  file_sent: "Файл отправлен клиенту"
  usr_with_ticket: "Клиент с тикетом"
  banned: "заблокирован"
  replyPrivate: "Ответить лично"
  services: "О чём речь?"
  customer: "клиент"
  msgForwarding: "Сообщения уйдут в: "
  back: "Назад"
  whatSubCategory: "Уточните: "
  prvChatEnded: "Личный разговор завершён."
  prvChatOpened: "Личный разговор с клиентом открыт."
  prvChatEnd: "Завершить личный разговор"
