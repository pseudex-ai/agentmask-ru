# Бот поддержки — bostrot/telegram-support-bot v5.0.0, наш конфиг.
#
# ЭТО ШАБЛОН. Бот читает `config/config.yaml` и переменных окружения не знает,
# поэтому токен и id группы подставляет одноразовый сервис `supportbot-config`
# из `deploy/.env` — тем же способом, что и chat_id для Alertmanager. Вторая копия
# токена в гите однажды разойдётся с `.env`, и выяснится это, когда клиент
# напишет в бота, который молчит.
#
# РЕШЕНИЕ ОТ 29.08.2026 (docs/decisions.md), КОТОРОЕ ЭТОТ ФАЙЛ РЕАЛИЗУЕТ:
# поддержка в Telegram с первого дня, почта вторым каналом; бот ОТДЕЛЬНЫЙ от
# ops-бота; первое сообщение просит ТОКЕН СОБЫТИЯ И ВРЕМЯ, а не значение, и
# говорит вслух, что настоящее значение поддержке не нужно. Через поддержку
# клиент неизбежно пришлёт настоящие ПД — скриншот быстрее описания, — и тогда
# в переписке появится вторая копия того, ради ограничения чего построено всё
# остальное. Текст ниже — единственная защита, и она должна быть первой.

bot_token: '__PSEUDEX_SUPPORT_BOT_TOKEN__'
staffchat_id: '__PSEUDEX_SUPPORT_CHAT__'
staffchat_type: 'telegram'
owner_id: '__PSEUDEX_SUPPORT_OWNER__'

# Пять сообщений за пять минут — потолок для человека, у которого что-то
# горит; сверх — это скрипт.
spam_cant_msg: 5
spam_time: 300000

parse_mode: 'HTML'
staffchat_parse_mode: 'HTML'

# ОПЕРАТОР НЕ ПИШЕТ КЛИЕНТУ В ЛИЧКУ МИМО БОТА. Разговор, ушедший в личку, не
# виден второму оператору и не закрывается тикетом; всё, что нужно сказать,
# говорится через reply на тикет.
allow_private: false
direct_reply: false

# ТИКЕТ ЗАКРЫВАЕТСЯ РУКАМИ, а не первым ответом. «Проверьте порт 443» — это не
# конец разговора; закрытие по первому ответу учит клиента писать заново, и
# история рассыпается на тикеты по одному сообщению.
auto_close_tickets: false
ticket_per_message: false

# КЛИЕНТ ВИДИТ НОМЕР ТИКЕТА, оператор видит КТО ПИШЕТ. Первое — чтобы «по
# тикету 12» было чем назвать разговор; второе — потому что один и тот же
# человек в третий раз с одной проблемой это другой разговор, чем трое с
# разными, а анонимный тикет этого не показывает.
show_user_ticket: true
anonymous_tickets: false
anonymous_replies: true
show_replied_mark: true

autoreply_confirmation: true
clean_replies: false
pass_start: false
forward_edited_messages: true
forward_stickers: false
allow_user_close: true
allow_broadcast: false

# НИКАКОГО ВЕБ-СЕРВЕРА: наружу открыто ровно три порта, и четвёртый для бота
# поддержки не нужен — долгий опрос идёт исходящим соединением.
web_server: false
signal_enabled: false
log_level: 'ERROR'
dev_mode: false

# LLM-АВТООТВЕТ ВЫКЛЮЧЕН НАМЕРЕННО. Он отправил бы обращения клиентов — вместе
# с тем, что они всё-таки пришлют, — во внешнюю модель. Продукт, который
# продаёт «ваши данные не уходят в модель», не может так делать сам.
use_llm: false

# Категории — ярлыки в ОДНОЙ группе (`tag`, не `group_id`): операторов пока
# один-два, и раскладывать тикеты по четырём группам значило бы четыре места,
# куда смотреть в три ночи. Когда появятся команды — станут group_id.
# `msg` У КАЖДОЙ КАТЕГОРИИ ОБЯЗАТЕЛЕН, И НЕ ПО ДОКУМЕНТАЦИИ. В интерфейсе он
# необязателен, а `text.ts:18` в v5.0.0 читает `category.msg.includes(...)` без
# проверки — категория без `msg` роняет бота ПЕРВЫМ ЖЕ сообщением клиента.
# Найдено запуском, не чтением. Обход совпадает с пользой: `msg` — подсказка
# после выбора категории, и именно здесь клиенту говорят, ЧТО прислать.
categories:
  - name: "Ключ и аренда"
    tag: "#key"
    msg: "Пришлите строки из <code>docker logs</code> про licence/lease — без значений. Ключ показывается один раз; потеряли — выпустите новый в кабинете, это одна кнопка."
  - name: "Счёт, акт, реквизиты"
    tag: "#invoice"
    msg: "Назовите номер счёта (PS-…) или период и на какое юрлицо нужен документ."
  - name: "Развёртывание контейнера"
    tag: "#deploy"
    msg: "Пришлите команду запуска и вывод <code>docker logs</code> за первую минуту — без ключа и без значений из трафика."
  - name: "Что-то маскируется не так"
    tag: "#mask"
    msg: "Настоящее значение НЕ присылайте. Нужны токен из журнала (вид «REDACTED…» или подмена) и время — по ним найдём событие, а значение вы посмотрите у себя через /reveal."
  - name: "Другое"
    tag: "#other"
    msg: "Опишите, что случилось, — сообщение уйдёт человеку."

user_commands:
  - name: docs
    text: "Как устроено: https://pseudex.ru/architecture\nЧто распознаём: https://pseudex.ru/detection\nОферта: https://pseudex.ru/offer · Политика: https://pseudex.ru/policy"
  - name: cabinet
    text: "Кабинет — ключи, счета, документы: https://pseudex.ru/app/"

language:
  # ПЕРВОЕ СООБЩЕНИЕ — И ЕДИНСТВЕННОЕ МЕСТО, ГДЕ КЛИЕНТА МОЖНО ОСТАНОВИТЬ ДО
  # ТОГО, КАК ОН ВСТАВИТ СКРИНШОТ. Всё, что здесь сказано, сказано до первого
  # его слова.
  startCommandText: >-
    Это поддержка Pseudex. Выберите, о чём речь, и напишите — сообщение уйдёт
    человеку, ответим в рабочие часы по Москве.


    <b>Настоящие значения — телефоны, адреса, СНИЛС ваших клиентов — сюда
    присылать не нужно.</b> По устройству продукта они нам не видны, и видеть их
    мы не хотим. Если что-то замаскировалось не так, пришлите <b>токен из
    журнала</b> (вид «REDACTED…» или подмена) и <b>время</b> — по ним операторский
    интерфейс найдёт событие, а настоящее значение вы посмотрите у себя через
    /reveal, под запись в журнал.
  faqCommandText: "Документация: /docs · Кабинет: /cabinet"
