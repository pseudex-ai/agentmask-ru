# БЕЗ ЭТОГО ФАЙЛА ДАШБОРД ПРОСТО ЛЕЖИТ В КАТАЛОГЕ. Смонтированный json Grafana
# сама по себе не читает: нужен провайдер, который говорит, откуда брать. Без
# него профиль поднимал пустую Grafana — и это ровно тот отказ, который не
# виден ни в одном логе.
apiVersion: 1
providers:
  - name: pseudex
    type: file
    # Правки в UI не переживают перезапуск и не должны: дашборд версионируется
    # в репозитории вместе с правилами тревог, а нарисованная руками панель
    # живёт в базе одной машины и исчезает вместе с ней.
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
