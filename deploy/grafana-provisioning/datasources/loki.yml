# Второй источник данных — логи. Тот же принцип, что у Prometheus: файлом, а не
# руками в UI, и с фиксированным uid, потому что на него ссылаются панели.
apiVersion: 1
datasources:
  - name: Loki
    uid: pseudex-loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    jsonData:
      # СВЯЗЬ ЛОГА С МЕТРИКОЙ В ОДИН КЛИК. Увидев всплеск ошибок на графике,
      # оператор попадает в те самые строки, а не ищет их по времени руками.
      derivedFields:
        - name: request
          # Идентификатор запроса лежит в СОДЕРЖИМОМ, а не в метке (метка на
          # каждый запрос убила бы Loki кардинальностью), поэтому достаётся
          # регуляркой — по уже отобранному сервису это дёшево.
          matcherRegex: '"rid":\s*"([a-f0-9]{16})"'
          url: '/explore?left={"datasource":"pseudex-loki","queries":[{"expr":"{service=~\".+\"} |= \"$${__value.raw}\""}]}'
