# Our side of the product: the licensing server, the storefront, their database
# and a TLS front door. The customer's side is one container they run
# themselves, and nothing here ever talks to it — the traffic is one way, from
# their container to /v1/lease.
#
# DESIGNED TO RUN WITHOUT US. Every service restarts on its own, states its own
# health, and fails in a direction that is safe: the licensing server going down
# does not stop customers (they have a 24h lease and 48h of grace), and the
# storefront going down does not stop anything at all.

name: pseudex

x-logging: &logging
  # Bounded, or a year of uptime fills the disk and takes the licensing server
  # down with it — the one outage that eventually stops every customer.
  driver: json-file
  options: { max-size: "50m", max-file: "5" }

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pseudex}
      POSTGRES_USER: ${POSTGRES_USER:-pseudex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pseudex}"]
      interval: 10s
      timeout: 5s
      retries: 6
    # Not published. The only things that need it are on this network.
    expose: ["5432"]

  license:
    # ИЗ РЕЕСТРА, А НЕ `build:`. Сборка на боевой машине означала, что ничто
    # нигде не доказывает: то, что крутится, — это то, что прошло гейты. Образ
    # собирается, подписывается и публикуется в release.yml, а агент выкатки
    # проверяет подпись прежде, чем что-либо остановить.
    image: ${REGISTRY:-cr.yandex/pseudex}/pseudex-licensing:${VERSION:?set VERSION}
    restart: unless-stopped
    logging: *logging
    environment:
      # The signing key is the root of trust for every bundle we ever issue.
      # Injected, never baked, and rotating it invalidates every deployed
      # binary — so it is the one secret with no automated rotation.
      PSEUDEX_SIGNING_KEY: ${PSEUDEX_SIGNING_KEY:?set PSEUDEX_SIGNING_KEY}
      # Seals the compiled tuning blob and is delivered in every lease so the
      # engine can open its own tuning. THE SAME value the image was built with
      # (build-arg PSEUDEX_TUNING_KEY); rotating it invalidates every deployed
      # binary exactly like the signing key. See docs/tz-license-packaging §2.2.
      PSEUDEX_TUNING_KEY: ${PSEUDEX_TUNING_KEY:?set PSEUDEX_TUNING_KEY}
      PSEUDEX_LICENSE_DB: /data/license.db
      PSEUDEX_LEASE_TTL_SECONDS: ${LEASE_TTL:-86400}
      PSEUDEX_GRACE_SECONDS: ${GRACE:-172800}
      PSEUDEX_LICENSE_ADMIN_TOKEN: ${PSEUDEX_LICENSE_ADMIN_TOKEN:?set PSEUDEX_LICENSE_ADMIN_TOKEN}
      PSEUDEX_LICENSE_STOREFRONT_TOKEN: ${PSEUDEX_LICENSE_STOREFRONT_TOKEN:?set PSEUDEX_LICENSE_STOREFRONT_TOKEN}
      PSEUDEX_LICENSE_CERT: /certs/server.crt
      PSEUDEX_LICENSE_KEYFILE: /certs/server.key
    volumes:
      - license-data:/data
      - ./certs:/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import httpx,sys; sys.exit(0 if httpx.get('http://127.0.0.1:8443/v1/pubkey',timeout=5).status_code==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    ports:
      # Public: this is what every customer container calls.
      - "443:8443"
    # The admin app stays on the internal network only. Publishing it would put
    # key issuance on the internet.
    expose: ["9443"]

  storefront:
    image: ${REGISTRY:-cr.yandex/pseudex}/pseudex-storefront:${VERSION:?set VERSION}
    restart: unless-stopped
    logging: *logging
    environment:
      PSEUDEX_SECRET_KEY: ${PSEUDEX_SECRET_KEY:?set PSEUDEX_SECRET_KEY}
      PSEUDEX_DEBUG: "0"
      PSEUDEX_ALLOWED_HOSTS: ${SITE_HOST:?set SITE_HOST}
      PSEUDEX_CSRF_ORIGINS: https://${SITE_HOST}
      PSEUDEX_ADMIN_PATH: ${ADMIN_PATH:-admin}
      PSEUDEX_DB_HOST: postgres
      PSEUDEX_DB_NAME: ${POSTGRES_DB:-pseudex}
      PSEUDEX_DB_USER: ${POSTGRES_USER:-pseudex}
      PSEUDEX_DB_PASSWORD: ${POSTGRES_PASSWORD}
      PSEUDEX_LICENSING_ADMIN_URL: http://license:9443
      # Витрине — только меньший токен. Полный ей не нужен и лежать у неё не должен.
      PSEUDEX_LICENSE_STOREFRONT_TOKEN: ${PSEUDEX_LICENSE_STOREFRONT_TOKEN:?set PSEUDEX_LICENSE_STOREFRONT_TOKEN}
      PSEUDEX_DOCKER_IMAGE: ${CUSTOMER_IMAGE:-cr.yandex/pseudex/pseudex:1.0.0}
      PSEUDEX_SMTP_HOST: ${SMTP_HOST:-}
      PSEUDEX_SMTP_USER: ${SMTP_USER:-}
      PSEUDEX_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      PSEUDEX_FROM_EMAIL: ${FROM_EMAIL:-pseudex <noreply@pseudex.ru>}
    healthcheck:
      # Витрина была единственным сервисом на пути клиента без проверки: Django,
      # уронивший себя миграцией, отвечал бы `running` бесконечно, а агент
      # выкатки счёл бы это успехом.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5).status==200 else 1)\""]
      interval: 15s
      timeout: 10s
      retries: 4
      start_period: 40s
    depends_on:
      postgres: { condition: service_healthy }
      license: { condition: service_started }
    expose: ["8000"]

  billing:
    # БИЗНЕС-ЦИКЛ. Без него `build_invoice`, `mark_unpaid` и `mark_paid` —
    # исправные механизмы, которых никто не зовёт: триал не кончается, счёт не
    # выставляется, неплательщик работает вечно. Ровно так и было, и снаружи
    # это выглядит как продукт, который работает.
    #
    # Отдельный сервис на ТОМ ЖЕ образе, а не cron на хосте и не поток внутри
    # gunicorn: у витрины несколько воркеров, и цикл внутри неё запускался бы
    # N раз одновременно. Команда идемпотентна (счёт за период существует
    # строкой в базе), так что дубль безвреден — но безвреден он именно потому,
    # что на него никто не рассчитывает.
    #
    # Раз в час, а не раз в сутки: просрочка меряется днями, но ОПЛАТА должна
    # возвращать обслуживание быстро, а сторож повторного возобновления живёт
    # в этой же команде.
    image: ${REGISTRY:-cr.yandex/pseudex}/pseudex-storefront:${VERSION:?set VERSION}
    restart: unless-stopped
    logging: *logging
    environment:
      PSEUDEX_SECRET_KEY: ${PSEUDEX_SECRET_KEY:?set PSEUDEX_SECRET_KEY}
      PSEUDEX_DEBUG: "0"
      PSEUDEX_ALLOWED_HOSTS: ${SITE_HOST:?set SITE_HOST}
      PSEUDEX_DB_HOST: postgres
      PSEUDEX_DB_NAME: ${POSTGRES_DB:-pseudex}
      PSEUDEX_DB_USER: ${POSTGRES_USER:-pseudex}
      PSEUDEX_DB_PASSWORD: ${POSTGRES_PASSWORD}
      PSEUDEX_LICENSING_ADMIN_URL: http://license:9443
      PSEUDEX_LICENSE_STOREFRONT_TOKEN: ${PSEUDEX_LICENSE_STOREFRONT_TOKEN:?set PSEUDEX_LICENSE_STOREFRONT_TOKEN}
      # Ссылка на счёт уходит письмом, а у планировщика нет запроса, из
      # которого её можно построить.
      PSEUDEX_SITE_URL: https://${SITE_HOST}
      PSEUDEX_SMTP_HOST: ${SMTP_HOST:-}
      PSEUDEX_SMTP_USER: ${SMTP_USER:-}
      PSEUDEX_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      PSEUDEX_FROM_EMAIL: ${FROM_EMAIL:-pseudex <noreply@pseudex.ru>}
    depends_on:
      postgres: { condition: service_healthy }
      license: { condition: service_started }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while :; do
          python manage.py run_billing_cycle || echo "billing cycle failed"
          sleep 3600
        done

  caddy:
    # TLS with automatic certificates and renewal. Chosen over nginx+certbot
    # because renewal is the part that silently stops working, and here it is
    # not a cron job that can fail unnoticed.
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      SITE_HOST: ${SITE_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      # Не «процесс жив», а «отдаёт страницу». Caddy, потерявший конфиг или
      # сертификат, продолжает работать и отвечать ошибкой — именно этот случай
      # проверка и ловит.
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - "80:80"
      - "8443:443"
    depends_on:
      - storefront

  backup:
    # Both databases, nightly, kept for a month. The licensing database is the
    # one that matters: losing it means every customer's key stops leasing and
    # no amount of code fixes that.
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
      # READ-WRITE, and it has to be. `sqlite3 .backup` is the only copy that is
      # safe against a live writer, and the licensing database is in WAL mode:
      # SQLite needs the `-shm` wal-index to read one, and creates it in the
      # database's own directory. On `:ro` that fails — with `-shm` already
      # there it worked, and `-shm` is absent exactly when the licensing
      # container is stopped, so the nightly copy of the one database that
      # cannot be rebuilt from code produced nothing on the night it mattered
      # most, while the watchdog only ever checks file age.
      #
      # MEASURED, all four combinations, `postgres:17-alpine` + `apk add sqlite`:
      #   :ro, no -shm   -> `unable to open database file`, exit 1, no copy
      #   :ro, -shm      -> 50/50 rows
      #   :ro, ?immutable=1, no -shm -> 50/50 rows...
      #   :ro, ?immutable=1, -shm    -> ...and `no such table: keys` here, because
      #                                 immutable ignores the -wal. A copy that
      #                                 opens and is WRONG is worse than none.
      #   read-write     -> 50/50 in every case, including against a container
      #                     writing 200 rows/s throughout, which was undisturbed.
      - license-data:/license
      - ./backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh"]
    depends_on:
      postgres: { condition: service_healthy }

  watch:
    # СТОРОЖ. Превращает список из docs/operations.md §5 в механизм: раньше это
    # была инструкция человеку, а человек не смотрит.
    #
    # Отдельный контейнер, а не cron на хосте, по той же причине, что и backup:
    # хост может быть пересобран, а `restart: unless-stopped` переживает и
    # перезагрузку, и вмешательство.
    #
    # Docker-сокет проброшен, и это осознанный компромисс: доступ к нему равен
    # root на хосте. Сузить право до «читать статусы» docker не даёт, а не
    # знать, что сервис лёг, — хуже.
    image: docker:27-cli
    restart: unless-stopped
    logging: *logging
    environment:
      PSEUDEX_TG_TOKEN: ${PSEUDEX_TG_TOKEN:-}
      PSEUDEX_TG_CHAT: ${PSEUDEX_TG_CHAT:-}
      PSEUDEX_ENV_NAME: ${PSEUDEX_ENV_NAME:-prod}
      # Сторожу нужен ПОЛНЫЙ токен: он читает /admin/list, которого витрине
      # не положено. Он наш и наружу не смотрит.
      PSEUDEX_LICENSE_ADMIN_TOKEN: ${PSEUDEX_LICENSE_ADMIN_TOKEN:-}
      SITE_HOST: ${SITE_HOST}
      PSEUDEX_BACKUP_DIR: /deploy/backups
      PSEUDEX_WATCH_STATE: /state
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/deploy:ro
      - watch-state:/state
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache curl python3 openssl >/dev/null
        while :; do sh /deploy/watch.sh || true; sleep 60; done

  # ── НАБЛЮДАЕМОСТЬ, ПО ЯВНОМУ ЖЕЛАНИЮ ─────────────────────────────────────
  #
  # `profiles:` — то есть по умолчанию НЕ ПОДНИМАЕТСЯ. Сторож (`watch.sh`) уже
  # шлёт тревоги в телеграм и переживает падение чего угодно; эти два
  # контейнера дают историю и графики, а не сигнал, и платить за них памятью
  # на маленькой машине никто не обязан. Включается одной строкой:
  #
  #     docker compose --profile observability up -d
  #
  # ПОЛНЫЙ ТОКЕН ПРИЕЗЖАЕТ ФАЙЛОМ, И ТОЛЬКО ФАЙЛОМ.
  #
  # Первая версия писала его в контейнере из `${PSEUDEX_LICENSE_ADMIN_TOKEN}`
  # внутри `command:` — и это ровно та утечка, которую комментарий рядом
  # объявлял предотвращённой: подстановку `${...}` в `command` делает САМ
  # Compose, до контейнера, поэтому токен ложится открытым текстом в `Cmd`
  # образа и виден в `docker compose config`, `docker inspect`,
  # `docker ps --no-trunc` и `/proc/1/cmdline`.
  #
  # Поэтому файл. Его создаёт оператор рядом с сертификатами — тем же способом,
  # каким уже лежит `./certs`:
  #
  #     mkdir -p secrets && printf %s "$PSEUDEX_LICENSE_ADMIN_TOKEN" \
  #       > secrets/license-admin-token && chmod 600 secrets/license-admin-token
  #
  # Если файла нет, Prometheus не поднимет цель и это видно как down — отказ
  # громкий, а не молчаливый.
  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: ["observability"]
    restart: unless-stopped
    logging: *logging
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./secrets/license-admin-token:/etc/prometheus/license-admin-token:ro
      - prometheus-data:/prometheus
    # Не публикуется. Смотрят через Grafana, а сюда ходить незачем — и
    # опубликованный Prometheus это ещё один способ прочитать сводку по флоту.
    expose: ["9090"]
    depends_on:
      license: { condition: service_started }

  grafana:
    image: grafana/grafana:11.5.1
    profiles: ["observability"]
    restart: unless-stopped
    logging: *logging
    environment:
      # `:-`, А НЕ `:?`: Compose подставляет переменные ДО отбора профилей,
      # поэтому обязательная переменная у сервиса под
      # `profiles: ["observability"]` требовалась даже при обычном
      # `docker compose up -d` — опциональный сервис, который по умолчанию не
      # поднимается, блокировал основной путь.
      #
      # НО ПУСТОЙ ПАРОЛЬ САМА GRAFANA НЕ ЛОВИТ, и здесь стояло обратное.
      # Переопределения из окружения она применяет только при непустом значении
      # (`if len(envValue) > 0`), а `defaults.ini` держит `admin_password =
      # admin` — то есть «послабление» отдало бы дашборд с именами клиентов и их
      # разрывами цепи под admin/admin. Поэтому отказ переехал в entrypoint
      # ниже: он срабатывает ТОЛЬКО когда профиль реально поднимают.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-}
      # Аноним не смотрит на график, где названы организации с порванной цепью.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    # ОТКАЗ ЗДЕСЬ, А НЕ В ИНТЕРПОЛЯЦИИ. `${...:?}` сработал бы на всех, включая
    # тех, кто профиль не включает; эта проверка исполняется внутри контейнера,
    # то есть ровно тогда, когда сервис действительно запускают. `$$` — чтобы
    # переменную раскрыл шелл контейнера, а не Compose.
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -z "$$GF_SECURITY_ADMIN_PASSWORD" ]; then
          echo "GRAFANA_PASSWORD не задан. Без него Grafana поднимется с" >&2
          echo "паролем admin/admin из defaults.ini, а на дашборде видны" >&2
          echo "клиенты и их разрывы цепи. Задайте его в .env и повторите." >&2
          exit 1
        fi
        exec /run.sh
    volumes:
      - grafana-data:/var/lib/grafana
      # Дашборд лежит рядом с правилами и версионируется вместе с ними: панель,
      # нарисованная руками в UI, живёт в базе одной машины и исчезает с ней.
      - ./grafana-dashboard.json:/var/lib/grafana/dashboards/pseudex.json:ro
      # БЕЗ ПРОВИЖИНИНГА СМОНТИРОВАННЫЙ JSON — ПРОСТО ФАЙЛ В КАТАЛОГЕ. Grafana
      # читает дашборды только через провайдера, а источник данных — только из
      # своего файла; без этих двух профиль поднимал пустую Grafana, и увидеть
      # это можно было единственным способом — открыв её.
      - ./grafana-provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana-provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    # ТОЛЬКО ЛОКАЛЬНО. Смотреть — через ssh-туннель: `-p 3000:3000` опубликовал
    # бы на каждом интерфейсе облачной машины панель, которая показывает, кто
    # наши клиенты и у кого из них проблемы.
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      prometheus: { condition: service_started }

volumes:
  watch-state:
  prometheus-data:
  grafana-data:
  postgres-data:
  license-data:
  caddy-data:
  caddy-config:
