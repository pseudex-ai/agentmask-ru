# Our side of the product: the licensing server, the storefront, their database
# and a TLS front door. The customer's side is one container they run
# themselves, and nothing here ever talks to it — the traffic is one way, from
# their container to /v1/lease.
#
# DESIGNED TO RUN WITHOUT US. Every service restarts on its own, states its own
# health, and fails in a direction that is safe: the licensing server going down
# does not stop customers (they have a 24h lease and 48h of grace), and the
# storefront going down does not stop anything at all.

name: pseudex

x-logging: &logging
  # Bounded, or a year of uptime fills the disk and takes the licensing server
  # down with it — the one outage that eventually stops every customer.
  driver: json-file
  options: { max-size: "50m", max-file: "5" }

# A CONFIG FILE FROM THE CHECKOUT IS NOT PART OF THE CONTAINER'S IDENTITY.
# Compose decides whether to recreate a container by hashing the service
# definition (pkg/compose/hash.go: the ServiceConfig struct, JSON-marshalled)
# — the image, the environment, the mount PATHS. The CONTENT behind a bind
# mount is not in it, so a tag that changes only `Caddyfile`, `alerts.yml` or
# the bot's `config.yaml` leaves every container running on the old file, and
# `up -d` reports nothing to do. The rendered ones are worse: the init
# re-renders into the volume and the consumer never re-reads it.
#
# The agent therefore hands compose the tree hash of `deploy/` at the tag it
# is deploying (`git rev-parse <tag>:deploy`), and every service that mounts a
# file from the checkout carries it in its environment. A tag that touches
# `deploy/` recreates those containers; one that does not, leaves them. The
# two rendered configs propagate through `depends_on: … restart: true`: the
# consumer is stopped, the init re-renders, the consumer starts on the new
# file. Empty on a stand raised by hand — there is no tag to name, and the
# stand is rebuilt from scratch anyway.
x-conf-rev: &conf-rev ${PSEUDEX_CONF_REV:-}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pseudex}
      POSTGRES_USER: ${POSTGRES_USER:-pseudex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pseudex}"]
      interval: 10s
      timeout: 5s
      retries: 6
    # Not published. The only things that need it are on this network.
    expose: ["5432"]

  license:
    # ИЗ РЕЕСТРА, А НЕ `build:`. Сборка на боевой машине означала, что ничто
    # нигде не доказывает: то, что крутится, — это то, что прошло гейты. Образ
    # собирается, подписывается и публикуется в release.yml, а агент выкатки
    # проверяет подпись прежде, чем что-либо остановить.
    image: ${REGISTRY:-cr.yandex/pseudex}/pseudex-licensing:${VERSION:?set VERSION}
    restart: unless-stopped
    logging: *logging
    environment:
      # The signing key is the root of trust for every bundle we ever issue.
      # Injected, never baked, and rotating it invalidates every deployed
      # binary — so it is the one secret with no automated rotation.
      PSEUDEX_SIGNING_KEY: ${PSEUDEX_SIGNING_KEY:?set PSEUDEX_SIGNING_KEY}
      # Seals the compiled tuning blob and is delivered in every lease so the
      # engine can open its own tuning. THE SAME value the image was built with
      # (build-arg PSEUDEX_TUNING_KEY); rotating it invalidates every deployed
      # binary exactly like the signing key. See docs/tz-license-packaging §2.2.
      PSEUDEX_TUNING_KEY: ${PSEUDEX_TUNING_KEY:?set PSEUDEX_TUNING_KEY}
      PSEUDEX_LICENSE_DB: /data/license.db
      PSEUDEX_LEASE_TTL_SECONDS: ${LEASE_TTL:-86400}
      PSEUDEX_GRACE_SECONDS: ${GRACE:-172800}
      PSEUDEX_LICENSE_ADMIN_TOKEN: ${PSEUDEX_LICENSE_ADMIN_TOKEN:?set PSEUDEX_LICENSE_ADMIN_TOKEN}
      PSEUDEX_LICENSE_STOREFRONT_TOKEN: ${PSEUDEX_LICENSE_STOREFRONT_TOKEN:?set PSEUDEX_LICENSE_STOREFRONT_TOKEN}
    volumes:
      - license-data:/data
    healthcheck:
      # STDLIB ONLY. The image has no `httpx` — the previous probe raised
      # ModuleNotFoundError on every tick and the server was «unhealthy» for
      # as long as this file has existed. A healthcheck is code that runs in
      # the image, not in the developer's virtualenv.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8443/v1/pubkey',timeout=5).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    # PLAIN HTTP, BEHIND CADDY, NO HOST PORT. This used to publish `443:8443`
    # with its own certificate from `./certs` — and Caddy, which owns the
    # storefront's TLS, was pushed to `8443:443`, so `https://pseudex.ru` would
    # have answered with the LICENSING server and the website lived on a port
    # no browser types. Both names resolve to one machine; one process must
    # terminate TLS for both, and Caddy is the one that renews certificates by
    # itself. The client verifies against the system CA store (`license.py`:
    # `verify=True` unless a CA is pinned), so Let's Encrypt is what it expects.
    # The healthcheck above was also only ever right for plain HTTP.
    #
    # The admin app stays on the internal network only. Publishing it would put
    # key issuance on the internet.
    expose: ["8443", "9443"]

  storefront-migrate:
    # SCHEMA AND TARIFFS BEFORE THE FIRST REQUEST. The local stand ran
    # `migrate` + `seed_plans` in the storefront's own `command:`; this file
    # never did, so a fresh host answered the landing page with «relation
    # billing_plan does not exist» — found by raising the production compose
    # file. A one-shot service, like the two config renders: the storefront
    # and the billing cycle start only after it has completed, and `--wait`
    # accepts a completed init. Both commands are idempotent (`seed_plans` is a
    # management command for exactly that reason), so every `up -d` re-runs it.
    image: ${REGISTRY:-cr.yandex/pseudex}/pseudex-storefront:${VERSION:?set VERSION}
    restart: "no"
    logging: *logging
    environment:
      PSEUDEX_SECRET_KEY: ${PSEUDEX_SECRET_KEY:?set PSEUDEX_SECRET_KEY}
      PSEUDEX_DEBUG: "0"
      PSEUDEX_ALLOWED_HOSTS: ${SITE_HOST:?set SITE_HOST}
      PSEUDEX_DB_HOST: postgres
      PSEUDEX_DB_NAME: ${POSTGRES_DB:-pseudex}
      PSEUDEX_DB_USER: ${POSTGRES_USER:-pseudex}
      PSEUDEX_DB_PASSWORD: ${POSTGRES_PASSWORD}
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py seed_plans"]
    depends_on:
      postgres: { condition: service_healthy }

  storefront:
    image: ${REGISTRY:-cr.yandex/pseudex}/pseudex-storefront:${VERSION:?set VERSION}
    # РЕКВИЗИТЫ ПРОДАВЦА ОТДЕЛЬНЫМ ФАЙЛОМ, а не десятью строками здесь.
    # Они меняются (банк, адрес, телефон) и не должны требовать правки
    # compose; плюс файл в .gitignore, а адрес регистрации ИП — это домашний
    # адрес, и в репозиторий он попадать не должен.
    #
    # `required: false` — чтобы стенд поднимался и БЕЗ реквизитов: страницы
    # тогда честно говорят, что они не заполнены, а счёт нельзя предъявить к
    # оплате. Это правильный исход, а не поломка.
    env_file:
      - path: .env.seller
        required: false
    restart: unless-stopped
    logging: *logging
    environment:
      PSEUDEX_SECRET_KEY: ${PSEUDEX_SECRET_KEY:?set PSEUDEX_SECRET_KEY}
      PSEUDEX_DEBUG: "0"
      PSEUDEX_ALLOWED_HOSTS: ${SITE_HOST:?set SITE_HOST}
      PSEUDEX_CSRF_ORIGINS: https://${SITE_HOST}
      PSEUDEX_ADMIN_PATH: ${ADMIN_PATH:-admin}
      PSEUDEX_DB_HOST: postgres
      PSEUDEX_DB_NAME: ${POSTGRES_DB:-pseudex}
      PSEUDEX_DB_USER: ${POSTGRES_USER:-pseudex}
      PSEUDEX_DB_PASSWORD: ${POSTGRES_PASSWORD}
      PSEUDEX_LICENSING_ADMIN_URL: http://license:9443
      # Витрине — только меньший токен. Полный ей не нужен и лежать у неё не должен.
      PSEUDEX_LICENSE_STOREFRONT_TOKEN: ${PSEUDEX_LICENSE_STOREFRONT_TOKEN:?set PSEUDEX_LICENSE_STOREFRONT_TOKEN}
      PSEUDEX_DOCKER_IMAGE: ${CUSTOMER_IMAGE:-cr.yandex/pseudex/pseudex:1.0.0}
      PSEUDEX_SMTP_HOST: ${SMTP_HOST:-}
      PSEUDEX_SMTP_USER: ${SMTP_USER:-}
      PSEUDEX_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      PSEUDEX_FROM_EMAIL: ${FROM_EMAIL:-pseudex <noreply@pseudex.ru>}
    healthcheck:
      # Витрина была единственным сервисом на пути клиента без проверки: Django,
      # уронивший себя миграцией, отвечал бы `running` бесконечно, а агент
      # выкатки счёл бы это успехом.
      # THE REQUEST AS CADDY SENDS IT: the site's Host and X-Forwarded-Proto.
      # `ALLOWED_HOSTS` is exactly SITE_HOST, so a probe arriving as
      # `127.0.0.1:8000` got Django's 400 DisallowedHost; with the Host fixed
      # it got the 301 to https that SECURE_SSL_REDIRECT issues for anything
      # not marked as forwarded from TLS. Either way the container could never
      # become healthy and the agent's `--wait` would have rolled back every
      # release. Found by raising the production compose file, which no test
      # had done. The Host comes from the same variable the setting reads, so
      # the two cannot disagree.
      test: ["CMD-SHELL", "python -c \"import os,urllib.request,sys; r=urllib.request.Request('http://127.0.0.1:8000/healthz', headers={'Host': os.environ['PSEUDEX_ALLOWED_HOSTS'].split(',')[0], 'X-Forwarded-Proto': 'https'}); sys.exit(0 if urllib.request.urlopen(r, timeout=5).status==200 else 1)\""]
      interval: 15s
      timeout: 10s
      retries: 4
      start_period: 40s
    depends_on:
      storefront-migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      license: { condition: service_started }
    expose: ["8000"]

  billing:
    # БИЗНЕС-ЦИКЛ. Без него `build_invoice`, `mark_unpaid` и `mark_paid` —
    # исправные механизмы, которых никто не зовёт: триал не кончается, счёт не
    # выставляется, неплательщик работает вечно. Ровно так и было, и снаружи
    # это выглядит как продукт, который работает.
    #
    # Отдельный сервис на ТОМ ЖЕ образе, а не cron на хосте и не поток внутри
    # gunicorn: у витрины несколько воркеров, и цикл внутри неё запускался бы
    # N раз одновременно. Команда идемпотентна (счёт за период существует
    # строкой в базе), так что дубль безвреден — но безвреден он именно потому,
    # что на него никто не рассчитывает.
    #
    # Раз в час, а не раз в сутки: просрочка меряется днями, но ОПЛАТА должна
    # возвращать обслуживание быстро, а сторож повторного возобновления живёт
    # в этой же команде.
    image: ${REGISTRY:-cr.yandex/pseudex}/pseudex-storefront:${VERSION:?set VERSION}
    restart: unless-stopped
    logging: *logging
    environment:
      PSEUDEX_SECRET_KEY: ${PSEUDEX_SECRET_KEY:?set PSEUDEX_SECRET_KEY}
      PSEUDEX_DEBUG: "0"
      PSEUDEX_ALLOWED_HOSTS: ${SITE_HOST:?set SITE_HOST}
      PSEUDEX_DB_HOST: postgres
      PSEUDEX_DB_NAME: ${POSTGRES_DB:-pseudex}
      PSEUDEX_DB_USER: ${POSTGRES_USER:-pseudex}
      PSEUDEX_DB_PASSWORD: ${POSTGRES_PASSWORD}
      PSEUDEX_LICENSING_ADMIN_URL: http://license:9443
      PSEUDEX_LICENSE_STOREFRONT_TOKEN: ${PSEUDEX_LICENSE_STOREFRONT_TOKEN:?set PSEUDEX_LICENSE_STOREFRONT_TOKEN}
      # Ссылка на счёт уходит письмом, а у планировщика нет запроса, из
      # которого её можно построить.
      PSEUDEX_SITE_URL: https://${SITE_HOST}
      PSEUDEX_SMTP_HOST: ${SMTP_HOST:-}
      PSEUDEX_SMTP_USER: ${SMTP_USER:-}
      PSEUDEX_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      PSEUDEX_FROM_EMAIL: ${FROM_EMAIL:-pseudex <noreply@pseudex.ru>}
      # THE DAILY DIGEST GOES THROUGH `notify.sh`, THE WATCHER'S CHANNEL — and
      # the script plus its two variables were mounted for the watcher only.
      # `daily_digest` then printed the digest to the log with «сводка
      # напечатана, а не отправлена», every morning, to nobody. Found by
      # raising the production compose file.
      PSEUDEX_TG_TOKEN: ${PSEUDEX_TG_TOKEN:-}
      PSEUDEX_TG_CHAT: ${PSEUDEX_TG_CHAT:-}
    depends_on:
      storefront-migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      license: { condition: service_started }
    volumes:
      # AT `/data`, NOT `/state`: the image runs as uid 10001 and owns `/data`
      # (Dockerfile), and Docker copies a mount point's ownership from the
      # image into a fresh named volume. `/state` did not exist in the image,
      # so the volume was created root-owned, `date > /state/last-ok` answered
      # «Permission denied», and the service — whose health IS that stamp —
      # could never be healthy. Found by raising the production compose file.
      - billing-state:/data
      - ./notify.sh:/deploy/notify.sh:ro
    # ЗДОРОВЬЕ = «ПОСЛЕДНИЙ ПРОХОД УДАЛСЯ», а не «процесс существует». Отметка
    # ставится ТОЛЬКО на успешном проходе, поэтому падающая каждый час команда
    # делает контейнер нездоровым за два часа, и сторож это видит своей
    # проверкой контейнеров, ничего про биллинг не зная.
    healthcheck:
      test: ["CMD-SHELL", "test -f /data/last-ok && [ $(( $(date +%s) - $(cat /data/last-ok) )) -lt 7500 ]"]
      interval: 300s
      timeout: 10s
      retries: 2
      # Первый проход происходит сразу на старте, но контейнеру надо успеть
      # дождаться postgres и лицензионного сервера.
      start_period: 180s
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # Час — шаг цикла. Свёртка и сводка идут РАЗ В СУТКИ, и отметка о том,
        # что они уже сделаны сегодня, лежит файлом: контейнер перезапускается
        # чаще, чем раз в сутки, и без отметки сводка приходила бы на каждый
        # рестарт.
        while :; do
          if python manage.py run_billing_cycle; then
            date +%s > /data/last-ok
          else
            echo "billing cycle failed"
          fi
          TODAY="$$(date +%F)"
          if [ "$$(cat /data/last-daily 2>/dev/null)" != "$$TODAY" ]; then
            HOUR="$$(date +%H)"
            # После девяти утра по времени контейнера: сводка, пришедшая в три
            # ночи, читается утром вместе со следующей и теряет половину смысла.
            if [ "$$HOUR" -ge 9 ]; then
              python manage.py rollup_analytics || echo "rollup failed"
              python manage.py daily_digest || echo "digest failed"
              echo "$$TODAY" > /data/last-daily
            fi
          fi
          sleep 3600
        done

  caddy:
    # TLS with automatic certificates and renewal. Chosen over nginx+certbot
    # because renewal is the part that silently stops working, and here it is
    # not a cron job that can fail unnoticed.
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      SITE_HOST: ${SITE_HOST}
      LICENSE_HOST: ${LICENSE_HOST:?set LICENSE_HOST}
      PSEUDEX_CONF_REV: *conf-rev   # Caddyfile is mounted from the checkout
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    # THE SITE'S OWN NAMES POINT BACK AT THIS CONTAINER, so the healthcheck can
    # ask for `https://pseudex.ru/healthz` from inside: the SNI is the real
    # name, Caddy answers with the real certificate, busybox wget verifies it
    # against the system store, and the request goes on to the storefront.
    # The previous probe hit `http://127.0.0.1/`, was 308-redirected to
    # `https://127.0.0.1/`, and died on a TLS alert — Caddy has no certificate
    # for an IP — so Caddy was «unhealthy» on every tick, forever.
    extra_hosts:
      - "${SITE_HOST}:127.0.0.1"
      - "${LICENSE_HOST:-license.invalid}:127.0.0.1"
    healthcheck:
      # Не «процесс жив», а «отдаёт ОБА сайта по TLS»: конфиг загружен,
      # сертификаты выданы, апстримы отвечают. Caddy, потерявший конфиг или
      # сертификат, продолжает работать и отвечать ошибкой — именно это и
      # ловится. `$$` — переменную читает shell контейнера, не compose.
      test: ["CMD-SHELL", "wget -q --spider \"https://$$SITE_HOST/healthz\" && wget -q --spider \"https://$$LICENSE_HOST/v1/pubkey\" || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 3
      # Let's Encrypt needs the DNS record and a round trip; the first minute
      # after a fresh start is issuance, not failure.
      start_period: 90s
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - storefront
      - license

  backup:
    # Both databases, nightly, kept for a month. The licensing database is the
    # one that matters: losing it means every customer's key stops leasing and
    # no amount of code fixes that.
    # СВОЙ ОБРАЗ, А НЕ `postgres:17-alpine`. Базовый не несёт `sqlite3`, поэтому
    # каждая ночная копия лицензионной базы молча бралась `cp` с живой WAL-базы
    # — копия, которая открывается и врёт, — а сторож смотрит только на возраст
    # файла. Строка `apk add` в скрипте это затыкала, и ровно до первой ночи без
    # сети: инструмент, нужный для спасения, обязан лежать рядом заранее.
    image: ${REGISTRY:-cr.yandex/pseudex}/pseudex-backup:${VERSION:?set VERSION}
    restart: unless-stopped
    logging: *logging
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      # ВЫВОЗ С ХОСТА. Пусто — вывоза нет, и цикл честно говорит об этом каждую
      # ночь; локальные копии делаются в любом случае.
      #
      # КЛЮЧУ ХОСТА ЗАПРЕЩЁН `DeleteObject` ПОЛИТИКОЙ БАКЕТА. Шифровальщик
      # первым делом стирает бэкапы и только потом шифрует, поэтому `prune`
      # ходит НЕ ОТСЮДА, а из GitHub Actions другим ключом — тем же движением,
      # что и `restic check`.
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
      AWS_ACCESS_KEY_ID: ${OFFSITE_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${OFFSITE_KEY_SECRET:-}
      # Yandex Object Storage требует назвать регион; `ru-central1` — его
      # единственный, и без него aws-подпись restic не сходится.
      AWS_DEFAULT_REGION: ${OFFSITE_REGION:-ru-central1}
    volumes:
      - ./backups:/backups
      # READ-WRITE, and it has to be. `sqlite3 .backup` is the only copy that is
      # safe against a live writer, and the licensing database is in WAL mode:
      # SQLite needs the `-shm` wal-index to read one, and creates it in the
      # database's own directory. On `:ro` that fails — with `-shm` already
      # there it worked, and `-shm` is absent exactly when the licensing
      # container is stopped, so the nightly copy of the one database that
      # cannot be rebuilt from code produced nothing on the night it mattered
      # most, while the watchdog only ever checks file age.
      #
      # MEASURED, all four combinations, `postgres:17-alpine` + `apk add sqlite`:
      #   :ro, no -shm   -> `unable to open database file`, exit 1, no copy
      #   :ro, -shm      -> 50/50 rows
      #   :ro, ?immutable=1, no -shm -> 50/50 rows...
      #   :ro, ?immutable=1, -shm    -> ...and `no such table: keys` here, because
      #                                 immutable ignores the -wal. A copy that
      #                                 opens and is WRONG is worse than none.
      #   read-write     -> 50/50 in every case, including against a container
      #                     writing 200 rows/s throughout, which was undisturbed.
      - license-data:/license
      - ./backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh"]
    depends_on:
      postgres: { condition: service_healthy }

  watch:
    # СТОРОЖ. Превращает список из docs/operations.md §5 в механизм: раньше это
    # была инструкция человеку, а человек не смотрит.
    #
    # Отдельный контейнер, а не cron на хосте, по той же причине, что и backup:
    # хост может быть пересобран, а `restart: unless-stopped` переживает и
    # перезагрузку, и вмешательство.
    #
    # Docker-сокет проброшен, и это осознанный компромисс: доступ к нему равен
    # root на хосте. Сузить право до «читать статусы» docker не даёт, а не
    # знать, что сервис лёг, — хуже.
    image: docker:27-cli
    restart: unless-stopped
    logging: *logging
    environment:
      PSEUDEX_TG_TOKEN: ${PSEUDEX_TG_TOKEN:-}
      PSEUDEX_TG_CHAT: ${PSEUDEX_TG_CHAT:-}
      PSEUDEX_ENV_NAME: ${PSEUDEX_ENV_NAME:-prod}
      # Сторожу нужен ПОЛНЫЙ токен: он читает /admin/list, которого витрине
      # не положено. Он наш и наружу не смотрит.
      PSEUDEX_LICENSE_ADMIN_TOKEN: ${PSEUDEX_LICENSE_ADMIN_TOKEN:-}
      SITE_HOST: ${SITE_HOST}
      PSEUDEX_BACKUP_DIR: /deploy/backups
      PSEUDEX_WATCH_STATE: /state
      # ТОЛЬКО ЧТОБЫ ЗНАТЬ, НАСТРОЕН ЛИ ВЫВОЗ. Ни ключей, ни пароля репозитория
      # здесь нет и быть не должно: сторож отвечает на вопрос «вывоз работает»
      # по отметке, которую ставит бэкап, и доступ к хранилищу ему не нужен.
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/deploy:ro
      - watch-state:/state
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache curl python3 openssl >/dev/null
        while :; do sh /deploy/watch.sh || true; sleep 60; done
    # СТОРОЖ, КОТОРЫЙ УПАЛ, ОСТАЁТСЯ `running` — ЭТО РОВНО ТА БОЛЕЗНЬ, КОТОРУЮ
    # ОН САМ ЛЕЧИТ У ДРУГИХ. `while :; do ... || true; done` крутится вечно, чем
    # бы ни кончался каждый обход, поэтому сломанный `watch.sh` выглядит как
    # исправно работающий сервис. Отметка ставится только ЗАВЕРШЁННЫМ обходом,
    # и здоровье означает «последний обход дошёл до конца», а не «процесс жив».
    healthcheck:
      test: ["CMD-SHELL", "test -f /state/.last-sweep && [ $$(( $$(date -u +%s) - $$(cat /state/.last-sweep) )) -lt 300 ]"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s

  # ── НАБЛЮДАЕМОСТЬ, ПО ЯВНОМУ ЖЕЛАНИЮ ─────────────────────────────────────
  #
  # `profiles:` — то есть по умолчанию НЕ ПОДНИМАЕТСЯ. Сторож (`watch.sh`) уже
  # шлёт тревоги в телеграм и переживает падение чего угодно; эти два
  # контейнера дают историю и графики, а не сигнал, и платить за них памятью
  # на маленькой машине никто не обязан. Включается одной строкой в `.env`:
  #
  #     COMPOSE_PROFILES=observability,support
  #
  # В `.env`, А НЕ ФЛАГОМ `--profile`: агент выкатывает `up -d` без флагов, и
  # сервис, включённый флагом однажды, он не обновляет и не сносит как лишний
  # (compose не считает отключённые профилем сервисы orphan-ами).
  #
  # ПОЛНЫЙ ТОКЕН ПРИЕЗЖАЕТ ФАЙЛОМ, И ТОЛЬКО ФАЙЛОМ.
  #
  # Первая версия писала его в контейнере из `${PSEUDEX_LICENSE_ADMIN_TOKEN}`
  # внутри `command:` — и это ровно та утечка, которую комментарий рядом
  # объявлял предотвращённой: подстановку `${...}` в `command` делает САМ
  # Compose, до контейнера, поэтому токен ложится открытым текстом в `Cmd`
  # образа и виден в `docker compose config`, `docker inspect`,
  # `docker ps --no-trunc` и `/proc/1/cmdline`.
  #
  # Поэтому файл. Его создаёт оператор на хосте, рядом с `.env`:
  #
  #     mkdir -p secrets && printf %s "$PSEUDEX_LICENSE_ADMIN_TOKEN" \
  #       > secrets/license-admin-token && chmod 600 secrets/license-admin-token
  #
  # Если файла нет, Prometheus не поднимет цель и это видно как down — отказ
  # громкий, а не молчаливый.
  supportbot-config:
    # РЕНДЕР КОНФИГА БОТА ПОДДЕРЖКИ. Бот читает `config/config.yaml` и переменных
    # окружения не знает, а держать токен в гите нельзя. Тот же приём, что у
    # Alertmanager: одноразовый сервис, и бот не стартует, пока рендер не удался.
    image: alpine:3.21
    profiles: ["support"]
    restart: "no"
    logging: *logging
    volumes:
      - ./supportbot/config.yaml:/in/config.yaml:ro
      - supportbot-config:/out
    environment:
      # `:-`, НЕ `:?` — то же правило, что у alertmanager-config: профильный сервис
      # не имеет права требовать переменную. Пустоту ловит рендер ниже.
      PSEUDEX_SUPPORT_BOT_TOKEN: ${PSEUDEX_SUPPORT_BOT_TOKEN:-}
      PSEUDEX_SUPPORT_CHAT: ${PSEUDEX_SUPPORT_CHAT:-}
      PSEUDEX_SUPPORT_OWNER: ${PSEUDEX_SUPPORT_OWNER:-}
      PSEUDEX_CONF_REV: *conf-rev   # config.yaml template from the checkout
    # FOUR DOLLARS IN `eval "val=\$$$$v"`, NOT THREE. Compose turns `$$` into
    # `$` and interpolates a lone `$v` itself — `\$$$v` reached the shell as
    # `val=\$`, the guard read a literal "$" as "set", and an empty token went
    # straight into the render. `docker compose config` said so («"v" variable
    # is not set») and nobody was listening; checks.yml now refuses that
    # warning. A YAML comment, not a shell one: inside the block scalar a
    # comment is still interpolated.
    command:
      - sh
      - -c
      - |
        set -eu
        for v in PSEUDEX_SUPPORT_BOT_TOKEN PSEUDEX_SUPPORT_CHAT PSEUDEX_SUPPORT_OWNER; do
          eval "val=\$$$$v"; [ -n "$$val" ] || { echo "в deploy/.env пуст $$v — бот поддержки не поднимется"; exit 1; }
        done
        sed -e "s|__PSEUDEX_SUPPORT_BOT_TOKEN__|$$PSEUDEX_SUPPORT_BOT_TOKEN|" \
            -e "s|__PSEUDEX_SUPPORT_CHAT__|$$PSEUDEX_SUPPORT_CHAT|g" \
            -e "s|__PSEUDEX_SUPPORT_OWNER__|$$PSEUDEX_SUPPORT_OWNER|" \
            /in/config.yaml > /out/config.yaml
        grep -q '__PSEUDEX_' /out/config.yaml && { echo "плейсхолдер не заменён"; exit 1; } || true
        grep -qE "^staffchat_id: '-100[0-9]+'$" /out/config.yaml || { echo "staffchat_id — не супергруппа (нужен -100…)"; exit 1; }
        echo "config.yaml бота отрендерен"

  supportbot:
    # БОТ ПОДДЕРЖКИ — bostrot/telegram-support-bot, ОТДЕЛЬНЫЙ от ops-бота
    # (docs/decisions.md, 29.08.2026): требования к видимости противоположны,
    # область компрометации разная, один токен на оба отдал бы канал тревог
    # разговорной поверхности. Долгий опрос — исходящее соединение, порт
    # наружу не нужен.
    image: ${REGISTRY:-cr.yandex/pseudex}/pseudex-supportbot:${VERSION:-}
    profiles: ["support"]
    restart: unless-stopped
    logging: *logging
    volumes:
      - supportbot-config:/bot/config:ro
    # NO `MONGO_URI` HERE: the bot reads `mongodb_uri` from its config, and
    # its built-in default for that key (`mongodb://mongodb:27017/support`)
    # wins over the environment variable — `db.js: config?.mongodb_uri ||
    # process.env.MONGO_URI`. With the env set and the config silent the bot
    # looked for a host called `mongodb` and restarted forever. The URI is in
    # `supportbot/config.yaml`, next to everything else it reads.
    depends_on:
      # `restart: true` — WITHOUT IT A RE-RENDER IS WRITTEN AND NEVER READ. The
      # init is recreated when `.env` or the template changes, renders into the
      # volume, and the bot would keep the config it started with.
      supportbot-config: { condition: service_completed_successfully, restart: true }
      supportbot-db: { condition: service_healthy }

  supportbot-db:
    # MongoDB — потому что апстрим на ней, и переписывать его хранилище ради
    # Postgres значило бы поддерживать форк. Наружу не публикуется, том свой.
    # В БЭКАП НЕ ВХОДИТ НАМЕРЕННО: тикеты — переписка, а не запись, которую
    # обязаны хранить; потеря истории поддержки — неприятность, а не отказ.
    image: mongo:8.0
    profiles: ["support"]
    restart: unless-stopped
    logging: *logging
    volumes:
      - supportbot-db:/data/db
    expose: ["27017"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  alertmanager-config:
    # ОДНОРАЗОВЫЙ РЕНДЕР КОНФИГА ТРЕВОГ. Alertmanager не раскрывает переменные
    # окружения и отвергает `chat_id: 0`, поэтому настоящий идентификатор чата
    # обязан оказаться в файле. Вторая копия значения в гите однажды разойдётся
    # с `.env` — и узнается это в аварии, когда тревога уйдёт в чат, из
    # которого все вышли.
    #
    # `service_completed_successfully` НИЖЕ — ЭТО И ЕСТЬ ГАРАНТИЯ. Не «рендер
    # обычно успевает», а «Alertmanager не стартует, пока рендер не завершился
    # успешно»: пустой или недорендеренный конфиг не поднимется молча.
    image: alpine:3.21
    profiles: ["observability"]
    restart: "no"
    logging: *logging
    volumes:
      - ./alertmanager.yml:/in/alertmanager.yml:ro
      - alertmanager-config:/out
    # `$$` — ПОДСТАНОВКУ ДЕЛАЕТ ШЕЛЛ, А НЕ COMPOSE. Через `${...}` значение
    # попало бы в `docker inspect` и, что хуже, пустая переменная превратилась
    # бы в пустую строку внутри уже отрендеренного файла — то есть в тихо
    # сломанный конфиг вместо громкого отказа.
    environment:
      # `:-`, НЕ `:?` — правило этого файла (см. grafana): compose подставляет
      # значения ДО отбора профилей, и `:?` здесь ломал бы обычный `up -d`.
      # Пустоту ловит скрипт рендера ниже — громко и с причиной.
      PSEUDEX_TG_CHAT: ${PSEUDEX_TG_CHAT:-}
      PSEUDEX_CONF_REV: *conf-rev   # alertmanager.yml template from the checkout
    command:
      - sh
      - -c
      - |
        set -eu
        sed "s/__PSEUDEX_TG_CHAT__/$$PSEUDEX_TG_CHAT/" /in/alertmanager.yml > /out/alertmanager.yml
        grep -q '__PSEUDEX_TG_CHAT__' /out/alertmanager.yml && { echo "рендер не заменил плейсхолдер"; exit 1; } || true
        # ЯКОРЬ НА НАЧАЛО СТРОКИ — НЕ ПЕДАНТИЗМ. Без него `grep` находил
        # `chat_id: 0` внутри КОММЕНТАРИЯ этого же файла и объявлял пустую
        # подстановку успешной: проверка, удовлетворённая не тем местом.
        grep -qE '^[[:space:]]+chat_id: -?[0-9]+$' /out/alertmanager.yml || { echo "chat_id не число"; exit 1; }
        echo "alertmanager.yml отрендерен"

  alertmanager:
    # ДЕСЯТЬ ПРАВИЛ ТРЕВОГ СРАБАТЫВАЛИ В НИКУДА. `alerts.yml` описывает падение
    # лицензионного сервера, разрывы цепи отчётов, истёкшие лизы и выход
    # воркеров за бюджет памяти — а в `prometheus.yml` стояло `targets: []`, то
    # есть увидеть тревогу можно было, только открыв Prometheus руками. Правило,
    # которое никого не будит, — это комментарий, записанный в YAML.
    #
    # ТОТ ЖЕ КАНАЛ, ЧТО У СТОРОЖА, и это не лень: у оператора должно быть ОДНО
    # место, куда смотреть в три ночи. Два канала означают, что один из них
    # рано или поздно окажется не настроен, и узнается это в аварии.
    image: prom/alertmanager:v0.28.0
    profiles: ["observability"]
    restart: unless-stopped
    logging: *logging
    volumes:
      - alertmanager-config:/etc/alertmanager
      # ТОКЕН ФАЙЛОМ, А НЕ ПЕРЕМЕННОЙ — по той же причине, по которой так лежит
      # админский токен Prometheus: подстановку `${...}` в compose делает сам
      # Compose, и секрет оказался бы в `docker inspect`. Alertmanager к тому же
      # не раскрывает переменные окружения в своём конфиге вовсе, так что файл
      # здесь — единственный путь, а не предпочтение.
      - ./secrets/tg-bot-token:/etc/alertmanager/tg-token:ro
      - alertmanager-data:/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      # Ссылка в письме тревоги ведёт в Grafana, а не в неопубликованный
      # Prometheus: человек всё равно пойдёт смотреть график.
      - --web.external-url=https://${SITE_HOST:-pseudex.ru}/grafana
    expose: ["9093"]
    depends_on:
      # `restart: true` — see supportbot: a changed chat id or template is
      # rendered into the volume, and Alertmanager re-reads it only if
      # restarted. Compose restarts it after the init, not before.
      alertmanager-config: { condition: service_completed_successfully, restart: true }

  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: ["observability"]
    restart: unless-stopped
    logging: *logging
    environment:
      PSEUDEX_CONF_REV: *conf-rev   # prometheus.yml, alerts.yml from the checkout
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./secrets/license-admin-token:/etc/prometheus/license-admin-token:ro
      - prometheus-data:/prometheus
    # Не публикуется. Смотрят через Grafana, а сюда ходить незачем — и
    # опубликованный Prometheus это ещё один способ прочитать сводку по флоту.
    expose: ["9090"]
    depends_on:
      license: { condition: service_started }
      alertmanager: { condition: service_started }

  loki:
    # ЛОГИ ИЩУТСЯ ПО МЕТКАМ, СОДЕРЖИМОЕ НЕ ИНДЕКСИРУЕТСЯ. Это и есть разница с
    # ELK: Elasticsearch индексирует каждое слово и один съедает больше памяти,
    # чем весь остальной стек, а на объёме одной машины выигрыш в удобстве
    # нулевой.
    image: grafana/loki:3.3.2
    profiles: ["observability"]
    restart: unless-stopped
    logging: *logging
    environment:
      PSEUDEX_CONF_REV: *conf-rev   # loki.yml from the checkout
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    expose: ["3100"]

  promtail:
    # ЧИТАЕТ ТЕ ЖЕ json-ФАЙЛЫ, ЧТО И `docker logs`, и ничего не отнимает.
    # Лог-драйвер Loki отобрал бы `docker logs` — а это то, чем чинят упавший
    # Loki и чем пользуется сторож.
    image: grafana/promtail:3.3.2
    profiles: ["observability"]
    restart: unless-stopped
    logging: *logging
    environment:
      PSEUDEX_CONF_REV: *conf-rev   # promtail.yml from the checkout
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - ./promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - promtail-positions:/positions
    depends_on:
      loki: { condition: service_started }

  grafana:
    image: grafana/grafana:11.5.1
    profiles: ["observability"]
    restart: unless-stopped
    logging: *logging
    environment:
      PSEUDEX_CONF_REV: *conf-rev   # dashboards and provisioning from the checkout
      # `:-`, А НЕ `:?`: Compose подставляет переменные ДО отбора профилей,
      # поэтому обязательная переменная у сервиса под
      # `profiles: ["observability"]` требовалась даже при обычном
      # `docker compose up -d` — опциональный сервис, который по умолчанию не
      # поднимается, блокировал основной путь.
      #
      # НО ПУСТОЙ ПАРОЛЬ САМА GRAFANA НЕ ЛОВИТ, и здесь стояло обратное.
      # Переопределения из окружения она применяет только при непустом значении
      # (`if len(envValue) > 0`), а `defaults.ini` держит `admin_password =
      # admin` — то есть «послабление» отдало бы дашборд с именами клиентов и их
      # разрывами цепи под admin/admin. Поэтому отказ переехал в entrypoint
      # ниже: он срабатывает ТОЛЬКО когда профиль реально поднимают.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-}
      # Аноним не смотрит на график, где названы организации с порванной цепью.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    # ОТКАЗ ЗДЕСЬ, А НЕ В ИНТЕРПОЛЯЦИИ. `${...:?}` сработал бы на всех, включая
    # тех, кто профиль не включает; эта проверка исполняется внутри контейнера,
    # то есть ровно тогда, когда сервис действительно запускают. `$$` — чтобы
    # переменную раскрыл шелл контейнера, а не Compose.
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -z "$$GF_SECURITY_ADMIN_PASSWORD" ]; then
          echo "GRAFANA_PASSWORD не задан. Без него Grafana поднимется с" >&2
          echo "паролем admin/admin из defaults.ini, а на дашборде видны" >&2
          echo "клиенты и их разрывы цепи. Задайте его в .env и повторите." >&2
          exit 1
        fi
        exec /run.sh
    volumes:
      - grafana-data:/var/lib/grafana
      # Дашборд лежит рядом с правилами и версионируется вместе с ними: панель,
      # нарисованная руками в UI, живёт в базе одной машины и исчезает с ней.
      - ./grafana-dashboard.json:/var/lib/grafana/dashboards/pseudex.json:ro
      # БЕЗ ПРОВИЖИНИНГА СМОНТИРОВАННЫЙ JSON — ПРОСТО ФАЙЛ В КАТАЛОГЕ. Grafana
      # читает дашборды только через провайдера, а источник данных — только из
      # своего файла; без этих двух профиль поднимал пустую Grafana, и увидеть
      # это можно было единственным способом — открыв её.
      - ./grafana-provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana-provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    # ТОЛЬКО ЛОКАЛЬНО. Смотреть — через ssh-туннель: `-p 3000:3000` опубликовал
    # бы на каждом интерфейсе облачной машины панель, которая показывает, кто
    # наши клиенты и у кого из них проблемы.
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      prometheus: { condition: service_started }

volumes:
  watch-state:
  billing-state:
  prometheus-data:
  loki-data:
  promtail-positions:
  alertmanager-data:
  supportbot-config:
  supportbot-db:
  alertmanager-config:
  grafana-data:
  postgres-data:
  license-data:
  caddy-data:
  caddy-config:
