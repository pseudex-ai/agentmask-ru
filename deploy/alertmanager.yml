# Куда идут тревоги Prometheus.
#
# ДО ЭТОГО ФАЙЛА ИХ НЕ БЫЛО КУДА ОТПРАВЛЯТЬ. В `prometheus.yml` стояло
# `targets: []` с комментарием «подставьте свой alertmanager», и десять правил
# из `alerts.yml` — падение лицензионного сервера, разрывы цепи отчётов,
# истёкшие лизы, воркеры за бюджетом памяти — срабатывали в никуда. Увидеть их
# можно было только открыв Prometheus руками, то есть тогда, когда уже знаешь,
# что что-то не так. Правило, которое никого не будит, это комментарий,
# записанный в YAML.
#
# ТОТ ЖЕ КАНАЛ, ЧТО У СТОРОЖА, И ЭТО РЕШЕНИЕ. У оператора должно быть ОДНО
# место, куда смотреть в три ночи. Два канала означают, что один из них рано или
# поздно окажется ненастроенным, и выяснится это в аварии.

global:
  # Тревога, переставшая приходить, считается погашенной через это время. Взято
  # заметно больше самого длинного интервала скрейпа, иначе одна пропущенная выборка
  # присылает «отбой» и следом новую тревогу.
  resolve_timeout: 10m

route:
  receiver: telegram
  # ГРУППИРУЕМ ПО ИМЕНИ ТРЕВОГИ, А НЕ ПО ИНСТАНСУ. Двадцать воркеров, вышедших
  # за бюджет памяти, — это одно событие, а не двадцать сообщений в три ночи.
  group_by: ["alertname"]
  # Полминуты, чтобы собрать в одно сообщение всё, что падает вместе: при
  # отказе хоста правила срабатывают каскадом, и каскад — это одна авария.
  group_wait: 30s
  group_interval: 5m
  # НЕ ЧАЩЕ РАЗА В ПОЛСУТОК ПО ОДНОЙ И ТОЙ ЖЕ. Тревога, повторяющаяся каждые
  # пять минут, перестаёт читаться за час, и вместе с ней перестают читаться
  # все остальные.
  repeat_interval: 12h

  routes:
    # ЛИЦЕНЗИОННЫЙ СЕРВЕР И ЦЕПЬ ОТЧЁТОВ — БЕЗ ЗАДЕРЖКИ И ЧАЩЕ. Первое
    # останавливает КАЖДУЮ установку в поле (движок без лиза не детектирует
    # вовсе), второе означает, что счёт клиенту уже считается неправильно.
    - matchers: ['alertname=~"PseudexLicensingDown|PseudexReportChainBroken|PseudexLicenseExpired"']
      receiver: telegram
      group_wait: 0s
      repeat_interval: 2h

receivers:
  - name: telegram
    telegram_configs:
      - send_resolved: true
        bot_token_file: /etc/alertmanager/tg-token
        # ПОДСТАВЛЯЕТСЯ ПРИ ПОДЪЁМЕ СТЕКА, А НЕ РУКАМИ. Alertmanager не
        # раскрывает переменные окружения в своём конфиге и отвергает
        # `chat_id: 0` при валидации, поэтому значение обязано быть настоящим —
        # то есть либо второй копией в гите, либо рендером. Вторая копия
        # означает, что однажды тревоги поедут в чат, из которого все вышли, и
        # выяснится это в аварии; поэтому файл рендерит одноразовый сервис
        # `alertmanager-config` из `deploy/.env`, а compose не даёт
        # Alertmanager стартовать, пока рендер не завершился успешно.
        chat_id: __PSEUDEX_TG_CHAT__
        parse_mode: HTML
        message: |
          {{ if eq .Status "firing" }}🔴{{ else }}🟢 ОТБОЙ{{ end }} <b>{{ .CommonLabels.alertname }}</b>
          {{ range .Alerts }}{{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}

inhibit_rules:
  # УПАВШИЙ ЛИЦЕНЗИОННЫЙ СЕРВЕР ПОРОЖДАЕТ ВСЁ ОСТАЛЬНОЕ. Пока он лежит, лизы
  # устаревают и отказы растут — это следствия, а не отдельные новости, и
  # присылать их значит топить причину в симптомах.
  - source_matchers: ['alertname="PseudexLicensingDown"']
    target_matchers: ['alertname=~"PseudexLeaseRefusalsHigh|PseudexLicenseStale|PseudexLeaseServerErrors"']
    equal: ["job"]
