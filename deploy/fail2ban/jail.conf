# fail2ban jails for the pseudex host. Installed by bootstrap.sh into
# /etc/fail2ban/jail.d/pseudex.conf.
#
# TWO CHAINS, ON PURPOSE. sshd is a host process: its bans go into INPUT, the
# default. Caddy is a container with published ports: those packets are
# DNAT-ed in PREROUTING and never traverse INPUT — a ban there would be a rule
# nothing matches. Docker provides DOCKER-USER for exactly this; the web jails
# name it.
[DEFAULT]
bantime  = 1h
findtime = 10m
maxretry = 5
banaction = iptables-multiport

[sshd]
enabled  = true
maxretry = 4
bantime  = 1h

[recidive]
# Comes back after a ban: a week.
enabled  = true
bantime  = 1w
findtime = 1d
maxretry = 3

[pseudex-web-scan]
enabled  = true
filter   = pseudex-web-scan
logpath  = /opt/pseudex/deploy/logs/caddy/access.log
chain    = DOCKER-USER
port     = http,https
maxretry = 40
findtime = 2m
bantime  = 1h
# ── РОБОТ, ДОКАЗАВШИЙ СВОЁ ИМЯ, НЕ БАНИТСЯ ────────────────────────────────
# Скрипт проверяет обратный DNS С ПОДТВЕРЖДЕНИЕМ ПРЯМЫМ ЗАПРОСОМ: имя из PTR
# обязано оканчиваться на официальный домен робота И разрешаться обратно в тот
# же адрес. По `User-Agent` этого делать НЕЛЬЗЯ — строку присылает клиент, и
# пропуск по ней был бы готовой лазейкой: любой сканер написал бы `YandexBot` и
# перебирал бы коды без ограничения. Установку скрипта делает `bootstrap.sh`.
#
# БЕЗ ЭТОЙ СТРОКИ ДЖЕЙЛ ОТРЕЗАЛ ПОИСКОВИКАМ ДОСТУП. Робот ходит с небольшого
# пула адресов и на сайте, где каждый адрес со слэшем отдавал 404, набирал
# сорок ошибок за две минуты — час бана, после трёх банов неделю (`recidive`).
# Обход обрывался, и сайта не было в выдаче даже по собственному названию.
#
# `exit 0` — не банить; ЛЮБОЙ ДРУГОЙ КОД — банить, включая сбой самого скрипта
# (`fail2ban/server/filter.py`: `ret_ignore = ret and ret_ignore == 0`). Поэтому
# недоступный DNS закрывает белый список, а не открывает его.
ignorecommand = /usr/local/bin/pseudex-is-crawler <ip>
# КЭШ ЗДЕСЬ — НЕ УКРАШЕНИЕ, А УСЛОВИЕ РАБОТОСПОСОБНОСТИ. `ignorecommand`
# зовётся НЕ при бане, а на КАЖДОЙ совпавшей строке лога (`processLineAndAdd`).
# Без кэша каждый 404 от сканера означал бы запуск процесса и два запроса в DNS,
# то есть наш же фильтр стал бы усилителем: тысяча запросов в секунду дала бы
# тысячу процессов в секунду. Man-страница (`jail.conf(5)`, `ignorecache`)
# говорит это прямо — кэш нужен, чтобы «not call it repeatedly». Ключ — адрес;
# пять минут держат и нагрузку, и окно, в котором адрес, переехавший от робота к
# кому-то другому, оставался бы в белом списке.
ignorecache = key="<ip>", max-count=500, max-time=5m

[pseudex-web-login]
enabled  = true
filter   = pseudex-web-login
logpath  = /opt/pseudex/deploy/logs/caddy/access.log
chain    = DOCKER-USER
port     = http,https
maxretry = 15
findtime = 5m
bantime  = 2h
# Тот же белый список, и по той же причине. Робот по этой ручке не ходит вовсе,
# поэтому строка ничего не ослабляет: она страхует от ложного срабатывания на
# служебных адресах вида `…/login/`, которые робот всё-таки запрашивает при
# обходе ссылок.
ignorecommand = /usr/local/bin/pseudex-is-crawler <ip>
ignorecache = key="<ip>", max-count=500, max-time=5m
