# fail2ban jails for the pseudex host. Installed by bootstrap.sh into
# /etc/fail2ban/jail.d/pseudex.conf.
#
# TWO CHAINS, ON PURPOSE. sshd is a host process: its bans go into INPUT, the
# default. Caddy is a container with published ports: those packets are
# DNAT-ed in PREROUTING and never traverse INPUT — a ban there would be a rule
# nothing matches. Docker provides DOCKER-USER for exactly this; the web jails
# name it.
[DEFAULT]
bantime  = 1h
findtime = 10m
maxretry = 5
banaction = iptables-multiport

[sshd]
enabled  = true
maxretry = 4
bantime  = 1h

[recidive]
# Comes back after a ban: a week.
enabled  = true
bantime  = 1w
findtime = 1d
maxretry = 3

[pseudex-web-scan]
enabled  = true
filter   = pseudex-web-scan
logpath  = /opt/pseudex/deploy/logs/caddy/access.log
chain    = DOCKER-USER
port     = http,https
maxretry = 40
findtime = 2m
bantime  = 1h
# ── ДЖЕЙЛ ЧИТАЕТ ФАЙЛ, А НЕ ЖУРНАЛ, И БЕЗ ЭТОГО ОН МЁРТВ ──────────────────
# DEBIAN УПАКОВЫВАЕТ fail2ban С БЭКЕНДОМ `systemd` ПО УМОЛЧАНИЮ, и это стоило
# нам всей веб-защиты сразу. Джейл, у которого задан `logpath` на ФАЙЛ, всё
# равно читал журнал systemd: в `/var/log/fail2ban.log` стоит
# `Jail 'pseudex-web-scan' uses systemd`, а `fail2ban-client get
# pseudex-web-scan logpath` отвечает «No file is currently monitored». Caddy —
# контейнер, его записи уходят в docker и в журнал не попадают вовсе, поэтому
# с 14 сентября джейл не видел НИ ОДНОГО запроса: `Total failed: 0` при 1369
# строках с кодом 4xx в самом файле. Никого он не банил — ни сканеров, ни
# роботов. Защита веб-поверхности существовала только на бумаге, и заметить это
# по её собственному статусу было нельзя: «0 банов» выглядит как «всё спокойно».
#
# Штатный `jail.conf` описывает ровно этот случай: «if systemd backend is
# chosen as the default but you enable a jail for which logs are present only in
# its own log files, specify some other backend for that jail (e.g. polling)».
# `polling` не требует ни одного пакета и читает тот самый файл, который Caddy
# и так пишет. `sshd` и `recidive` этого не трогаем: они читают журнал, и для
# них systemd — правильный выбор.
backend  = polling
# ── РОБОТ, ДОКАЗАВШИЙ СВОЁ ИМЯ, НЕ БАНИТСЯ ────────────────────────────────
# Скрипт проверяет обратный DNS С ПОДТВЕРЖДЕНИЕМ ПРЯМЫМ ЗАПРОСОМ: имя из PTR
# обязано оканчиваться на официальный домен робота И разрешаться обратно в тот
# же адрес. По `User-Agent` этого делать НЕЛЬЗЯ — строку присылает клиент, и
# пропуск по ней был бы готовой лазейкой: любой сканер написал бы `YandexBot` и
# перебирал бы коды без ограничения. Установку скрипта делает `bootstrap.sh`.
#
# ЭТИ ДВЕ СТРОКИ — ОДНА ПРАВКА, И ПОРОЗНЬ ОНИ БЕССМЫСЛЕННЫ. Пока джейл не читал
# файл, он не банил никого, и роботу ничего не грозило; как только `backend`
# починен, робот, собирающий 404, снова стал бы баниться на час, а после трёх
# банов `recidive` отрезал бы его на неделю — то есть обход и индексация встали
# бы. Белый список без `backend` не защищает, `backend` без белого списка
# защищает во вред.
#
# `exit 0` — не банить; ЛЮБОЙ ДРУГОЙ КОД — банить, включая сбой самого скрипта
# (`fail2ban/server/filter.py`: `ret_ignore = ret and ret_ignore == 0`). Поэтому
# недоступный DNS закрывает белый список, а не открывает его.
ignorecommand = /usr/local/bin/pseudex-is-crawler <ip>
# КЭШ ЗДЕСЬ — НЕ УКРАШЕНИЕ, А УСЛОВИЕ РАБОТОСПОСОБНОСТИ. `ignorecommand`
# зовётся НЕ при бане, а на КАЖДОЙ совпавшей строке лога (`processLineAndAdd`).
# Без кэша каждый 404 от сканера означал бы запуск процесса и два запроса в DNS,
# то есть наш же фильтр стал бы усилителем: тысяча запросов в секунду дала бы
# тысячу процессов в секунду. Man-страница (`jail.conf(5)`, `ignorecache`)
# говорит это прямо — кэш нужен, чтобы «not call it repeatedly». Ключ — адрес;
# пять минут держат и нагрузку, и окно, в котором адрес, переехавший от робота к
# кому-то другому, оставался бы в белом списке.
ignorecache = key="<ip>", max-count=500, max-time=5m

[pseudex-web-login]
enabled  = true
filter   = pseudex-web-login
logpath  = /opt/pseudex/deploy/logs/caddy/access.log
chain    = DOCKER-USER
port     = http,https
maxretry = 15
findtime = 5m
bantime  = 2h
# Тот же файловый бэкенд и по той же причине, что у сканера: без него джейл
# читает журнал systemd, куда Caddy не пишет, и перебор кодов на входе не
# ограничен ничем. Это не «на всякий случай» — джейл, читающий не тот источник,
# выглядит работающим и не делает ничего.
backend  = polling
# Тот же белый список, и по той же причине. Робот по этой ручке не ходит вовсе,
# поэтому строка ничего не ослабляет: она страхует от ложного срабатывания на
# служебных адресах вида `…/login/`, которые робот всё-таки запрашивает при
# обходе ссылок.
ignorecommand = /usr/local/bin/pseudex-is-crawler <ip>
ignorecache = key="<ip>", max-count=500, max-time=5m
