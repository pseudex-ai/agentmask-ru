# fail2ban filter: an address collecting error responses from Caddy — scanners
# walking /wp-admin, /.env, /phpmyadmin. Reads the JSON access log Caddy writes
# to deploy/logs/caddy/access.log (see Caddyfile); `bootstrap.sh` installs this
# file into /etc/fail2ban/filter.d/.
#
# 429 ЗДЕСЬ БОЛЬШЕ НЕТ, И ЭТО НЕ ОСЛАБЛЕНИЕ ФИЛЬТРА, А ПОЧИНКА. Код 429 отдаёт
# САМ СТОРФРОНТ своим троттлингом — на регистрацию, конфигуратор и вебхук
# (`storefront/storefront_web/views.py`). То есть фильтр банил за то, что
# сработала НАША ЖЕ защита, и превращал мягкий троттлинг в ЧАСОВУЮ блокировку
# на уровне пакетов: клиенту за общим адресом офиса хватало сорока отказов за
# две минуты, а после трёх банов за сутки `recidive` отрезал его на неделю.
# Защита от перебора при этом осталась на месте — это по-прежнему троттлинг, —
# а наказание за неё исчезло. 400/401/403/404/405/409 остаются: они и есть след
# сканера, а не след нашей собственной ручки.
[Definition]
datepattern = "ts":{EPOCH}
failregex = ^.*"remote_ip":"<HOST>".*"status":(?:40[013459]),.*$
ignoreregex =
