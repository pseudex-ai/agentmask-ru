# fail2ban filter: an address collecting error responses from Caddy — scanners
# walking /wp-admin, /.env, /phpmyadmin, and anything that trips the
# storefront's own 429 throttle. Reads the JSON access log Caddy writes to
# deploy/logs/caddy/access.log (see Caddyfile); `bootstrap.sh` installs this
# file into /etc/fail2ban/filter.d/.
[Definition]
datepattern = "ts":{EPOCH}
failregex = ^.*"remote_ip":"<HOST>".*"status":(?:40[013459]|429),.*$
ignoreregex =
