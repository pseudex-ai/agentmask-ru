# fail2ban filter: repeated POSTs to a login form from one address. Django and
# allauth answer a failed login with 200 (the form again), so a status-based
# rule cannot see a bruteforce; the RATE of POSTs can. Matches any `…/login/`
# so the admin path, which is not public, never has to be written here.
[Definition]
datepattern = "ts":{EPOCH}
failregex = ^.*"remote_ip":"<HOST>".*"method":"POST".*"uri":"[^"]*/login/?(?:\?[^"]*)?".*$
ignoreregex =
