# Authelia — единственная дверь ко всем нашим внутренним сервисам.
#
# ЭТО ШАБЛОН, А НЕ ЖИВОЙ КОНФИГ. Секреты подставляет `up.sh` в
# `configuration.rendered.yml`, и уже он монтируется в контейнер — тем же
# приёмом, что у бота поддержки и Alertmanager: вторая копия секрета в гите
# однажды разойдётся с первой, и выяснится это при входе, который не пускает.
#
# ЧТО ЭТО ДАЁТ ВМЕСТО ОТДЕЛЬНЫХ ПАРОЛЕЙ. Один вход на всё: доска, Grafana,
# что угодно следующее. Люди заводятся файлом (для команды из трёх человек это
# ровно то, что нужно — без базы и админки), у каждого свой пароль и TOTP.
# Ротировать и отзывать — по человеку, а не «поменять общий пароль».
#
# ЗДЕСЬ ЖЕ OIDC-ПРОВАЙДЕР. Authelia отдаёт токены, и доска ходит в неё как в
# обычный SSO — поэтому второй учётки внутри Vikunja не существует, а в задачах
# видно, кто есть кто.
#
# 2FA ЧЕРЕЗ DJANGO НЕ ЛОМАЕТСЯ И НЕ ПЕРЕНОСИТСЯ. У витрины остаётся своя
# django-otp для клиентского кабинета и админки — это другая аудитория и другой
# контур. Authelia берёт на себя НАШИ инструменты; свести два 2FA в один слой
# значило бы строить IdP внутри приложения, которое смотрит в интернет.

---
theme: dark

server:
  address: 'tcp://0.0.0.0:9091'
  # НАШ ЗНАК ВМЕСТО СТАНДАРТНОЙ ИКОНКИ. Портала в образе нет как файлов — он
  # вшит в бинарник Authelia, и подменить в нём стили нечем. Единственная
  # штатная точка брендирования — `asset_path`: каталог с `logo.png` и
  # `favicon.ico`, которые Authelia сама подставит и отмасштабирует.
  # Файлы не нарисованы руками: их выводит из наших же векторов
  # `deploy/board/authelia/make-assets.py`, и `deploy/test_portal_assets.sh`
  # следит, чтобы их не «поправили» отдельно от витрины и не потеряли
  # прозрачность (без неё Chromium запекает белый квадрат — на тёмной карточке
  # это выглядит как знак, наклеенный на стикер).
  asset_path: '/config/assets'

log:
  level: info

totp:
  issuer: 'pseudex'
  period: 30
  skew: 1

# WEBAUTHN ВКЛЮЧАЕТСЯ ЯВНО, И ЭТО НЕ ФОРМАЛЬНОСТЬ. Секции не было вовсе — и
# портал вёл себя хуже, чем если бы метода не существовало: он ЗАПИСЫВАЛ ключ
# (в базе лежала запись `MacBook`, RPID `auth.pseudex.ru`), но как второй фактор
# его не предлагал. Снаружи это выглядит как петля: человек привязывает ключ,
# возвращается на доску, а его снова отправляют привязывать устройство.
#
# `attestation_conveyance_preference: none` — то, что и так происходило: браузер
# не запрашивает у устройства удостоверение производителя. Смысла в нём нет:
# ключ всё равно привязан к origin и подделать его снаружи нельзя, а требование
# аттестации отсекает половину обычных ключей и passkeys.
webauthn:
  disable: false
  display_name: 'pseudex'
  attestation_conveyance_preference: 'none'
  timeout: '60s'
  selection_criteria:
    user_verification: 'preferred'

authentication_backend:
  file:
    path: '/config/users.yml'
    password:
      algorithm: 'argon2id'
      iterations: 1
      memory: 65536
      parallelism: 8
      key_length: 32

# ДВЕРЬ. `deny` по умолчанию — забытая строка не открывает ничего; каждое
# исключение названо явно.
access_control:
  default_policy: 'deny'
  rules:
    - domain: '__BOARD_DOMAIN__'
      policy: 'two_factor'

session:
  name: 'pseudex_session'
  secret: '__SESSION_SECRET__'
  expiration: '1h'
  inactivity: '15m'
  # КУКА ЖИВЁТ НА БАЗОВОМ ДОМЕНЕ, А НЕ НА ПОДДОМЕНЕ ПОРТАЛА. Портал (`auth.`)
  # и доска (`board.`) — разные имена, и без общего домена браузер не пошлёт
  # куку на `forward_auth`: получится петля редиректов.
  cookies:
    - domain: '__COOKIE_DOMAIN__'
      authelia_url: '__AUTH_URL__'
      # Страховка на случай, если адрес ресурса не доехал: лучше привести
      # человека на доску, чем на её 404.
      default_redirection_url: '__BOARD_URL__/'

regulation:
  max_retries: 5
  find_time: '2m'
  ban_time: '5m'

storage:
  encryption_key: '__STORAGE_KEY__'
  local:
    path: '/config/data/db.sqlite3'

notifier:
  # ПОЧТА ВКЛЮЧЕНА, И ЭТО ОБЯЗАТЕЛЬНО. Перед регистрацией второго фактора
  # Authelia подтверждает личность ОДНОРАЗОВЫМ КОДОМ и шлёт его уведомителем.
  # С файловым уведомителем код ложится в файл внутри контейнера: на первом же
  # живом входе человек встал на этом шаге и не мог его пройти — «письмо не
  # пришло, в спаме пусто», а пройти было нечем.
  #
  # Ящик тот же, что у витрины (`SMTP_*` в `.env`): вторая учётная запись для
  # служебных писем — это второй пароль, который надо хранить и ротировать.
  # `startup_check_address` — адрес, на который Authelia шлёт проверочное письмо
  # при старте: пустой или неверный ящик делает проверку бессмысленной.
  disable_startup_check: __SMTP_DISABLE_CHECK__
  smtp:
    # `submission://` — это STARTTLS (порт 587), тот же канал, которым шлёт
    # витрина. `host`/`port` в 4.38 объявлены устаревшими и будут убраны в 5.0.
    address: 'submission://__SMTP_HOST__:__SMTP_PORT__'
    username: '__SMTP_USER__'
    password: '__SMTP_PASSWORD__'
    sender: '__SMTP_SENDER__'
    identifier: '__SMTP_IDENTIFIER__'
    subject: '[pseudex] {title}'
    startup_check_address: '__SMTP_CHECK_ADDRESS__'
    tls:
      server_name: '__SMTP_HOST__'

identity_validation:
  reset_password:
    jwt_secret: '__RESET_JWT_SECRET__'

identity_providers:
  oidc:
    hmac_secret: '__OIDC_HMAC_SECRET__'
    jwks:
      - key: |
__OIDC_RSA_KEY__
    clients:
      - client_id: 'vikunja'
        client_name: 'pseudex доска'
        public: false
        # ВНИМАНИЕ: дайджест, а не сам секрет — Authelia сравнивает хеш, а
        # Vikunja получает пароль открытым текстом из .env.
        client_secret: '__OIDC_CLIENT_SECRET_DIGEST__'
        # РЕДИРЕКТ РОВНО ТОТ, ЧТО СТРОИТ ФРОНТЕНД: `<origin><base>auth/openid/<key>`
        # (frontend/src/helpers/redirectToProvider.ts). Другой путь Authelia
        # отклонит, и вход отвалится на последнем шаге.
        redirect_uris:
          - '__BOARD_URL__/auth/openid/authelia'
        scopes: ['openid', 'profile', 'email', 'groups', 'offline_access']
        grant_types: ['authorization_code', 'refresh_token']
        response_types: ['code']
        authorization_policy: 'two_factor'
        token_endpoint_auth_method: 'client_secret_basic'
        consent_mode: 'implicit'

      # ВИТРИНА: вход сотрудников в админку и /ops/. Отдельный клиент, а не
      # тот же, что у доски: у них разные права и разные редиректы, и общий
      # клиент означал бы, что утечка одного секрета открывает и второе.
      - client_id: 'storefront'
        client_name: 'pseudex витрина'
        public: false
        client_secret: '__OIDC_STOREFRONT_SECRET_DIGEST__'
        redirect_uris:
          # Путь СКРЫТЫЙ и совпадает с PSEUDEX_ADMIN_PATH витрины: отдельный
          # публичный /oidc/ был бы вторым угадываемым входом.
          - '__STOREFRONT_REDIRECT__'
        scopes: ['openid', 'profile', 'email']
        grant_types: ['authorization_code']
        response_types: ['code']
        # two_factor — здесь это не украшение: именно наличие второго фактора
        # витрина читает из claim `amr` и по нему пропускает django-otp.
        authorization_policy: 'two_factor'
        token_endpoint_auth_method: 'client_secret_basic'
        consent_mode: 'implicit'
