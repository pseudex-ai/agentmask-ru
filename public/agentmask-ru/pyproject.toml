[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentmask-ru"
version = "0.1.0"
description = "Does a PII-masking gateway break a Russian-speaking LLM agent with tools? A benchmark and a harness for any masker."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "AgentMask-RU contributors" }]
keywords = ["pii", "benchmark", "llm", "agents", "russian", "152-fz", "pseudonymisation"]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: Apache Software License",
  "Natural Language :: Russian",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Security",
]
# The core is standard library plus a schema validator. Running the harness
# against a proxy needs nothing else; the optional extras pull in only what a
# particular adapter or the corpus generator needs, so a reader on a laptop
# without a GPU or a gigabyte of spaCy models can still reproduce every
# placeholder-based row.
# pymorphy3 is the judge's dictionary: «есина рушана» and «Рушан Есин» are one
# person only to a reader of Russian morphology (src/agentmask_ru/person.py).
dependencies = ["jsonschema>=4.20", "pymorphy3>=2.0", "pymorphy3-dicts-ru>=2.4"]

[project.optional-dependencies]
build = ["mimesis>=18", "Faker>=30", "phonenumbers>=8.13"]
presidio = ["presidio-analyzer>=2.2", "presidio-anonymizer>=2.2", "spacy>=3.7"]
llm_guard = ["llm-guard>=0.3"]
dev = ["pytest>=8", "mimesis>=18", "Faker>=30", "phonenumbers>=8.13"]

[project.scripts]
agentmask = "agentmask_ru.cli:main"

[project.urls]
Homepage = "https://github.com/pseudex/agentmask-ru"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
