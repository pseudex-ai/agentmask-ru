# The e2e stand: a real licensing server and a real sidecar, nothing mocked.
#
# TTL and grace are compressed (60 s / 120 s instead of 24 h / 48 h) so the whole
# ladder can be observed in one run — but they are compressed by the SERVER's
# configuration, and they travel to the client inside the signed lease. The client
# has no knob for either, which is the point: the code under test is exactly the
# code that runs on a 24-hour lease.
name: pseudex-e2e

services:
  license:
    image: pseudex-licensing:e2e
    environment:
      PSEUDEX_LEASE_TTL_SECONDS: "${PSEUDEX_LEASE_TTL_SECONDS:-60}"
      PSEUDEX_GRACE_SECONDS: "${PSEUDEX_GRACE_SECONDS:-120}"
      PSEUDEX_SIGNING_KEY: "${PSEUDEX_SIGNING_KEY}"
      # Ключ, которым запечатан вкомпилированный блоб тюнинга. Сервер кладёт его в
      # каждую аренду, чтобы движок мог открыть свой тюнинг; ДОЛЖЕН совпадать с
      # Админка стенда под токеном, как и в проде. Гейты ходят им же.
      PSEUDEX_LICENSE_ADMIN_TOKEN: "${PSEUDEX_LICENSE_ADMIN_TOKEN:-e2e-admin-token}"
      PSEUDEX_LICENSE_CERT: /certs/server.pem
      PSEUDEX_LICENSE_KEYFILE: /certs/server.key
      # Set only by gate L13, which needs a lease whose ciphertext is broken.
      PSEUDEX_FAULT_INJECT: "${PSEUDEX_FAULT_INJECT:-}"
      # Set only by gate L12, which greps the ACTUAL request body for personal data.
      PSEUDEX_LOG_RAW_BODY: "${PSEUDEX_LOG_RAW_BODY:-}"
    volumes:
      - ./certs:/certs:ro
      - license-data:/data
    ports:
      - "18443:8443"   # public API, TLS
      - "19443:9443"   # admin, plain HTTP, never published outside the stand

  sidecar:
    image: "${PSEUDEX_IMAGE:-pseudex:source}"
    environment:
      PSEUDEX_LICENSE_URL: https://license:8443
      PSEUDEX_LICENSE_KEY: "${PSEUDEX_KEY}"
      PSEUDEX_LICENSE_CA: /certs/ca.pem
      PSEUDEX_INSTANCE_ID: e2e-instance
      PSEUDEX_WORKERS: "${PSEUDEX_WORKERS:-2}"
      # Gate L11 only. libfaketime is injected from a mount rather than baked
      # into the image, so the image under test is byte-identical to the one that
      # ships — the stand changes the process's ENVIRONMENT, which is exactly what
      # a customer wanting free grace would do.
      #
      # NOT `cap_add: SYS_TIME` + `date -s`: the kernel does not isolate the clock
      # per container, so that moved the whole Docker VM's wall clock and every
      # other container on the machine with it.
      LD_PRELOAD: "${PSEUDEX_LD_PRELOAD:-}"
      FAKETIME_TIMESTAMP_FILE: "${PSEUDEX_FAKETIME_FILE:-}"
      FAKETIME_NO_CACHE: "1"
      # The real threat is a wall clock moved backwards. CLOCK_MONOTONIC cannot
      # go backwards on a live kernel, so faking it too would test a threat that
      # does not exist and would prove nothing about the design.
      FAKETIME_DONT_FAKE_MONOTONIC: "1"
      # Pinned for the stand as CONFIGURATION, the same way the TTL and the
      # instance id are. The product still generates these when unset; fixing
      # them here just lets the gates present the credential a customer would
      # read out of their own container log.
      PSEUDEX_GATEWAY_TOKEN: "e2e-gateway-token"
      PSEUDEX_ADMIN_TOKEN: "e2e-admin-token"
      # Empty is the PRODUCT's default (auto), not a stand-only setting: L19
      # runs the shape a customer gets out of the box. L20 sets `off` to build a
      # plaintext volume and then clears it again, and L21 puts a key here that
      # does not open what L20 left behind.
      PSEUDEX_VAULT_ENCRYPTION: "${PSEUDEX_VAULT_ENCRYPTION:-}"
      PSEUDEX_VAULT_KEY: "${PSEUDEX_VAULT_KEY:-}"
    volumes:
      - ./certs:/certs:ro
      - ./faketime:/faketime
      - sidecar-data:/data
    ports:
      - "18000:8000"
      - "18081:8081"
    depends_on:
      - license

volumes:
  license-data:
  sidecar-data:
