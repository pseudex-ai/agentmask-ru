# Шаблон. __POD_ID__ и __API_KEY__ подставляются при старте (см. compose.yml).
#
# Оба источника ходят через HTTPS-прокси RunPod, поэтому туннель не нужен, а
# ключ обязателен: прокси публичен, адрес угадываем, и без ключа метрики
# машины, обрабатывающей персональные данные, читает кто угодно.
global:
  scrape_interval: 5s          # прогон идёт минуты, поминутный шаг всё сгладит
  scrape_timeout: 4s

scrape_configs:
  - job_name: sglang
    scheme: https
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials: __API_KEY__
    static_configs:
      - targets: ["__POD_ID__-30000.proxy.runpod.net"]
        labels: {source: sglang}

  - job_name: gpu
    scheme: https
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials: __API_KEY__
    static_configs:
      - targets: ["__POD_ID__-9400.proxy.runpod.net"]
        labels: {source: hardware}
