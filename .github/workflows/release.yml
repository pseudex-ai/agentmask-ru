# Build, prove, sign, publish.
#
# THE ORDER IS THE POINT. The image is signed only after the gates that run
# against a real container have passed, so a signature means "this exact image
# was proved", not "this commit built". A pipeline that signs first and tests
# after produces trusted artefacts nobody verified.

name: release

on:
  push:
    tags: ["v[0-9]*", "platform/v[0-9]*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Push and sign the image"
        type: boolean
        default: false

# Read-only by default; `publish` raises its own (`id-token: write` for keyless
# signing) at the job level, so the four build jobs never hold it.
permissions:
  contents: read

# Releases queue, never cancel: a cancelled publish can leave a tag with two
# of five images pushed, and the host's agent pulls by tag. `cancel-in-progress`
# is false explicitly so nobody "fixes" it to true by analogy with checks.
concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ${{ vars.REGISTRY || 'cr.yandex/pseudex' }}
  IMAGE: pseudex

jobs:
  engine:
    name: engine — detection and product tests
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: prototype }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      # NO PIP CACHE ON A RELEASE. The Actions cache is writable from any branch
      # of this repository, and a wheel planted there by a branch build would be
      # restored into the job that decides whether v0.x publishes. Two minutes
      # of downloads per job buys a release that depends on nothing a branch
      # could have left behind.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      # These need no container and no network, so they run first and fail fast.
      - name: core round trip
        run: python test_loop.py
      - name: vault canonicalisation and persistence
        run: python vault_test.py
      - name: 152-ФЗ type coverage
        run: python test_coverage_152fz.py
      - name: product invariants
        run: python test_product.py
      - name: operator surface
        run: python test_localui.py
      - name: hard cases and the chat register
        run: python test_hard_cases.py
      - name: name morphology and the round trip through it
        run: python test_names_morphology.py
      - name: credentials are anchored to prefixes, not entropy
        run: python test_credentials.py
      - name: the defects a persona run found
        run: python test_persona_defects.py
      - name: no over-masking on clean business text
        run: python test_overmasking.py

      # Seeded sets, so these are contracts rather than readings.
      - name: golden set — 298 values
        run: python make_dataset.py && python eval_detect.py
      - name: dirty set — 150 values
        run: python make_dirty.py && python eval_dirty.py

      # HERE AND NOT IN checks.yml. Part of what it asserts is loop
      # responsiveness under load, and a timing assertion on a shared runner
      # fails for reasons unrelated to the commit. On a release that is worth
      # waiting for; on every push it is a gate people learn to re-run.
      - name: cache, audit dedup and loop responsiveness
        run: python test_perf_masking.py
      # THE SERVER'S OWN TESTS RUN ON A RELEASE TOO. They ran only in checks.yml,
      # and a platform release is the one that ships the server: the registry
      # of versions (the floor below which a customer's container stops masking),
      # the admin API, the upgrade of an existing licensing database.
      - name: versions registry — every promise of the ТЗ
        run: python -m licensing.test_registry
      - name: licensing store upgrades on existing data
        run: python -m licensing.test_store_upgrade
      - name: licensing admin API through HTTP
        run: python licensing/test_admin_api.py
      - name: metering attacks
        run: python licensing/test_metering_attacks.py

  storefront:
    name: storefront
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"   # no cache: see the engine job
      # The storefront test drives the REAL licensing server, which lives in the
      # engine's environment — so both are installed, in the two virtualenvs the
      # test expects to find.
      - run: python -m venv prototype/.venv && prototype/.venv/bin/pip install -r prototype/requirements.txt
      - run: python -m venv storefront/.venv && storefront/.venv/bin/pip install -r storefront/requirements.txt
      - name: storefront end to end
        working-directory: storefront
        run: .venv/bin/python test_storefront.py
      - name: product pages and consented beta requests
        working-directory: storefront
        run: .venv/bin/python test_product_pages.py

  gates:
    name: gates against real containers
    runs-on: ubuntu-latest
    needs: [engine]
    timeout-minutes: 90
    defaults:
      run: { working-directory: prototype }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }   # no cache: see the engine job
      - run: pip install -r requirements.txt

      # ОБА КЛЮЧА — ИЗ СЕКРЕТОВ РЕПОЗИТОРИЯ, А НЕ ИЗ СЛУЧАЙНОСТИ.
      #
      # ЗДЕСЬ ОНИ ГЕНЕРИРОВАЛИСЬ ЗАНОВО НА КАЖДЫЙ ПРОГОН, и релиз выпускал
      # образ, который невозможно лицензировать: ключ проверки компилируется В
      # БИНАРЬ, а боевой сервер подписывает лизы своим — контейнер отвечал бы
      # «lease signature is not ours» и не стартовал. Тюнинг едет в лизе, не в
      # образе (docs/tz-tuning-in-lease.md), поэтому второго ключа больше нет.
      #
      # И CI ЭТОГО НЕ ВИДЕЛ ПО ПОСТРОЕНИЮ. Гейты поднимают СВОЙ лицензионный
      # сервер с теми же одноразовыми ключами, поэтому L1–L22 зелены ровно
      # потому, что обе половины одинаково неправильные. Зелёный прогон
      # доказывал согласованность внутри job, а не пригодность артефакта.
      #
      # Отказ был бы fail-closed — не утечка, а нестартующий релиз, — но
      # обнаружился бы у заказчика.
      #
      # `::add-mask::` до первого использования, чтобы ключ не попал в логи.
      # ОТСУТСТВИЕ СЕКРЕТА — ЭТО ОСТАНОВКА, а не пустая строка: пустой ключ собрал
      # бы ровно тот же нелицензируемый образ, и тишина здесь стоила бы релиза.
      - name: take the release keys from repository secrets
        env:
          SIGNING: ${{ secrets.PSEUDEX_SIGNING_KEY }}
        run: |
          if [ -z "${SIGNING}" ]; then
            echo "::error::нет секрета PSEUDEX_SIGNING_KEY. Это то же значение," \
                 "что стоит в deploy/.env боевого хоста; собранный без него образ" \
                 "отвергнет каждую лизу боевого сервера."
            exit 1
          fi
          echo "::add-mask::${SIGNING}"
          echo "PSEUDEX_SIGNING_KEY=${SIGNING}" >> "$GITHUB_ENV"

      # P3 СРАВНИВАЕТ ОБРАЗЫ НА ЭТОМ НАБОРЕ, И БЕЗ НЕГО ОНО СРАВНИВАЛО ПОЛОВИНУ.
      #
      # `*.json` гитигнорятся, а `needs: [engine]` — другой раннер, так что файл
      # оттуда сюда не доезжает. `parity.py` без `dirty.json` тихо пишет
      # `{"skipped": True}`, оба отчёта получали одинаковое «пропущено», разниц
      # не было — и гейт, который обязан доказать «скомпилированный образ
      # детектирует ровно то же», проходил, не сравнив ни одного значения
      # грязного набора. Единственным следом было исчезновение recall и
      # precision из его же строки. Теперь P3 на пропуск краснеет, поэтому
      # наборы обязаны быть здесь.
      - name: the dirty set P3 compares the two images on
        run: python make_dirty.py

      # REGISTRY-КЭШ СЛОЁВ NUITKA. type=gha изолирован по git-ref, а релизы у нас
      # идут по ТЕГАМ — кэш прогона одного тега недостижим из другого
      # (docs.docker.com/build/cache/backends/gha: «only the current, base and
      # default branch»), проверено: v0.1.7 не попал в кэш v0.1.6. Registry-кэш
      # лежит в реестре и от ref НЕ зависит: слой компиляции движка переживает
      # релизы, storefront-only идёт минуты вместо часа. Гейты и подпись при этом
      # выполняются по собранному образу, как раньше. docker-container драйвер
      # (setup-buildx) нужен для registry-кэша и --load; логин в реестр — чтобы
      # кэш-образ пушить/тянуть (тот же секрет, что у publish).
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: log in to the registry for the build cache
        env:
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
        run: |
          [ -n "${REGISTRY_PASSWORD}" ] || { echo "::error::REGISTRY_PASSWORD пуст"; exit 1; }
          printf '%s' "${REGISTRY_PASSWORD}" | docker login "${REGISTRY%%/*}" -u "${REGISTRY_USERNAME}" --password-stdin
      # ГЕЙТЫ — ПО ПОТОКУ (D-051). Движок: упаковочные P1–P11 на СКОМПИЛИРОВАННОМ
      # образе (это его артефакт) и лицензионные L1–L25 на нём же. Платформа:
      # выпускаются четыре наших образа, движок не выпускается — поэтому
      # лицензионные L-гейты на образе из ИСХОДНИКОВ (стенд собирает его сам),
      # без Nuitka и без P-гейтов: упаковка движка — не свойство платформенного
      # релиза, а двадцать минут сборки и его же ложный красный (P9 на
      # platform/v0.3.16) останавливали выпуск лицензионного сервера.
      - name: which stream
        run: |
          case "${GITHUB_REF_NAME}" in
            platform/v[0-9]*) echo "STREAM=platform" >> "$GITHUB_ENV" ;;
            v[0-9]*)          echo "STREAM=engine"   >> "$GITHUB_ENV" ;;
            *)                echo "STREAM=dev"      >> "$GITHUB_ENV" ;;
          esac
      - name: packaging gates (builds both images)
        if: env.STREAM != 'platform'
        env:
          PSEUDEX_BUILDX_CACHE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE }}:buildcache
        run: python -u e2e/pack_gates.py
      - name: licensing gates on the release image
        if: env.STREAM != 'platform'
        run: python -u e2e/gates.py --image pseudex:compiled --skip-build
      - name: licensing gates on the source image (platform stream)
        if: env.STREAM == 'platform'
        run: python -u e2e/gates.py

      - name: keep the proved image
        if: env.STREAM != 'platform'
        run: docker save pseudex:compiled | gzip > /tmp/pseudex-compiled.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: env.STREAM != 'platform'
        with:
          name: pseudex-compiled
          path: /tmp/pseudex-compiled.tar.gz
          # Consumed by `publish` in this same run; 430 MB kept for a week per
          # release is quota spent on nothing.
          retention-days: 1

  publish:
    name: sign and push
    runs-on: ubuntu-latest
    needs: [gates, storefront]
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/platform/v') || inputs.publish
    permissions:
      id-token: write   # keyless signing
      contents: write   # ТОЛЬКО ради коммита реестра версий (поток движка, шаг ниже);
                        # сборочные джобы выше держат read, и это не меняется
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      # Доказанный образ движка есть только у потоков engine/dev: платформа его
      # не собирает и не публикует (см. job gates).
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: "!startsWith(github.ref, 'refs/tags/platform/')"
        with: { name: pseudex-compiled, path: /tmp }
      - run: docker load < /tmp/pseudex-compiled.tar.gz
        if: "!startsWith(github.ref, 'refs/tags/platform/')"

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      # ДВА ПОТОКА, ОДИН ФАЙЛ (D-051). `vX.Y.Z` — движок клиенту, один образ
      # `pseudex` плюс плавающие алиасы и запись в реестр версий. `platform/vX.Y.Z`
      # — четыре наших образа, которые хост выкатывает одним `compose up`.
      # Ручной dispatch с ветки — «dev»: все пять под коротким SHA, без алиасов и
      # без реестра. Один файл, а не два, потому что identity подписи, которой
      # верит агент на хосте, — это ИМЯ ЭТОГО ФАЙЛА и тег: два файла означали
      # бы две identity в deploy/.env, и одна из них рано или поздно отстала бы.
      - name: which stream, which version
        run: |
          set -eu
          case "${GITHUB_REF_NAME}" in
            platform/v[0-9]*)
              STREAM=platform; VERSION="${GITHUB_REF_NAME#platform/v}"
              IMAGES="pseudex-licensing pseudex-storefront pseudex-backup pseudex-supportbot pseudex-board" ;;
            v[0-9]*)
              STREAM=engine; VERSION="${GITHUB_REF_NAME#v}"
              IMAGES="${IMAGE}" ;;
            *)
              STREAM=dev; VERSION="$(git rev-parse --short HEAD)"
              IMAGES="${IMAGE} pseudex-licensing pseudex-storefront pseudex-backup pseudex-supportbot pseudex-board" ;;
          esac
          {
            echo "STREAM=${STREAM}"; echo "VERSION=${VERSION}"; echo "IMAGES=${IMAGES}"
          } >> "$GITHUB_ENV"
          echo "stream=${STREAM} version=${VERSION} images: ${IMAGES}"

      # ОДИН ИСТОЧНИК ВЕРСИИ (D-053): бинарник знает себя из version.txt, тег
      # обязан совпасть с ним. Расхождение — не опечатка, а образ, который
      # назовёт серверу лицензий и оператору не ту версию, что на нём написана.
      #
      # ПУСТОЙ РЕЛИЗ ДВИЖКА — КРАСНЫЙ. 0.3.12 и 0.3.13 были одним образом под
      # двумя номерами: кэш сборки отдал те же байты, а номер солгал. Набор
      # файлов, из которых состоит образ, — из COPY-строк Dockerfile.nuitka
      # (deploy/shipped_paths.sh), и если с прошлого тега движка в нём ничего
      # не изменилось, номера не будет. Раньше это ловит deploy/lint_engine_commits.sh
      # в checks.yml; здесь — последний рубеж.
      - name: the engine tag names the version the binary is, and the engine actually changed
        if: env.STREAM == 'engine'
        run: |
          set -eu
          FILE_VERSION="$(tr -d '[:space:]' < prototype/version.txt)"
          if [ "${FILE_VERSION}" != "${VERSION}" ]; then
            echo "::error::тег ${GITHUB_REF_NAME} не совпадает с prototype/version.txt (${FILE_VERSION}) — образ назвал бы себя не той версией"
            exit 1
          fi
          # THE BASELINE IS THE PREVIOUS TAG OF THE SAME CYCLE when there is
          # one (D-057): a security patch on release/0.3 is measured against
          # v0.3.16, not against v0.4.2 — against the newest tag overall every
          # maintenance release would look like a rewrite of the whole engine,
          # and an EMPTY one would pass. Only a cycle's first tag falls back
          # to the newest tag of any cycle.
          cycle="$(printf '%s' "${VERSION}" | cut -d. -f1,2)"
          previous="$(git tag -l "v${cycle}.[0-9]*" --sort=-v:refname | grep -vx "${GITHUB_REF_NAME}" | head -1 || true)"
          if [ -z "${previous}" ]; then
            previous="$(git tag -l 'v[0-9]*' --sort=-v:refname | grep -vx "${GITHUB_REF_NAME}" | head -1 || true)"
          fi
          if [ -n "${previous}" ]; then
            # shellcheck disable=SC2046
            changed="$(git diff --name-only "${previous}" "${GITHUB_REF_NAME}" -- $(sh deploy/shipped_paths.sh))"
            if [ -z "${changed}" ]; then
              echo "::error::с ${previous} до ${GITHUB_REF_NAME} не изменился ни один файл образа — пустой релиз, номер солгал бы. Ничего не опубликовано."
              exit 1
            fi
            echo "изменения образа с ${previous}:"; printf '%s\n' "${changed}" | while IFS= read -r f; do echo "  ${f}"; done
          else
            echo "первый тег движка — сравнивать не с чем"
          fi

      # НИЧЕГО НЕ ЗАГРУЖАЕТСЯ, ПОКА НЕ ПРОЙДЕН СКАН. Здесь стояли `tag and
      # push` и сборка с пушем, то есть порядок «загрузить → проверить →
      # подписать». Он оставлял в реестре НЕПОДПИСАННЫЕ образы, если скан
      # падал: агент выкатки их видел, `cosign verify` возвращал пусто, и в
      # телеграм уходило «подпись не сошлась. Разберитесь, откуда взялся этот
      # образ» — тревога о подмене в реестре, которой не было. Проверено на
      # v0.3.10. Порядок «собрать → проверить → загрузить → подписать»
      # оставляет реестр чистым: упавший скан не оставляет в нём ничего.
      - name: tag the engine image
        if: env.STREAM != 'platform'
        run: docker tag pseudex:compiled "${REGISTRY}/${IMAGE}:${VERSION}"

      # OUR OWN IMAGES, BUILT HERE AND NOT ON THE HOST.
      #
      # They used to be `build:` entries in deploy/compose.yml, which means
      # `docker compose build` on the production machine — and then nothing
      # anywhere proves that what is running is what passed CI. A build on the
      # host can differ from a build here for a dozen boring reasons (a stale
      # layer cache, a base image that moved, a file that is gitignored on one
      # side), and the difference surfaces as a bug nobody can reproduce.
      - name: build our own images
        if: env.STREAM != 'engine'
        run: |
          set -eu
          for pair in "licensing:prototype:licensing/Dockerfile" "storefront:storefront:Dockerfile" "backup:deploy:Dockerfile.backup" "supportbot:deploy/supportbot:Dockerfile" "board:.:deploy/board/Dockerfile.frontend"; do
            NAME="${pair%%:*}"; REST="${pair#*:}"
            CTX="${REST%%:*}"; FILE="${REST#*:}"
            REF="${REGISTRY}/pseudex-${NAME}:${VERSION}"
            docker build -f "${CTX}/${FILE}" -t "${REF}" "${CTX}"
            echo "built ${REF}"
          done

      # БЕСПЛАТНАЯ ЗАМЕНА ПЛАТНОМУ СКАНИРОВАНИЮ РЕЕСТРА.
      #
      # В Container Registry было включено «Сканирование Docker-образов при
      # загрузке»: 14,49 ₽ за образ, 90 сканирований за две недели и 1 217 ₽ из
      # 1 226 ₽ всего счёта. Хуже цены другое — результат никто не смотрел:
      # образ к тому моменту УЖЕ загружен и подписан, откатывать поздно, а
      # находки лежат во вкладке, куда никто не заходит.
      #
      # Trivy делает то же бесплатно и ДО подписи, то есть до того, как образ
      # станет выкатываемым. База скачивается один раз.
      #
      # ПОРОГ — CRITICAL, ДЛЯ КОТОРОГО ЕСТЬ ИСПРАВЛЕНИЕ. Уязвимость без
      # исправления заблокировала бы релизы навсегда: она живёт в базовом образе,
      # пока Debian её не выпустит, и не выкатываться это время нельзя. HIGH
      # печатается и не блокирует — так видно, к чему готовиться.
      #
      # ОТСУТСТВИЕ ОТЧЁТА — ЭТО ПРОВАЛ, А НЕ ПРОПУСК. Скан, который не
      # выполнился (нет доступа к реестру, упал jq, пустой файл), обязан
      # покраснеть: зелёный шаг без отчёта — ровно тот случай, ради которого
      # шаг существует.
      - name: scan the images before pushing
        env:
          TRIVY_CACHE_DIR: /tmp/trivy-cache
        run: |
          set -eu
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /tmp/bin >/dev/null
          /tmp/bin/trivy image --download-db-only --quiet
          rm -f /tmp/scan-failed
          printf '%-24s %9s %9s\n' ОБРАЗ CRITICAL HIGH
          for name in ${IMAGES}; do
            report="/tmp/scan-${name}.json"
            rm -f "${report}"
            /tmp/bin/trivy image --quiet --scanners vuln --severity CRITICAL,HIGH \
              --ignore-unfixed --format json -o "${report}" \
              "${REGISTRY}/${name}:${VERSION}" || true
            if [ ! -s "${report}" ]; then
              printf '%-24s %9s %9s\n' "${name}" "—" "—"
              echo "::error::${name}: отчёта нет, скан не выполнился"
              echo "${name}" >> /tmp/scan-failed
              continue
            fi
            critical="$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' "${report}")"
            high="$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' "${report}")"
            printf '%-24s %9s %9s\n' "${name}" "${critical}" "${high}"
            [ "${critical}" = "0" ] || echo "${name}" >> /tmp/scan-failed
          done
          if [ -f /tmp/scan-failed ]; then
            echo "::error::исправимые CRITICAL в образах: $(tr '\n' ' ' < /tmp/scan-failed)"
            exit 1
          fi

      - name: log in
        env:
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
        run: |
          set -eu
          [ -n "${REGISTRY_PASSWORD}" ] || { echo "::error::REGISTRY_PASSWORD пуст"; exit 1; }
          printf '%s' "${REGISTRY_PASSWORD}" | docker login "${REGISTRY%%/*}" -u "${REGISTRY_USERNAME}" --password-stdin

      # ПЛАВАЮЩИЕ АЛИАСЫ ДВИЖКА (D-061): `X.Y.Z` плюс то, что скажет реестр —
      # `X.Y` всегда, `X` и `latest` только на новейшем цикле. Сайт советует
      # клиенту `pseudex:X.Y`, и патчи он получает одним `docker pull`.
      #
      # ИЗ origin/main, НЕ ИЗ ЧЕКАУТА ТЕГА. Тег с ветки поддержки release/0.3
      # несёт реестр той ветки, где 0.3 ещё новейший цикл — и security-патч
      # 0.3.17 получил бы `latest` и `0`, ровно то, чего D-057 запрещает.
      # Записи реестра живут только в main; чекаут полный, origin/main в нём есть.
      - name: engine aliases from the registry
        if: env.STREAM == 'engine'
        run: |
          set -eu
          git show origin/main:deploy/releases.json > /tmp/releases-main.json
          aliases="$(cd prototype && python3 -m licensing.registry aliases --version "${VERSION}" /tmp/releases-main.json)"
          for alias in ${aliases}; do
            docker tag "${REGISTRY}/${IMAGE}:${VERSION}" "${REGISTRY}/${IMAGE}:${alias}"
          done
          echo "ENGINE_ALIASES=${aliases}" >> "$GITHUB_ENV"
          echo "aliases: ${aliases}"

      # ПУШ С ПОВТОРАМИ. Реестр отвечал `unexpected EOF` на слое и `dial tcp …
      # i/o timeout`. Пуш идемпотентен, поэтому повтор дёшев. НЕ `|| true`:
      # исчерпав попытки, шаг обязан упасть — иначе подпишем то, чего в реестре нет.
      - name: push the images
        run: |
          set -eu
          refs=""
          for name in ${IMAGES}; do refs="${refs} ${REGISTRY}/${name}:${VERSION}"; done
          for alias in ${ENGINE_ALIASES:-}; do refs="${refs} ${REGISTRY}/${IMAGE}:${alias}"; done
          for REF in ${refs}; do
            for attempt in 1 2 3 4; do
              docker push "${REF}" && break
              [ "${attempt}" = 4 ] && { echo "::error::пуш ${REF} не прошёл за 4 попытки"; exit 1; }
              echo "пуш не прошёл (попытка ${attempt}), повтор через $((attempt * 15))с"
              sleep $((attempt * 15))
            done
            echo "pushed ${REF}"
          done

      # КЛИЕНТ СКАЧИВАЕТ ОБРАЗ БЕЗ ЛОГИНА. Сайт даёт ему `docker run …` с
      # адресом образа и ключом лицензии — шага `docker login` там нет и не
      # будет. Реестр при этом закрыт, и открыт публично один репозиторий:
      # `${IMAGE}`. Ни один тест этого не проверял — персоны и гейты собирают
      # образ локально — и 20.09.2026 обнаружилось, что клиент получал
      # `unauthorized`, а сайт при этом советовал тег, которого в реестре нет.
      # Здесь проверяются ОБЕ стороны: выпущенные теги видны анониму, а
      # серверные образы — нет. Второе важнее первого: один клик в консоли на
      # уровне реестра открыл бы сервер лицензий вместе со словарями.
      - name: the customer can pull the customer image, and ONLY it
        run: |
          set -eu
          # Пустой DOCKER_CONFIG = аноним. `docker logout` снял бы учётку, а
          # следующий шаг (`cosign sign`) ею пушит подпись в этот же реестр.
          DOCKER_CONFIG="$(mktemp -d)"; export DOCKER_CONFIG
          if [ "${STREAM}" != "platform" ]; then
            for tag in "${VERSION}" ${ENGINE_ALIASES:-}; do
              if ! docker manifest inspect "${REGISTRY}/${IMAGE}:${tag}" >/dev/null 2>&1; then
                echo "::error::${REGISTRY}/${IMAGE}:${tag} не скачивается без логина — клиент не запустит контейнер (репозиторию ${IMAGE} нужна роль container-registry.images.puller для allUsers)"
                exit 1
              fi
              echo "anonymous pull ok: ${IMAGE}:${tag}"
            done
          fi
          if [ "${STREAM}" != "engine" ]; then
            for name in pseudex-licensing pseudex-storefront pseudex-backup pseudex-supportbot; do
              if docker manifest inspect "${REGISTRY}/${name}:${VERSION}" >/dev/null 2>&1; then
                echo "::error::${REGISTRY}/${name}:${VERSION} ОТКРЫТ анониму — серверный образ должен быть закрыт"
                exit 1
              fi
              echo "closed to anonymous: ${name}"
            done
          fi

      # ПОДПИСЬ ПОСЛЕ СКАНА, А НЕ ДО НЕГО. Подписанный образ агент считает
      # доказанным и выкатывает, поэтому подписать раньше проверки значило бы
      # поставить печать на то, чего ещё не смотрели. Порядок здесь и есть
      # гейт: упавший скан оставляет образы неподписанными, и агент их не
      # возьмёт — он проверяет подпись до того, как что-либо остановит.
      #
      # The digest, never the tag: a tag is mutable, so a signature over one
      # says nothing about the bytes a customer eventually pulls. This is what
      # `cosign verify` on their side actually checks. Алиасы указывают на тот
      # же дайджест — подпись одна на всех.
      - name: sign the digests
        run: |
          set -eu
          for name in ${IMAGES}; do
            DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "${REGISTRY}/${name}:${VERSION}")"
            cosign sign --yes "${DIGEST}"
            echo "signed ${DIGEST}"
          done

      # РЕЕСТР ВЕРСИЙ (D-054): выпущенный движок записывается в deploy/releases.json
      # коммитом `chore(registry)` в main. Тип скрытый — Release PR платформы от
      # него НЕ открывается: реестр — данные, а не код, и релиз четырёх образов
      # ради JSON был бы тем самым пустым релизом, только на нашей стороне. На
      # хост он попадает через deploy/agent.sh::sync_registry — из origin/main,
      # после `cosign verify` дайджеста новейшей версии той же identity, что у
      # образов. Ревью сохраняется там, где оно нужно: пол минимальной версии
      # (`eol`) руками меняется только PR-ом в main; запись версии аддитивна.
      - name: record the engine in the versions registry
        if: env.STREAM == 'engine'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "${REGISTRY}/${IMAGE}:${VERSION}")"
          DIGEST="${DIGEST#*@}"
          git config user.name "release"
          git config user.email "release@pseudex.ru"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}"
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git checkout --quiet -B main origin/main
            (cd prototype && python3 -m licensing.registry record \
                --version "${VERSION}" --digest "${DIGEST}" --date "$(date -u +%F)" ../deploy/releases.json)
            git add deploy/releases.json
            git commit --quiet -m "chore(registry): pseudex ${VERSION}" \
              -m "Выпущен движок ${VERSION} (${DIGEST}). Записан пайплайном release.yml; на хост попадает через deploy/agent.sh::sync_registry после проверки подписи." \
              -m "Claude-Session: https://claude.ai/code/session_01LEE9ejun7XaQQChtLJjoRX" 2>/dev/null \
              || { echo "реестр уже содержит ${VERSION}"; break; }
            git push --quiet origin main && break
            [ "${attempt}" = 3 ] && { echo "::error::коммит реестра не запушился за 3 попытки"; exit 1; }
            echo "main ушёл вперёд, повтор ${attempt}"
          done

      - name: publish the release manifest
        run: |
          set -eu
          {
            echo "stream=${STREAM}"
            echo "version=${VERSION}"
            for name in ${IMAGES}; do
              echo "${name}=$(docker inspect --format='{{index .RepoDigests 0}}' "${REGISTRY}/${name}:${VERSION}")"
            done
          } > release-manifest.txt
          cat release-manifest.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: release-manifest, path: release-manifest.txt }
