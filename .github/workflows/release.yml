# Build, prove, sign, publish.
#
# THE ORDER IS THE POINT. The image is signed only after the gates that run
# against a real container have passed, so a signature means "this exact image
# was proved", not "this commit built". A pipeline that signs first and tests
# after produces trusted artefacts nobody verified.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Push and sign the image"
        type: boolean
        default: false

env:
  REGISTRY: ${{ vars.REGISTRY || 'cr.yandex/pseudex' }}
  IMAGE: pseudex

jobs:
  engine:
    name: engine — detection and product tests
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: prototype }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: prototype/requirements.txt
      - run: pip install -r requirements.txt

      # These need no container and no network, so they run first and fail fast.
      - name: core round trip
        run: python test_loop.py
      - name: vault canonicalisation and persistence
        run: python vault_test.py
      - name: 152-ФЗ type coverage
        run: python test_coverage_152fz.py
      - name: product invariants
        run: python test_product.py
      - name: operator surface
        run: python test_localui.py
      - name: hard cases and the chat register
        run: python test_hard_cases.py
      - name: name morphology and the round trip through it
        run: python test_names_morphology.py
      - name: credentials are anchored to prefixes, not entropy
        run: python test_credentials.py
      - name: the defects a persona run found
        run: python test_persona_defects.py
      - name: no over-masking on clean business text
        run: python test_overmasking.py

      # Seeded sets, so these are contracts rather than readings.
      - name: golden set — 298 values
        run: python make_dataset.py && python eval_detect.py
      - name: dirty set — 150 values
        run: python make_dirty.py && python eval_dirty.py

      # HERE AND NOT IN checks.yml. Part of what it asserts is loop
      # responsiveness under load, and a timing assertion on a shared runner
      # fails for reasons unrelated to the commit. On a release that is worth
      # waiting for; on every push it is a gate people learn to re-run.
      - name: cache, audit dedup and loop responsiveness
        run: python test_perf_masking.py

  storefront:
    name: storefront
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            storefront/requirements.txt
            prototype/requirements.txt
      # The storefront test drives the REAL licensing server, which lives in the
      # engine's environment — so both are installed, in the two virtualenvs the
      # test expects to find.
      - run: python -m venv prototype/.venv && prototype/.venv/bin/pip install -r prototype/requirements.txt
      - run: python -m venv storefront/.venv && storefront/.venv/bin/pip install -r storefront/requirements.txt
      - name: storefront end to end
        working-directory: storefront
        run: .venv/bin/python test_storefront.py

  gates:
    name: gates against real containers
    runs-on: ubuntu-latest
    needs: [engine]
    timeout-minutes: 90
    defaults:
      run: { working-directory: prototype }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: prototype/requirements.txt }
      - run: pip install -r requirements.txt

      # One signing key for the whole job. The verification key is compiled INTO
      # the release binary, so a fresh key between steps would force a second
      # Nuitka build and — worse — the licensing gates would then run against an
      # image that rejects the very server they start.
      - name: fix a signing key for this run
        run: echo "PSEUDEX_SIGNING_KEY=$(python -c 'from licensing.keys import encode_private; from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey; print(encode_private(Ed25519PrivateKey.generate()))')" >> $GITHUB_ENV

      # One tuning key for the whole job, for the same reason: it seals the blob
      # compiled into the release binary AND is delivered by the server the gates
      # start, so both halves must be the SAME value across every step. It must
      # reach production alongside the signing key — the licensing server there
      # needs it to deliver in leases (deploy/.env.example).
      - name: fix a tuning key for this run
        run: echo "PSEUDEX_TUNING_KEY=$(python -c 'import os, base64; print(base64.b64encode(os.urandom(32)).decode())')" >> $GITHUB_ENV

      - name: packaging gates (builds both images)
        run: python -u e2e/pack_gates.py
      - name: licensing gates on the release image
        run: python -u e2e/gates.py --image pseudex:compiled --skip-build

      - name: keep the proved image
        run: docker save pseudex:compiled | gzip > /tmp/pseudex-compiled.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: pseudex-compiled
          path: /tmp/pseudex-compiled.tar.gz
          retention-days: 7

  publish:
    name: sign and push
    runs-on: ubuntu-latest
    needs: [gates, storefront]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    permissions:
      id-token: write   # keyless signing
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: pseudex-compiled, path: /tmp }
      - run: docker load < /tmp/pseudex-compiled.tar.gz

      - uses: sigstore/cosign-installer@v3

      - name: log in
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login "${{ env.REGISTRY }}" -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin

      - name: tag and push
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ "${VERSION}" = "${GITHUB_REF_NAME}" ] && VERSION="$(git rev-parse --short HEAD)"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          docker tag pseudex:compiled "${REGISTRY}/${IMAGE}:${VERSION}"
          docker push "${REGISTRY}/${IMAGE}:${VERSION}"

      - name: sign the digest
        # The digest, never the tag: a tag is mutable, so a signature over one
        # says nothing about the bytes a customer eventually pulls. This is what
        # `cosign verify` on their side actually checks.
        run: |
          DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "${REGISTRY}/${IMAGE}:${VERSION}")"
          cosign sign --yes "${DIGEST}"

      # OUR OWN TWO IMAGES, BUILT HERE AND NOT ON THE HOST.
      #
      # They used to be `build:` entries in deploy/compose.yml, which means
      # `docker compose build` on the production machine — and then nothing
      # anywhere proves that what is running is what passed CI. A build on the
      # host can differ from a build here for a dozen boring reasons (a stale
      # layer cache, a base image that moved, a file that is gitignored on one
      # side), and the difference surfaces as a bug nobody can reproduce.
      #
      # Signed for the same reason the customer image is, even though only we
      # pull them: the deploy agent VERIFIES the signature before it restarts
      # anything, so a registry compromise cannot become a production
      # compromise. An unsigned image would make that check impossible and the
      # agent would be trusting the registry — which is exactly the thing a
      # signature exists to stop trusting.
      - name: build, push and sign our own images
        run: |
          set -eu
          for pair in "licensing:prototype:licensing/Dockerfile" "storefront:storefront:Dockerfile"; do
            NAME="${pair%%:*}"; REST="${pair#*:}"
            CTX="${REST%%:*}"; FILE="${REST#*:}"
            REF="${REGISTRY}/pseudex-${NAME}:${VERSION}"
            docker build -f "${CTX}/${FILE}" -t "${REF}" "${CTX}"
            docker push "${REF}"
            DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "${REF}")"
            cosign sign --yes "${DIGEST}"
            echo "pushed and signed ${DIGEST}"
          done

      # THE MANIFEST THE HOST READS. The deploy agent must not guess which
      # version is current, and it must not read a mutable `latest` — so the
      # release publishes one small file naming the exact digests it proved,
      # and the agent moves only when this file changes.
      - name: publish the release manifest
        run: |
          set -eu
          {
            echo "version=${VERSION}"
            for name in "${IMAGE}" "pseudex-licensing" "pseudex-storefront"; do
              echo "${name}=$(docker inspect --format='{{index .RepoDigests 0}}' "${REGISTRY}/${name}:${VERSION}")"
            done
          } > release-manifest.txt
          cat release-manifest.txt
      - uses: actions/upload-artifact@v4
        with: { name: release-manifest, path: release-manifest.txt }
