# Build, prove, sign, publish.
#
# THE ORDER IS THE POINT. The image is signed only after the gates that run
# against a real container have passed, so a signature means "this exact image
# was proved", not "this commit built". A pipeline that signs first and tests
# after produces trusted artefacts nobody verified.

name: release

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Push and sign the image"
        type: boolean
        default: false

# Read-only by default; `publish` raises its own (`id-token: write` for keyless
# signing) at the job level, so the four build jobs never hold it.
permissions:
  contents: read

# Releases queue, never cancel: a cancelled publish can leave a tag with two
# of five images pushed, and the host's agent pulls by tag. `cancel-in-progress`
# is false explicitly so nobody "fixes" it to true by analogy with checks.
concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ${{ vars.REGISTRY || 'cr.yandex/pseudex' }}
  IMAGE: pseudex

jobs:
  engine:
    name: engine — detection and product tests
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: prototype }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      # NO PIP CACHE ON A RELEASE. The Actions cache is writable from any branch
      # of this repository, and a wheel planted there by a branch build would be
      # restored into the job that decides whether v0.x publishes. Two minutes
      # of downloads per job buys a release that depends on nothing a branch
      # could have left behind.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      # These need no container and no network, so they run first and fail fast.
      - name: core round trip
        run: python test_loop.py
      - name: vault canonicalisation and persistence
        run: python vault_test.py
      - name: 152-ФЗ type coverage
        run: python test_coverage_152fz.py
      - name: product invariants
        run: python test_product.py
      - name: operator surface
        run: python test_localui.py
      - name: hard cases and the chat register
        run: python test_hard_cases.py
      - name: name morphology and the round trip through it
        run: python test_names_morphology.py
      - name: credentials are anchored to prefixes, not entropy
        run: python test_credentials.py
      - name: the defects a persona run found
        run: python test_persona_defects.py
      - name: no over-masking on clean business text
        run: python test_overmasking.py

      # Seeded sets, so these are contracts rather than readings.
      - name: golden set — 298 values
        run: python make_dataset.py && python eval_detect.py
      - name: dirty set — 150 values
        run: python make_dirty.py && python eval_dirty.py

      # HERE AND NOT IN checks.yml. Part of what it asserts is loop
      # responsiveness under load, and a timing assertion on a shared runner
      # fails for reasons unrelated to the commit. On a release that is worth
      # waiting for; on every push it is a gate people learn to re-run.
      - name: cache, audit dedup and loop responsiveness
        run: python test_perf_masking.py

  storefront:
    name: storefront
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"   # no cache: see the engine job
      # The storefront test drives the REAL licensing server, which lives in the
      # engine's environment — so both are installed, in the two virtualenvs the
      # test expects to find.
      - run: python -m venv prototype/.venv && prototype/.venv/bin/pip install -r prototype/requirements.txt
      - run: python -m venv storefront/.venv && storefront/.venv/bin/pip install -r storefront/requirements.txt
      - name: storefront end to end
        working-directory: storefront
        run: .venv/bin/python test_storefront.py

  gates:
    name: gates against real containers
    runs-on: ubuntu-latest
    needs: [engine]
    timeout-minutes: 90
    defaults:
      run: { working-directory: prototype }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }   # no cache: see the engine job
      - run: pip install -r requirements.txt

      # ОБА КЛЮЧА — ИЗ СЕКРЕТОВ РЕПОЗИТОРИЯ, А НЕ ИЗ СЛУЧАЙНОСТИ.
      #
      # ЗДЕСЬ ОНИ ГЕНЕРИРОВАЛИСЬ ЗАНОВО НА КАЖДЫЙ ПРОГОН, и релиз выпускал
      # образ, который невозможно лицензировать: ключ проверки компилируется В
      # БИНАРЬ, а боевой сервер подписывает лизы своим — контейнер отвечал бы
      # «lease signature is not ours» и не стартовал. Тюнинг едет в лизе, не в
      # образе (docs/tz-tuning-in-lease.md), поэтому второго ключа больше нет.
      #
      # И CI ЭТОГО НЕ ВИДЕЛ ПО ПОСТРОЕНИЮ. Гейты поднимают СВОЙ лицензионный
      # сервер с теми же одноразовыми ключами, поэтому L1–L22 зелены ровно
      # потому, что обе половины одинаково неправильные. Зелёный прогон
      # доказывал согласованность внутри job, а не пригодность артефакта.
      #
      # Отказ был бы fail-closed — не утечка, а нестартующий релиз, — но
      # обнаружился бы у заказчика.
      #
      # `::add-mask::` до первого использования, чтобы ключ не попал в логи.
      # ОТСУТСТВИЕ СЕКРЕТА — ЭТО ОСТАНОВКА, а не пустая строка: пустой ключ собрал
      # бы ровно тот же нелицензируемый образ, и тишина здесь стоила бы релиза.
      - name: take the release keys from repository secrets
        env:
          SIGNING: ${{ secrets.PSEUDEX_SIGNING_KEY }}
        run: |
          if [ -z "${SIGNING}" ]; then
            echo "::error::нет секрета PSEUDEX_SIGNING_KEY. Это то же значение," \
                 "что стоит в deploy/.env боевого хоста; собранный без него образ" \
                 "отвергнет каждую лизу боевого сервера."
            exit 1
          fi
          echo "::add-mask::${SIGNING}"
          echo "PSEUDEX_SIGNING_KEY=${SIGNING}" >> "$GITHUB_ENV"

      # P3 СРАВНИВАЕТ ОБРАЗЫ НА ЭТОМ НАБОРЕ, И БЕЗ НЕГО ОНО СРАВНИВАЛО ПОЛОВИНУ.
      #
      # `*.json` гитигнорятся, а `needs: [engine]` — другой раннер, так что файл
      # оттуда сюда не доезжает. `parity.py` без `dirty.json` тихо пишет
      # `{"skipped": True}`, оба отчёта получали одинаковое «пропущено», разниц
      # не было — и гейт, который обязан доказать «скомпилированный образ
      # детектирует ровно то же», проходил, не сравнив ни одного значения
      # грязного набора. Единственным следом было исчезновение recall и
      # precision из его же строки. Теперь P3 на пропуск краснеет, поэтому
      # наборы обязаны быть здесь.
      - name: the dirty set P3 compares the two images on
        run: python make_dirty.py

      # REGISTRY-КЭШ СЛОЁВ NUITKA. type=gha изолирован по git-ref, а релизы у нас
      # идут по ТЕГАМ — кэш прогона одного тега недостижим из другого
      # (docs.docker.com/build/cache/backends/gha: «only the current, base and
      # default branch»), проверено: v0.1.7 не попал в кэш v0.1.6. Registry-кэш
      # лежит в реестре и от ref НЕ зависит: слой компиляции движка переживает
      # релизы, storefront-only идёт минуты вместо часа. Гейты и подпись при этом
      # выполняются по собранному образу, как раньше. docker-container драйвер
      # (setup-buildx) нужен для registry-кэша и --load; логин в реестр — чтобы
      # кэш-образ пушить/тянуть (тот же секрет, что у publish).
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: log in to the registry for the build cache
        env:
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
        run: |
          [ -n "${REGISTRY_PASSWORD}" ] || { echo "::error::REGISTRY_PASSWORD пуст"; exit 1; }
          printf '%s' "${REGISTRY_PASSWORD}" | docker login "${REGISTRY%%/*}" -u "${REGISTRY_USERNAME}" --password-stdin
      - name: packaging gates (builds both images)
        env:
          PSEUDEX_BUILDX_CACHE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE }}:buildcache
        run: python -u e2e/pack_gates.py
      - name: licensing gates on the release image
        run: python -u e2e/gates.py --image pseudex:compiled --skip-build

      - name: keep the proved image
        run: docker save pseudex:compiled | gzip > /tmp/pseudex-compiled.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pseudex-compiled
          path: /tmp/pseudex-compiled.tar.gz
          # Consumed by `publish` in this same run; 430 MB kept for a week per
          # release is quota spent on nothing.
          retention-days: 1

  publish:
    name: sign and push
    runs-on: ubuntu-latest
    needs: [gates, storefront]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    permissions:
      id-token: write   # keyless signing
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: pseudex-compiled, path: /tmp }
      - run: docker load < /tmp/pseudex-compiled.tar.gz

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: log in
        # СЕКРЕТ — ЧЕРЕЗ ОКРУЖЕНИЕ, НЕ ЧЕРЕЗ ПОДСТАНОВКУ В СТРОКУ. Пароль
        # реестра Яндекса — JSON авторизованного ключа, с кавычками внутри;
        # `echo "${{ secrets.… }}"` разрывался на первой из них, docker получал
        # ПУСТОЙ stdin и падал с «Cannot perform an interactive login from a
        # non TTY device» — сообщение, по которому причину не найти. Первый
        # прогон с зелёными гейтами упал ровно здесь.
        #
        # ХОСТ, А НЕ ПУТЬ: `docker login` принимает сервер, а REGISTRY несёт
        # ещё и id реестра.
        env:
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
        run: |
          set -eu
          [ -n "${REGISTRY_PASSWORD}" ] || { echo "::error::REGISTRY_PASSWORD пуст"; exit 1; }
          printf '%s' "${REGISTRY_PASSWORD}" | docker login "${REGISTRY%%/*}" -u "${REGISTRY_USERNAME}" --password-stdin

      - name: tag the engine image
        # НИЧЕГО НЕ ЗАГРУЖАЕТСЯ, ПОКА НЕ ПРОЙДЕН СКАН. Здесь стояли `tag and
        # push` и сборка с пушем, то есть порядок «загрузить → проверить →
        # подписать». Он оставлял в реестре НЕПОДПИСАННЫЕ образы, если скан
        # падал: агент выкатки их видел, `cosign verify` возвращал пусто, и в
        # телеграм уходило «подпись не сошлась. Разберитесь, откуда взялся этот
        # образ» — тревога о подмене в реестре, которой не было. Проверено на
        # v0.3.10. Порядок «собрать → проверить → загрузить → подписать»
        # оставляет реестр чистым: упавший скан не оставляет в нём ничего.
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME#v}"
          [ "${VERSION}" = "${GITHUB_REF_NAME}" ] && VERSION="$(git rev-parse --short HEAD)"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          docker tag pseudex:compiled "${REGISTRY}/${IMAGE}:${VERSION}"

      # OUR OWN IMAGES, BUILT HERE AND NOT ON THE HOST.
      #
      # They used to be `build:` entries in deploy/compose.yml, which means
      # `docker compose build` on the production machine — and then nothing
      # anywhere proves that what is running is what passed CI. A build on the
      # host can differ from a build here for a dozen boring reasons (a stale
      # layer cache, a base image that moved, a file that is gitignored on one
      # side), and the difference surfaces as a bug nobody can reproduce.
      - name: build our own images
        run: |
          set -eu
          for pair in "licensing:prototype:licensing/Dockerfile" "storefront:storefront:Dockerfile" "backup:deploy:Dockerfile.backup" "supportbot:deploy/supportbot:Dockerfile"; do
            NAME="${pair%%:*}"; REST="${pair#*:}"
            CTX="${REST%%:*}"; FILE="${REST#*:}"
            REF="${REGISTRY}/pseudex-${NAME}:${VERSION}"
            docker build -f "${CTX}/${FILE}" -t "${REF}" "${CTX}"
            echo "built ${REF}"
          done

      # БЕСПЛАТНАЯ ЗАМЕНА ПЛАТНОМУ СКАНИРОВАНИЮ РЕЕСТРА.
      #
      # В Container Registry было включено «Сканирование Docker-образов при
      # загрузке»: 14,49 ₽ за образ, 90 сканирований за две недели и 1 217 ₽ из
      # 1 226 ₽ всего счёта. Хуже цены другое — результат никто не смотрел:
      # образ к тому моменту УЖЕ загружен и подписан, откатывать поздно, а
      # находки лежат во вкладке, куда никто не заходит.
      #
      # Trivy делает то же бесплатно и ДО подписи, то есть до того, как образ
      # станет выкатываемым. Пять образов сканируются ПАРАЛЛЕЛЬНО, база
      # скачивается один раз: шаг занимает около минуты, а не пять.
      #
      # ПОРОГ — CRITICAL, ДЛЯ КОТОРОГО ЕСТЬ ИСПРАВЛЕНИЕ. Уязвимость без
      # исправления заблокировала бы релизы навсегда: она живёт в базовом образе,
      # пока Debian её не выпустит, и не выкатываться это время нельзя. HIGH
      # печатается и не блокирует — так видно, к чему готовиться.
      #
      # ОТСУТСТВИЕ ОТЧЁТА — ЭТО ПРОВАЛ, А НЕ ПРОПУСК. Скан, который не
      # выполнился (нет доступа к реестру, упал jq, пустой файл), обязан
      # покраснеть: зелёный шаг без отчёта — ровно тот случай, ради которого
      # сканирование и ставили.
      - name: scan the images before pushing
        env:
          TRIVY_CACHE_DIR: /tmp/trivy-cache
        run: |
          set -eu
          IMAGES="${IMAGE} pseudex-licensing pseudex-storefront pseudex-backup pseudex-supportbot"
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /tmp/bin >/dev/null
          /tmp/bin/trivy image --download-db-only --quiet
          rm -f /tmp/scan-failed
          printf '%-24s %9s %9s\n' ОБРАЗ CRITICAL HIGH
          # ПОСЛЕДОВАТЕЛЬНО, А НЕ ПАРАЛЛЕЛЬНО, И ЭТО ИЗМЕРЕНО. Пять
          # одновременных `trivy image` с общим кэшем падают с «unable to
          # initialize cache: cache may be in use by another process: timeout» —
          # файловый кэш Trivy не рассчитан на несколько процессов. На v0.3.10
          # это дало пять пустых отчётов и красный гейт при ЖИВЫХ образах.
          # База скачивается один раз (16 с), скан образа занимает секунды,
          # поэтому последовательный прогон стоит около минуты — дешевле, чем
          # отдельный кэш на каждый образ и объяснение этого в комментарии.
          for name in ${IMAGES}; do
            report="/tmp/scan-${name}.json"
            rm -f "${report}"
            /tmp/bin/trivy image --quiet --scanners vuln --severity CRITICAL,HIGH \
              --ignore-unfixed --format json -o "${report}" \
              "${REGISTRY}/${name}:${VERSION}" || true
            if [ ! -s "${report}" ]; then
              printf '%-24s %9s %9s\n' "${name}" "—" "—"
              echo "::error::${name}: отчёта нет, скан не выполнился"
              echo "${name}" >> /tmp/scan-failed
              continue
            fi
            critical="$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' "${report}")"
            high="$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' "${report}")"
            printf '%-24s %9s %9s\n' "${name}" "${critical}" "${high}"
            [ "${critical}" = "0" ] || echo "${name}" >> /tmp/scan-failed
          done
          if [ -f /tmp/scan-failed ]; then
            echo "::error::исправимые CRITICAL в образах: $(tr '\n' ' ' < /tmp/scan-failed)"
            exit 1
          fi

      - name: push the images
        # ПУШ ПОСЛЕ СКАНА. Ретрай тот же и по той же причине: реестр дважды
        # ронял релиз уже после зелёных гейтов — `context deadline exceeded` на
        # манифесте и `dial tcp … i/o timeout` на слое. Пуш идемпотентен, поэтому
        # повтор дёшев. НЕ `|| true`: исчерпав попытки, шаг обязан упасть —
        # иначе подпишем то, чего в реестре нет.
        run: |
          set -eu
          for name in ${IMAGE} pseudex-licensing pseudex-storefront pseudex-backup pseudex-supportbot; do
            REF="${REGISTRY}/${name}:${VERSION}"
            for attempt in 1 2 3 4; do
              docker push "${REF}" && break
              [ "${attempt}" = 4 ] && { echo "::error::пуш ${REF} не прошёл за 4 попытки"; exit 1; }
              echo "пуш не прошёл (попытка ${attempt}), повтор через $((attempt * 15))с"
              sleep $((attempt * 15))
            done
            echo "pushed ${REF}"
          done

      - name: sign the digests
        # ПОДПИСЬ ПОСЛЕ СКАНА, А НЕ ДО НЕГО. Подписанный образ агент считает
        # доказанным и выкатывает, поэтому подписать раньше проверки значило бы
        # поставить печать на то, чего ещё не смотрели. Порядок здесь и есть
        # гейт: упавший скан оставляет образы неподписанными, и агент их не
        # возьмёт — он проверяет подпись до того, как что-либо остановит.
        #
        # The digest, never the tag: a tag is mutable, so a signature over one
        # says nothing about the bytes a customer eventually pulls. This is what
        # `cosign verify` on their side actually checks.
        run: |
          set -eu
          for name in ${IMAGE} pseudex-licensing pseudex-storefront pseudex-backup pseudex-supportbot; do
            DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "${REGISTRY}/${name}:${VERSION}")"
            cosign sign --yes "${DIGEST}"
            echo "signed ${DIGEST}"
          done

      # THE MANIFEST THE HOST READS. The deploy agent must not guess which
      # version is current, and it must not read a mutable `latest` — so the
      # release publishes one small file naming the exact digests it proved,
      # and the agent moves only when this file changes.
      - name: publish the release manifest
        run: |
          set -eu
          {
            echo "version=${VERSION}"
            for name in "${IMAGE}" "pseudex-licensing" "pseudex-storefront" "pseudex-backup" "pseudex-supportbot"; do
              echo "${name}=$(docker inspect --format='{{index .RepoDigests 0}}' "${REGISTRY}/${name}:${VERSION}")"
            done
          } > release-manifest.txt
          cat release-manifest.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: release-manifest, path: release-manifest.txt }
