# Проверка снаружи нашей инфраструктуры.
#
# ПОЧЕМУ НЕ НА ХОСТЕ. Сторож в `deploy/watch.sh` видит всё, что происходит
# внутри стенда, и не видит ровно одного: собственной смерти. Если машина
# выключилась, у гипервизора кончился диск или провайдер увёл сеть — сторож
# молчит вместе с ней, а молчание неотличимо от «всё хорошо».
#
# GitHub Actions здесь не «ещё один сервис», а единственная точка, которая уже
# есть, живёт не у нас и ничего не стоит. Тревога идёт в тот же Telegram-канал,
# что и всё остальное: два канала — это два места, куда забудут посмотреть.

name: uptime

# No checkout, nothing touches the repository: the token holds nothing.
permissions: {}

# A probe that hangs must not stack up behind itself every ten minutes.
concurrency:
  group: uptime
  cancel-in-progress: false

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  probe:
    name: probe the public surfaces
    runs-on: ubuntu-latest
    steps:
      - name: probe the public surfaces
        env:
          SITE_HOST: ${{ vars.SITE_HOST }}
          LICENSE_HOST: ${{ vars.LICENSE_HOST }}
          TG_TOKEN: ${{ secrets.PSEUDEX_TG_TOKEN }}
          TG_CHAT: ${{ secrets.PSEUDEX_TG_CHAT }}
        run: |
          set -u
          : > /tmp/fail

          # Три попытки с паузой, прежде чем кричать. Одиночный таймаут из
          # облака GitHub — это чаще сеть между нами, чем наш отказ, и тревога
          # на него обучает не верить тревогам.
          # ХОСТ ПРОВЕРЯЕТСЯ ОТДЕЛЬНЫМ АРГУМЕНТОМ, А НЕ ОБРЕЗКОЙ URL. Сторож
          # писался как «пропусти, если хост не задан», а снимал со строки
          # только «https://» — и от `https:///healthz` оставалось «/healthz»,
          # непустое. Незаданная переменная давала не пропуск, а ЛОЖНУЮ
          # ТРЕВОГУ, то есть ровно то, чему этот файл учит не верить.
          probe() {
            name="$1"; host="$2"; path="$3"; want="$4"
            [ -n "$host" ] || return 0
            url="https://${host}${path}"
            for _ in 1 2 3; do
              code="$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' "$url" || echo 000)"
              [ "$code" = "$want" ] && return 0
              sleep 10
            done
            printf '%s: %s -> %s (ожидали %s)\n' "$name" "$url" "$code" "$want" >> /tmp/fail
          }

          probe "витрина" "${SITE_HOST}" "/healthz" 200
          # Лицензионный сервер отвечает 405 на GET по /v1/lease, и это признак
          # жизни: 200 там не бывает никогда, а отказ соединения бывает.
          probe "лицензии" "${LICENSE_HOST}" "/v1/lease" 405

          [ -s /tmp/fail ] || exit 0

          TEXT="$(printf '%s\n\n%s\n\n%s' \
            '🔴 <b>Снаружи не отвечает</b>' \
            "<pre>$(cat /tmp/fail)</pre>" \
            'Сторож на хосте молчит — значит машина или сеть, а не сервис.')"
          curl -sS -o /dev/null \
            "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT}" -d "parse_mode=HTML" \
            --data-urlencode "text=${TEXT}"
          exit 1
