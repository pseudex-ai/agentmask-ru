# РЕЛИЗ — ЭТО MERGE RELEASE PR. Тег руками не создаётся (D-052).
#
# Два потока из одного репозитория (D-051): движок клиенту — `vX.Y.Z`, наша
# платформа — `platform/vX.Y.Z`. release-please читает release-please-config.json,
# приписывает каждый коммит компоненту по ФАЙЛАМ под его путём и держит на main
# по одному Release PR на компонент, в котором изменилось что-то видимое
# (feat/fix/security/perf/build/revert). Типы chore/ci/docs/refactor/test/
# research/bench версию не двигают. Корневого пакета «.» нет и быть не должно:
# он получает все коммиты и вернул бы «движок бампается от витрины».
#
# Два джоба, оба на push в main:
#   release-pr — открыть/обновить Release PR (changelog, version.txt, манифест);
#   tag        — если есть влитый, но ещё не выпущенный Release PR (метка
#                `autorelease: pending`; ищется по метке, не по HEAD): дождаться
#                зелёных проверок ЕГО merge-коммита, создать тег и GitHub
#                Release, ЯВНО запустить release.yml на теге. Идемпотентно и
#                перезапускаемо руками (workflow_dispatch). Не через триггер `tags:` — push токеном GITHUB_TOKEN
#                другие воркфлоу не запускает (так GitHub защищается от петель),
#                и тег без явного dispatch лежал бы без сборки. Ровно та причина,
#                по которой это делал ship.yml.
#
# Что здесь НЕ решается: «пустой релиз движка» (номер без изменений образа).
# Его ловят два гейта раньше и позже: deploy/lint_engine_commits.sh в checks.yml
# отказывает коммиту видимого типа, не тронувшему ничего из образа, а publish
# в release.yml красный на пустом diff шипящегося набора с прошлого тега.
name: release-please

on:
  push:
    # ВЕТКИ ПОДДЕРЖКИ — ТОТ ЖЕ МЕХАНИЗМ (D-057). `release/0.3` живёт шесть
    # месяцев после выхода 0.4 и принимает только security-коммиты (cherry-pick
    # из main, см. backport.yml); release-please на ней считает 0.3.Z+1 от
    # манифеста этой ветки, тег ставится тем же джобом, release.yml публикует
    # с алиасом только `0.3` — `latest` не двигается (licensing/registry.py).
    branches: [main, "release/**"]
  # Ручной запуск: пересчитать Release PR без нового push, или довести до тега
  # уже влитый Release PR (см. job `tag`). `force` — единственный способ поставить
  # тег на merge-коммит с НЕ зелёными проверками, и это осознанное решение
  # человека: например, красный только wiki-check на файле, который этот же
  # Release PR принёс, а карта починена следующим коммитом — перепроверить сам
  # merge-коммит уже нельзя. Публикацию это НЕ обходит: release.yml на теге
  # снова гоняет тесты и гейты и без зелёных не пушит ни одного образа.
  workflow_dispatch:
    inputs:
      force:
        description: "Поставить тег, даже если проверки merge-коммита не зелёные (осознанно)"
        type: boolean
        default: false

permissions: {}

# Один процесс на репозиторий: два одновременных запуска открывали бы два PR
# на один компонент или ставили бы тег дважды. Очередь, не отмена.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-pr:
    name: release PR — что выйдет, по потокам
    runs-on: ubuntu-latest
    permissions:
      contents: write        # ветка release-please--branches--…
      pull-requests: write   # сам PR
    steps:
      # НА ВЕТКЕ ПОДДЕРЖКИ — ТОЛЬКО ДВИЖОК. release-please-config.release.json
      # содержит один пакет `prototype`: платформенные пакеты на release/X.Y
      # считали бы platform/v0.3.N+1 от манифеста ветки — в том же пространстве
      # номеров, что main, — и следующий платформенный релиз с main упёрся бы в
      # уже существующий тег. Платформа выпускается только с main.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          skip-github-release: true
          config-file: ${{ github.ref_name == 'main' && 'release-please-config.json' || 'release-please-config.release.json' }}
          manifest-file: .release-please-manifest.json
          # main или release/X.Y — та ветка, куда пришёл push; манифест и
          # changelog читаются и пишутся в ней же.
          target-branch: ${{ github.ref_name }}

  tag:
    name: tag the merged release PR and dispatch release
    runs-on: ubuntu-latest
    needs: [release-pr]
    permissions:
      contents: write   # тег и GitHub Release
      actions: write    # gh workflow run release.yml
      checks: read      # gh api …/check-runs
      pull-requests: read   # gh api …/commits/<sha>/pulls — метка autorelease
    steps:
      # Без persist-credentials: git здесь только читает теги, а release-please
      # и gh ходят своим токеном через API.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      # НЕ «ЭТОТ PUSH — MERGE RELEASE PR?», А «ЕСТЬ ЛИ ВЛИТЫЙ, НО НЕ ВЫПУЩЕННЫЙ
      # RELEASE PR». Первая версия смотрела на GITHUB_SHA: push в main через
      # минуту после merge, и merge-коммит уже не HEAD — джоб говорил «обычный
      # push», а Release PR оставался без тега навсегда. release-please сам
      # ищет по метке `autorelease: pending` (после тега меняет её на
      # `autorelease: tagged`), и этот шаг делает то же: любой запуск — по push
      # или руками через workflow_dispatch — находит невыпущенное и доводит
      # его до тега. Идемпотентно: нет таких PR — нечего делать.
      - name: есть ли влитый, но не выпущенный Release PR?
        id: merged
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          shas="$(gh pr list --repo "${GITHUB_REPOSITORY}" --state merged --base "${GITHUB_REF_NAME}" \
                    --label 'autorelease: pending' --json number,mergeCommit \
                    --jq '.[] | "\(.number) \(.mergeCommit.oid)"' 2>/dev/null || true)"
          if [ -z "${shas}" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "невыпущенных Release PR нет — тегировать нечего"
            exit 0
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
          printf '%s\n' "${shas}" > /tmp/merged.txt
          echo "влиты и ждут тега:"; cat /tmp/merged.txt

      # НЕ «ЕСТЬ ЛИ ПРОВЕРКИ», А «ПРОШЛИ ЛИ ОНИ» — НА КАЖДОМ merge-коммите из
      # списка выше, не на HEAD. Свои джобы исключаются по префиксу имени;
      # ждёт, пока проверки хотя бы начнутся, и пока идущие закончатся.
      # «cancelled» — не зелёное: checks.yml на main больше не отменяет
      # прогоны, но если такой всё же встретится, здесь красное с именем.
      - name: проверки merge-коммитов зелёные
        if: steps.merged.outputs.release == 'true' && inputs.force != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          query='.check_runs[] | select((.name | startswith("tag ") or startswith("probe ") or startswith("release PR") or startswith("есть ли")) | not) | "\(.name)\t\(.status)\t\(.conclusion)"'
          while read -r number sha; do
            echo "== PR #${number} @ ${sha}"
            for _ in $(seq 1 12); do
              gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs?per_page=100" --jq "${query}" > /tmp/checks.tsv || true
              [ -s /tmp/checks.tsv ] && break
              sleep 10
            done
            total="$(wc -l < /tmp/checks.tsv)"
            if [ "${total}" -eq 0 ]; then
              echo "::error::для ${sha} нет НИ ОДНОЙ проверки — нечего считать зелёным"
              exit 1
            fi
            for _ in $(seq 1 60); do
              grep -qP '\t(queued|in_progress)\t' /tmp/checks.tsv || break
              sleep 60
              gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs?per_page=100" --jq "${query}" > /tmp/checks.tsv || true
            done
            bad="$(awk -F'\t' '$2 != "completed" || ($3 != "success" && $3 != "skipped" && $3 != "neutral")' /tmp/checks.tsv || true)"
            if [ -n "${bad}" ]; then
              echo "::error::проверки merge-коммита PR #${number} не зелёные — тег не ставится. Перезапустите их (gh run rerun --failed) и этот воркфлоу (gh workflow run release-please.yml):"
              echo "${bad}"
              exit 1
            fi
            echo "проверок зелёных: ${total}"
          done < /tmp/merged.txt

      - name: force — тег без зелёных проверок, по решению человека
        if: steps.merged.outputs.release == 'true' && inputs.force == true
        run: echo "::warning::тег ставится БЕЗ проверки зелёности merge-коммита — force=true; публикацию всё равно гейтит release.yml"

      - name: тег и GitHub Release
        if: steps.merged.outputs.release == 'true'
        id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          skip-github-pull-request: true
          config-file: ${{ github.ref_name == 'main' && 'release-please-config.json' || 'release-please-config.release.json' }}
          manifest-file: .release-please-manifest.json
          target-branch: ${{ github.ref_name }}

      # ЯВНЫЙ DISPATCH НА КАЖДЫЙ СОЗДАННЫЙ ТЕГ. Платформенные пакеты связаны
      # (linked-versions) и дают ОДИН тег на троих — дубли отбрасываются.
      - name: запустить сборку и публикацию по тегам
        if: steps.merged.outputs.release == 'true' && steps.rp.outputs.releases_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PATHS: ${{ steps.rp.outputs.paths_released }}
          RP_OUTPUTS: ${{ toJSON(steps.rp.outputs) }}
        run: |
          set -eu
          tags="$(printf '%s' "${RP_OUTPUTS}" | jq -r 'to_entries[] | select(.key | endswith("--tag_name")) | .value' | sort -u)"
          [ -n "${tags}" ] || { echo "::error::релизы созданы, а тегов в выводе нет: ${PATHS}"; exit 1; }
          for tag in ${tags}; do
            gh workflow run release.yml --ref "${tag}" -f publish=true
            echo "release запущен на ${tag}"
          done
          printf '%s\n' "${tags}" > /tmp/tags.txt

      - name: сказать, что поехало
        if: steps.merged.outputs.release == 'true' && steps.rp.outputs.releases_created == 'true'
        env:
          TG_TOKEN: ${{ secrets.PSEUDEX_TG_TOKEN }}
          TG_CHAT: ${{ secrets.PSEUDEX_TG_CHAT }}
        run: |
          set -eu
          [ -n "$TG_TOKEN" ] || exit 0
          tags="$(tr '\n' ' ' < /tmp/tags.txt)"
          curl -sS -o /dev/null \
            "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=🚢 Поставлены теги ${tags}. Сборка и гейты пошли; платформу хост подхватит сам, когда образы будут подписаны."
