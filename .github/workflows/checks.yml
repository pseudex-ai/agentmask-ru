# Every push. Fast checks only — the container gates live in release.yml because
# a 40-minute wait on every commit is a wait people learn to skip.
#
# WHAT "FAST" MUST STILL COVER. This file ran four suites out of ten and no
# detection eval at all, so the two instruments built precisely because our own
# numbers had lied — `test_overmasking` (clean business text, must be 100%) and
# the golden/dirty sets — were absent from the only check that runs on every
# commit. Work landed and stayed unguarded until somebody remembered to run a
# script by hand. Everything that needs no container is here now.
#
# `test_perf_masking` is deliberately NOT here and lives in release.yml: part of
# what it asserts is loop responsiveness under load, and a timing assertion on a
# shared runner is a gate that fails for reasons unrelated to the commit. A gate
# people learn to re-run is worse than no gate.

name: checks

# The token is READ-ONLY for every job here. Nothing in this file writes to the
# repository, and a third-party action holding the default token (write, when
# the repository is configured that way) could. Stated in the file so that a
# repository setting never decides it.
permissions:
  contents: read

# A newer push to the same BRANCH cancels the run in flight: the verdict on a
# commit that has already been replaced is read by nobody — EXCEPT on main.
# There every commit's verdict is read by the release-please `tag` job, which
# tags the merge commit of a Release PR only on green checks OF THAT COMMIT; a
# docs push a minute after the merge cancelled its run, the tag job saw
# «cancelled» and the release never happened. On main runs queue, never cancel.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  engine:
    name: engine — product and detection invariants
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: prototype }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12", cache: pip, cache-dependency-path: prototype/requirements.txt }
      - run: pip install -r requirements.txt

      - name: core round trip
        run: python test_loop.py
      - name: A2 closed — tuning in the lease, no offline path
        run: python test_tuning_lease_security.py
      - name: watermark — every lease stamped, dump names the org
        run: PSEUDEX_WATERMARK_SECRET=ci-watermark-secret python test_watermark.py
      - name: canaries — per-org marks, a clone names its org
        run: PSEUDEX_CANARY_SECRET=ci-canary-secret python test_canary.py
      - name: clock-freeze liveness — wall-clock ceiling on the monotonic timer
        run: python test_clock_freeze.py
      - name: detok surface — audit + rate-limit + org-bind, narrowed preview
        run: python test_detok_security.py
      - name: memory-read tripwire — reader attributed + reported to the vendor
        run: python test_tripwire.py
      - name: memory hardening — no core, non-dumpable, swap-locked
        run: python test_memory_hardening.py
      - name: vault canonicalisation and persistence
        run: python vault_test.py
      - name: 152-ФЗ type coverage
        run: python test_coverage_152fz.py
      - name: product invariants
        run: python test_product.py
      - name: operator surface
        run: python test_localui.py
      - name: hard cases and the chat register
        run: python test_hard_cases.py
      - name: name morphology and the round trip through it
        run: python test_names_morphology.py
      - name: credentials are anchored to prefixes, not entropy
        run: python test_credentials.py
      - name: the defects a persona run found
        run: python test_persona_defects.py
      # ДЕШЁВЫЙ И ЗДЕСЬ, А НЕ В ГЕЙТАХ: он не поднимает контейнер, а гоняет
      # арифметику предполёта, чтение cgroup и контракт потоков между
      # `serve_main.py` и `entrypoint.sh`. Живой отказ по памяти проверяет L22
      # против настоящего контейнера — но регрессию в контракте надо ловить
      # раньше, чем через ночной прогон.
      - name: preflight — сколько воркеров влезает и что будет, если не влезают
        run: python test_preflight.py
      # СХЕМА ТОМА (D-058…D-060), без контейнера: свежий стор штампуется,
      # до-версионный получает снимок и все шаги, том из будущего отвергается
      # нетронутым, и максимум по стору равен schema_lock.json для минора из
      # version.txt — новый шаг миграции при том же миноре красный.
      - name: schema — номер тома, снимок до подъёма, отказ тому из будущего, пин по минору
        run: python test_schema.py
      # Тоже без контейнера: проверяются форма собираемых команд (ошибка в ней
      # невидима — docker выполнит неправильное молча), вердикты doctor и
      # доказательство ротации.
      - name: pseudexctl — вердикты и доказательство ротации
        run: python test_pseudexctl.py

      # ЗАГОЛОВОК — НЕ ДОКАЗАТЕЛЬСТВО ТОГО, ЧТО СТРАНИЦА РАБОТАЕТ. Однажды
      # интерфейс отдавал 200 на страницу и на все ассеты, заголовок CSP
      # совпадал с ожидаемым в тесте — и не исполнялся ни один скрипт, потому
      # что `script-src 'self'` резал import map. Единственный способ это
      # увидеть — открыть браузером.
      - name: браузер для проверки интерфейса
        run: pip install playwright && python -m playwright install --with-deps chromium
      - name: интерфейс исполняется, а не просто отдаёт 200
        run: python test_localui_renders.py

      # ДЕНЕЖНЫЙ ТРАКТ БЕГАЕТ НА КАЖДОМ ПУШЕ. Оба этих набора не запускались в
      # CI вообще: первый лежал в дереве и вызывался руками, второго не
      # существовало. Ровно поэтому 403 на `/admin/resume` — то есть оплаченный
      # и невозобновлённый клиент — прожил в дереве до ручного прогона.
      - name: metering attacks (store)
        run: python licensing/test_metering_attacks.py
      - name: metering attacks (HTTP surface and capacity protocol)
        run: python licensing/test_admin_api.py
      # Ran only in release.yml until the v0.3.16 tag went red on it: a test
      # that runs first at release time fails at the worst moment there is.
      - name: versions registry — every promise of the ТЗ
        run: python -m licensing.test_registry
      - name: licensing store upgrades on existing data
        run: python -m licensing.test_store_upgrade
      - name: cache, audit dedup and loop responsiveness
        run: python test_perf_masking.py

      # The one that exists because every metric we had said 100% while «Счёт
      # 1234 от 15.05.2025» was being masked. Ordinary business text, no PII in
      # it, and any mask on it is a false one.
      - name: no over-masking on clean business text
        run: python test_overmasking.py

      # ПРИБОР, КОТОРЫЙ НЕ УМЕЕТ КРАСНЕТЬ, — НЕ ПРИБОР, и проверяется это на
      # каждом пуше (ТЗ на харнесс, п. 19). `test_perfect` прогоняет ИДЕАЛЬНЫЙ
      # шлюз по ярусу medium и требует, чтобы он взял КАЖДЫЙ объявленный порог,
      # а четыре НЕПРАВИЛЬНЫХ шлюза эти же пороги провалили; плюс три поправки,
      # сделавшие пробу честной, откатываются прямо в нём и обязаны покраснеть.
      # Ярус medium — наименьший, на котором бьются все три поправки (на nano и
      # small первая не двигает ничего), ~20 с. Весь корпус (`--tier max`,
      # ~2 мин) — в ночном прогоне: числа публикуются только с него.
      # Модели, сети и ключей не нужно — корпус, реестр инструментов и арифметика.
      - name: приёмка прибора — идеальный шлюз берёт пороги, неправильные их валят
        run: python -m bench.agentpii5.test_perfect

      # ПРОВЕРКА, КОТОРАЯ НЕ МОЖЕТ УПАСТЬ, — ЭТО УДАЛЁННАЯ ПРОВЕРКА. В наборе
      # атак стояло `check(..., breaks > 0 or True, ...)`: тождественно зелёная
      # строка в файле, чей докстринг обещает, что одна строка всегда красная.
      - name: no tautological checks in our own tests
        run: |
          # --exclude-dir=.venv: CI installs into the system interpreter and has
          # no virtualenv, but a developer running this same line locally hits
          # numpy's own test suite and gets a failure that has nothing to do with
          # their change. A guard people cannot run is a guard people ignore.
          if grep -rnE "or True[,)]|assert True\b" --include="test_*.py" --exclude-dir=.venv . ; then
            echo "проверка, которая не может упасть, — это удалённая проверка"
            exit 1
          fi

      # И ГЛУШИТЕЛЬ ТОЖЕ. `except Exception` в тесте допустим, только если он
      # ФИКСИРУЕТ провал: в `test_billing_e2e.py` он глотал 403 и пропускал три
      # проверки, оставляя прогон зелёным.
      - name: no swallowed failures in our own tests
        run: python3 e2e/lint_tests.py . licensing pseudex e2e ../storefront

      # The engine must never import the licensing package: that is what keeps
      # the assets out of the image, and it is cheaper to catch here than in a
      # build that has already shipped.
      - name: pseudex/ must not import licensing/
        run: |
          if grep -rn "^[[:space:]]*\(from\|import\)[[:space:]]\+licensing" pseudex/; then
            echo "pseudex/ imports licensing/ — the leased assets would ship in the image"
            exit 1
          fi

  storefront:
    name: storefront — the money path, against a REAL licensing server
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: storefront }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      # Два venv: витрина сознательно не делит зависимости с движком, а тест
      # поднимает НАСТОЯЩИЙ лицензионный сервер в его окружении.
      - run: python -m venv ../prototype/.venv && ../prototype/.venv/bin/pip install -q -r ../prototype/requirements.txt
      - run: python -m venv .venv && .venv/bin/pip install -q -r requirements.txt
      # ЭТО ЕДИНСТВЕННЫЙ ТЕСТ, КОТОРЫЙ ТРОГАЕТ ДЕНЕЖНЫЙ ТРАКТ, и он бежал
      # только на теге. Оплата, не возвращающая обслуживание, доживала до
      # релиза.
      - name: storefront end to end
        run: .venv/bin/python test_storefront.py

      # ОПЛАТА — ТОТ ЖЕ ДЕНЕЖНЫЙ ТРАКТ, и до этой строки её не проверял никто.
      # Заплатить во время пробы было ФИЗИЧЕСКИ НЕЧЕМ — счёт выставлял только
      # месячный цикл, — и ни один тест этого не увидел: все они ходят по
      # жизненному циклу подписки, а он работал. Отсутствовала дверь, а
      # отсутствие двери не ломает проверку, которая ходит в окно.
      - name: оплатить можно в любой момент, проба выдаётся один раз
        run: .venv/bin/python test_paywall.py
      # ДЕНЬГИ, ЗА КОТОРЫЕ НЕ ДАЛИ КЛЮЧ. 28.09.2026 клиент заплатил 990 ₽: у
      # ЮKassa платёж `succeeded`, у нас счёт `issued`, подписка `pending`,
      # ключей ноль. Уведомление ЮKassa — настройка в ЧУЖОМ кабинете, и она не
      # была сделана: за всё время ни одного POST на /hooks/yookassa. Единственной
      # дверью было уведомление, а страница возврата ничего не перепроверяла.
      # Проверить это было нечем: lifecycle сам присылает уведомление, e2e ходит
      # против настоящего магазина и требует карты.
      - name: оплачено у провайдера — значит оплачено у нас, даже без уведомления
        run: .venv/bin/python test_payment_return.py
      - name: каждая кнопка пробы доводит до ключа
        run: .venv/bin/python test_signup_forms.py
      # Ломается МОЛЧА И СНАРУЖИ: канонический адрес, уехавший на стенд, кабинет
      # в выдаче, цена для робота, разошедшаяся с базой. Увидеть это можно в
      # чужой выдаче через несколько недель, когда чинить поздно.
      - name: поисковик видит то, что должен, и не видит закрытого
        run: .venv/bin/python test_seo.py
      - name: база знаний отвечает, а её разметка не разошлась с текстом
        run: .venv/bin/python test_kb.py
      - name: замер поиска — отказ источника не становится нулём
        run: .venv/bin/python test_seo_monitor.py
      # Белый список роботов fail2ban. Ошибка в нём стоит в обе стороны: строгий
      # вариант отрезает поисковику обход и сайта нет в выдаче, мягкий отдаёт
      # сканеру лазейку мимо бана. Проверка детерминированная — DNS поддельный,
      # поэтому она не краснеет от чужой зоны.
      - name: робот пропускается по подтверждённому имени, подделка — нет
        run: .venv/bin/python test_crawler_allowlist.py
      - name: текст про аналитику следует за настройкой, в обе стороны
        run: .venv/bin/python test_analytics.py
      - name: API-версия, смысл целей и dry-run не теряют безопасность
        run: .venv/bin/python test_yandex_api.py
      - name: перерасход включается только явным выбором
        run: .venv/bin/python test_overage_toggle.py
      - name: страницы входа в брендовом каркасе
        run: .venv/bin/python test_auth_style.py
      - name: пароля у клиента нет, второй фактор админки цел
        run: .venv/bin/python test_passwordless.py
      - name: админку открывает код, а не пароль
        run: .venv/bin/python test_admin_2fa.py
      # Проверяет не код, а COMPOSE: называют ли скрипты деплоя существующие
      # таблицы и умеет ли контейнер миграций то, что он запускает. Живёт здесь,
      # а не в соседней джобе, потому что ему нужен настоящий Django.
      - name: деплой называет существующее и умеет то, что запускает
        run: .venv/bin/python test_deploy_references.py
      - name: офферы, потолок объёма и годовая оплата
        run: |
          .venv/bin/python test_offers.py
          .venv/bin/python test_hardcap.py
          .venv/bin/python test_annual.py

      # ВЕРДИКТ КОНФИГУРАТОРА СЧИТАЕТСЯ В БРАУЗЕРЕ, и «страница отдала 200» его
      # не проверяет: блок остался бы отрендеренным, даже если `landing.js`
      # падает на первой строке. Эта проверка нашла в своём же диффе две вещи —
      # многострочный `{# #}`, отрендеренный как видимый текст, и кнопку,
      # которой `hidden` не помогал, потому что `.btn{display:inline-block}`
      # перебивает браузерное `[hidden]{display:none}`.
      - name: браузер для проверки конфигуратора
        run: .venv/bin/pip install -q playwright && .venv/bin/python -m playwright install --with-deps chromium
      - name: браузер исполняет consent, signup и маскирование email
        run: .venv/bin/python test_analytics_browser.py
      - name: конфигуратор исполняется, а не просто отдаёт 200
        run: .venv/bin/python test_configurator_renders.py
      # Консоль операций закрыта вторым фактором, и проверка ходит туда тем же
      # путём, что человек: пароль, потом устройство и код. Она уже краснела
      # молча — по таймауту на поле, которого на странице больше нет.
      - name: экраны операций рисуются на настоящих данных
        run: .venv/bin/python test_ops_renders.py

  deploy:
    name: deploy scripts and compose
    runs-on: ubuntu-latest
    steps:
      # FULL HISTORY AND TAGS, FROM THE CHECKOUT. The registry gate below reads
      # `HEAD~1:deploy/releases.json` and asks whether tag `v<latest>` exists;
      # a depth-1 clone has no HEAD~1 (the additive check silently skipped
      # itself) and a `git fetch --tags` after `persist-credentials: false`
      # has no credential («could not read Username», exit 128).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false, fetch-depth: 0, fetch-tags: true }
      # THE OPS STACK CAN SHIP BROKEN AND NOBODY WOULD KNOW UNTIL IT RAN. The
      # deploy agent runs unattended on production at 3am; a typo in it is
      # discovered by the thing it was supposed to prevent. None of this needs a
      # container, so it costs seconds.
      - name: shell syntax
        run: for f in deploy/*.sh; do sh -n "$f" || exit 1; done
      - name: shellcheck
        run: |
          sudo apt-get install -y --no-install-recommends shellcheck >/dev/null
          # SC2029/SC1090 are about sourcing and remote expansion, neither of
          # which these scripts do; everything else is a real finding.
          shellcheck -e SC1090,SC1091 -S warning deploy/*.sh
      # РЕШЕНИЯ АГЕНТА ВЫКАТКИ, БЕЗ DOCKER: за каким тегом он идёт, как
      # сравнивает `platform/v0.3.16` с `v0.3.15`, когда отказывает. Один
      # неверный `sort -V` здесь — и агент считает КАЖДЫЙ релиз откатом.
      - name: the deploy agent follows platform/v* and compares by number
        run: sh deploy/test_agent.sh
      # РЕЕСТР ВЕРСИЙ ЧЕСТЕН (D-054, D-056): схема, порядок циклов, алиасы, eol
      # только с уведомлением за 90 дней; относительно предыдущего файла —
      # только аддитивно (дайджест записанной версии не меняется, latest не
      # идёт назад, цикл не исчезает). Тег `v<latest>` существует: файл не
      # может обещать версию, которой нет.
      - name: the versions registry is sound and additive
        run: |
          set -eu
          git cat-file -e "HEAD~1" || { echo "::error::нет HEAD~1 — чекаут неглубокий, гейт аддитивности не может сработать"; exit 1; }
          previous=""
          if git cat-file -e "HEAD~1:deploy/releases.json" 2>/dev/null; then
            git show HEAD~1:deploy/releases.json > /tmp/releases-previous.json
            previous="--previous /tmp/releases-previous.json"
          fi
          # shellcheck disable=SC2086
          (cd prototype && python3 -m licensing.registry validate ${previous} ../deploy/releases.json)
          latest="$(python3 -c "import json; print(json.load(open('deploy/releases.json'))['cycles'][0]['latest']['version'])")"
          git tag -l "v${latest}" | grep -qx "v${latest}" || { echo "::error::реестр называет latest ${latest}, а тега v${latest} нет"; exit 1; }
          echo "реестр: latest ${latest}, тег есть"
      # ДВИЖОК БАМПАЕТСЯ ТОЛЬКО ОТ ДВИЖКА (D-051, D-052): коммит видимого типа,
      # тронувший prototype/ и ничего из образа, — красный здесь, а не пустой
      # релиз потом. Конфиг release-please без корневого пакета «.» — он
      # получает все коммиты. Набор файлов образа из COPY-строк Dockerfile.nuitka
      # целиком под путями пакета движка минус исключённые каталоги.
      - name: engine commits are typed honestly and the release config has no root package
        run: |
          set -eu
          # No fetch: the checkout above is full (all branches, all tags) and
          # holds no credential, so a fetch here fails with «could not read
          # Username» — origin/main is already in the clone.
          base="$(git merge-base origin/main HEAD 2>/dev/null || echo "")"
          if [ -n "${base}" ] && [ "${base}" != "$(git rev-parse HEAD)" ]; then
            sh deploy/lint_engine_commits.sh "${base}..HEAD"
          else
            sh deploy/lint_engine_commits.sh HEAD
          fi
          python3 - <<'PY'
          import json, subprocess
          cfg = json.load(open("release-please-config.json"))
          assert "." not in cfg["packages"], "release-please-config.json: корневой пакет «.» получает все коммиты — его быть не должно"
          # Конфиг веток поддержки — ТОЛЬКО движок, и тот же пакет, что в main:
          # платформенный пакет на release/X.Y чеканил бы platform/v* из
          # манифеста ветки в одном пространстве номеров с main.
          rel = json.load(open("release-please-config.release.json"))
          assert set(rel["packages"]) == {"prototype"}, f"release-please-config.release.json: только пакет prototype, есть {sorted(rel['packages'])}"
          assert rel["packages"]["prototype"] == cfg["packages"]["prototype"], "release-please-config.release.json: пакет prototype расходится с основным конфигом"
          assert "plugins" not in rel, "release-please-config.release.json: linked-versions платформы на ветке поддержки не нужен"
          engine = cfg["packages"]["prototype"]
          excluded = tuple(engine.get("exclude-paths", []))
          shipped = subprocess.run(["sh", "deploy/shipped_paths.sh"], capture_output=True, text=True, check=True).stdout.split()
          for path in shipped:
              assert path.startswith("prototype/"), f"файл образа вне пакета движка: {path}"
              assert not path.startswith(excluded), f"файл образа в исключённом каталоге: {path}"
          print(f"release config: {len(shipped)} shipped paths inside package prototype, root package absent")
          PY
      # СПИСОК ОБЯЗАТЕЛЬНЫХ ПЕРЕМЕННЫХ БЕРЁТСЯ ИЗ САМОГО COMPOSE, А НЕ ИЗ ПАМЯТИ,
      # И СЧИТАЕТСЯ ОДИН РАЗ НА ВСЕ ШАГИ.
      #
      # Раньше три имени были вписаны руками, а `${VAR:?}` в compose уже восемь —
      # и `.env.example` держит секреты ПУСТЫМИ, что `:?` считает отсутствием.
      # Каждая обязательная переменная, добавленная после написания шага, его
      # ломала: на `main` он падал на PSEUDEX_LICENSE_ADMIN_TOKEN и был красным,
      # хотя называется «compose is valid with the documented variables» и не мог
      # стать зелёным ни при каких документированных переменных.
      #
      # ДВЕ ФОРМЫ, А НЕ ОДНА: у Compose обязательны и `${VAR:?msg}`, и
      # `${VAR?msg}`. Ловилась только первая, и вторая давала ложный зелёный.
      # Комментарии выброшены до поиска — иначе строка комментария, называющая
      # переменную, требовала бы её существования.
      - name: collect the variables compose declares mandatory
        run: |
          required=$(grep -v '^[[:space:]]*#' deploy/compose.yml \
            | grep -oE '\$\{[A-Za-z_][A-Za-z0-9_]*:?\?' \
            | sed -E 's/^\$\{//; s/:?\?$//' | sort -u)
          count=$(printf '%s\n' "$required" | grep -c . || true)
          echo "обязательных переменных в compose: $count"
          # ПУСТОЙ СПИСОК — ЭТО ПОЛОМКА ПОИСКА, А НЕ ОТСУТСТВИЕ ТРЕБОВАНИЙ.
          # Без этой строки правка grep'а делала бы оба шага ниже вечнозелёными.
          if [ "$count" -lt 5 ]; then
            echo "поиск обязательных переменных сломан: нашёл $count" >&2
            exit 1
          fi
          echo "REQUIRED_VARS=$(printf '%s' "$required" | tr '\n' ' ')" >> "$GITHUB_ENV"

      # Проверяется то, что и обещано: файл СОБИРАЕТСЯ. Значения заведомо
      # фиктивные — настоящие лежат в `.env` на хосте, и проверять их нечем.
      - name: compose is valid with the documented variables
        run: |
          set -a; . deploy/.env.example; set +a
          for name in $REQUIRED_VARS; do
            eval "value=\${$name:-}"
            [ -n "$value" ] || export "$name=placeholder"
          done
          docker compose -f deploy/compose.yml config >/dev/null
          # A «variable is not set» WARNING IS A DEFECT, NOT NOISE. Compose
          # interpolates `$name` inside `command:` before the shell ever runs,
          # so a warning here names a shell variable compose just blanked —
          # `eval "val=\$$$v"` in the bot's render became `val=\$`, and its
          # empty-token guard passed on a literal "$". Both profiles on, so
          # the profiled services are interpolated too.
          warnings="$(COMPOSE_PROFILES=observability,support \
                      docker compose -f deploy/compose.yml config 2>&1 >/dev/null \
                      | grep 'variable is not set' || true)"
          if [ -n "$warnings" ]; then
            echo "$warnings"
            echo "::error::compose interpolated a variable that should have been \$\$-escaped"
            exit 1
          fi

      # СЕРВИС ПОД ПРОФИЛЕМ НЕ ИМЕЕТ ПРАВА ТРЕБОВАТЬ ПЕРЕМЕННУЮ.
      #
      # Это НЕ то же самое, что шаг выше, и заведено потому, что шаг выше сам по
      # себе перестал ловить эту беду: он подставляет заглушки ВСЕМ обязательным
      # переменным, поэтому `:?` у выключенного по умолчанию сервиса оставил бы
      # CI зелёным, а `docker compose up -d` на боевой машине — сломанным.
      # Compose подставляет значения ДО отбора профилей. Ровно это и случилось
      # с Grafana.
      - name: a profiled service must not require a variable
        run: |
          awk '
            # Верхнеуровневый ключ: входим в services или выходим из него.
            /^[A-Za-z]/ { in_services = ($0 ~ /^services:/); cur = ""; next }
            !in_services { next }
            # Комментарий — не код. Без этого строка, ОБЪЯСНЯЮЩАЯ убранное
            # требование, роняла бы проверку на верном файле.
            /^[[:space:]]*#/ { next }
            # Имя сервиса. Хвостовой комментарий допустим: `  grafana:  # …`
            # раньше сбрасывал разбор и делал проверку слепой на своём же случае.
            /^  [A-Za-z0-9_-]+:[[:space:]]*(#.*)?$/ { cur = $1; sub(":", "", cur); seen[cur] = 1; next }
            cur == "" { next }
            /^    profiles:/ { profiled[cur] = 1 }
            /\$\{[A-Za-z_][A-Za-z0-9_]*:?\?/ { requires[cur] = 1 }
            END {
              if (length(seen) == 0) { print "разбор compose не нашёл ни одного сервиса"; exit 1 }
              bad = ""
              for (s in seen) if (profiled[s] && requires[s]) bad = bad " " s
              if (bad != "") {
                print "профильные сервисы с обязательными переменными:" bad
                print "compose подставляет значения ДО отбора профилей — такой сервис ломает обычный up -d"
                exit 1
              }
              printf "сервисов: %d, из них профильных без требований: ok\n", length(seen)
            }
          ' deploy/compose.yml

      # И ОТДЕЛЬНО: КАЖДАЯ ОБЯЗАТЕЛЬНАЯ ПЕРЕМЕННАЯ ДОЛЖНА БЫТЬ НАЗВАНА В
      # `.env.example`. Шаг с заглушками сам по себе её больше не заметит, а
      # узнать о переменной на боевой машине посреди выката — худший вариант.
      - name: every required variable is documented in .env.example
        run: |
          missing=""
          for name in $REQUIRED_VARS; do
            grep -qE "^${name}=" deploy/.env.example || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "нет в deploy/.env.example:$missing"
            exit 1
          fi
          echo "все обязательные переменные документированы"

      # A FAILED ALARM MUST NOT BE A SILENT ONE. `if ! curl` stood here and never
      # fired: without --fail curl calls HTTP 400 a successful transfer and exits
      # 0, so Telegram rejecting a malformed or over-long body lost the alarm with
      # nothing in the log. Found by sending a real message on 2026-08-29.
      #
      # No test hook is added for this: a bogus token gets a deterministic 404
      # from the real API, and an unreachable API leaves the same non-200 path,
      # so the assertion holds whether or not the network is there.
      # A FILTER AT THE END OF A CONDITION STEALS THE EXIT CODE IN FRONT OF IT.
      # `if ! deploy … | tail -20` stood in agent.sh and never fired: a pipeline
      # returns its LAST command's status and tail always succeeds. `pipefail`
      # is no answer — POSIX sh does not have it and dash does not support it.
      # A failed pull therefore read as success, the old containers stayed up and
      # healthy, and the agent wrote the NEW version into its state file while
      # production ran the old one — reporting "deploy ready" as it did so.
      #
      # shellcheck does not flag this (check-extra-masked-returns is about
      # command substitutions, verified on the exact line), so the check is here.
      # `$(…)` is stripped first: a pipeline inside a substitution yields a
      # STRING and its status is never read. `| grep -q` is untouched by design —
      # there the filter IS the test (watch.sh checks the HTTP code that way).
      - name: no condition takes its exit code from a trailing filter
        run: |
          bad=0
          for f in deploy/*.sh; do
            # shellcheck disable=SC2016  # the $( is a sed pattern, not an expansion
            hit=$(sed 's/\$([^()]*)//g' "$f" \
                  | grep -nE '^[[:space:]]*(if|while|until)[[:space:]].*\|[[:space:]]*(tail|head|cut|tr|wc|sed|awk)\b' \
                  || true)
            [ -n "$hit" ] && { echo "$f: $hit"; bad=1; }
          done
          exit $bad

      - name: a rejected alarm is reported, not swallowed
        run: |
          out=$(PSEUDEX_TG_TOKEN=1:bogus PSEUDEX_TG_CHAT=1 \
                sh deploy/notify.sh crit "ci" "body" 2>&1 >/dev/null || true)
          case "$out" in
            *"НЕ ДОСТАВЛЕНО"*) : ;;
            *) echo "notify.sh swallowed a rejected send: '$out'"; exit 1 ;;
          esac

      - name: systemd units parse
        run: |
          sudo apt-get install -y --no-install-recommends systemd >/dev/null
          # Юниты называют БОЕВОЙ путь, а раннер держит репозиторий в другом
          # месте, поэтому `systemd-analyze` докладывал «Command ... is not
          # executable: No such file or directory» про оба ExecStart. Шаг не мог
          # пройти ни при каком состоянии файлов, и это стало видно только
          # сейчас: до Э11 джоба падала раньше, на проверке compose, и сюда не
          # доходила. Ссылка делает утверждение НАСТОЯЩИМ, а не глушит его
          # фильтром: снятый бит исполнения или переименованный скрипт теперь
          # красят шаг, а именно это он и должен ловить.
          sudo ln -sfn "$GITHUB_WORKSPACE" /opt/pseudex
          test -x /opt/pseudex/deploy/agent.sh
          if systemd-analyze verify deploy/systemd/*.service deploy/systemd/*.timer 2>&1 \
               | grep -v "Unit .* not found" | grep .; then
            exit 1
          fi

  workflows:
    name: workflow files lint clean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      # SEVEN OF THE LAST DEFECTS IN THESE FILES WERE VISIBLE ONLY BY RUNNING
      # THEM, and two of the seven are exactly what these two tools flag
      # statically: a `${{ }}` spliced into a `run:` script (text substitution
      # before the shell — a quote inside the value becomes a quote of the
      # script, which is how the registry JSON key broke `docker login`), and a
      # `permissions:` key declared twice. actionlint runs shellcheck over every
      # `run:` block and checks expression types; zizmor is the security audit
      # (template injection, unpinned actions, excessive token permissions,
      # cache poisoning on release triggers). Pedantic persona: the point is to
      # hear about it before a run does.
      # BOTH VERSIONS PINNED, shellcheck included: actionlint calls whichever
      # shellcheck is on PATH, and the runner image's copy moves with the
      # image. The first run of this job went red on SC2015 that the local
      # copy did not report — a verdict that depends on the runner's month is
      # the false red this repository already paid for three times.
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          SHELLCHECK_VERSION: 0.11.0
        run: |
          set -eu
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          bash <(curl -fsSL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash") "${ACTIONLINT_VERSION}"
          ./actionlint -color -shellcheck ./shellcheck
      # OUR workflows only. `.` also walked `public/agentmask-ru/.github/`,
      # the published benchmark's CI, and judged it by this repository's
      # blanket policy (hash-pinned actions); that repository has its own
      # standards and its own CI.
      - name: zizmor
        run: pipx run zizmor==1.30.1 --persona=pedantic --format=github --config .github/zizmor.yml .github

  detection:
    name: detection — golden and dirty sets
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: prototype }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12", cache: pip, cache-dependency-path: prototype/requirements.txt }
      - run: pip install -r requirements.txt

      # BOTH SETS ARE SEEDED — 42 and 13 — so the same 298 and 150 values are
      # measured on every machine and every commit. That is what turns a report
      # into a gate: the evals now exit non-zero below their floor instead of
      # printing a number nobody reads.
      - name: golden set — 298 values, 100% recall and precision
        run: python make_dataset.py && python eval_detect.py
      - name: dirty set — 150 values, no leak and no false mask
        run: python make_dirty.py && python eval_dirty.py

  # The wiki (`wiki/`) claims where every module, test and doc lives, matches the
  # map to the real import graph, and pins every invariant to a test. A claim
  # nobody checks rots — `CLAUDE.md` had lost 16 tests and 4 directories before
  # the wiki existed. This job is what makes "the agent always relies on the map"
  # true: a map that has drifted from the code fails the build. It needs no
  # dependencies (stdlib ast only), so it does not install requirements.
  wiki:
    name: wiki — map matches the code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - name: the checker catches its own known breaks, then the wiki is green
        run: python3 wiki/check.py --selftest
