# Actions are pinned by commit SHA (tj-actions/changed-files, March 2025: a
# moving tag re-pointed at a malicious commit reached every `@v45` user). A
# pin that nobody moves rots instead, so this is the half that moves them: a
# PR per bump, the `# vX.Y.Z` comment kept in step, and checks.yml's zizmor
# refusing any hand edit that lands unpinned.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    # A release younger than a week is not bumped: the compromised
    # changed-files tag lived for about a day before it was reported, and a
    # pin that follows a tag the hour it moves has re-created the moving tag.
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Moscow
    groups:
      actions:
        patterns: ["*"]
    # MAJORS ARE A DECISION, NOT A BUMP. The first Dependabot PR proposed
    # checkout 4→7, artifacts 4→7/8 and cosign-installer 3→4 in one go; the
    # last one moves cosign to 3.x, whose default signature bundle the host's
    # cosign 2.4.1 does not verify — a release that signs fine and an agent
    # that refuses every tag. Minor and patch keep moving weekly; a major is
    # bumped by hand together with whatever it changes on the host.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # БАЗОВЫЕ ОБРАЗЫ — ТО ЖЕ САМОЕ, ЧТО ACTIONS, И ПО ТОЙ ЖЕ ПРИЧИНЕ. `FROM
  # python:3.12-slim-trixie` указывал на то, что Debian выложил последним:
  # пересборка под тем же тегом меняла дайджест, Docker пересобирал всё ниже
  # `FROM`, и релиз шёл 49 минут вместо 20. Теперь основа закреплена, а двигает
  # её эта запись — иначе пин зарос бы.
  #
  # DEPENDABOT ЛОВИТ ИМЕННО НАШ СЛУЧАЙ: он умеет замечать новый дайджест У ТОГО
  # ЖЕ ТЕГА. Это и есть «silent rebuild» — Debian пересобирает образ, не трогая
  # тег (проверено по матрице поддержки инструментов у Chainguard/Bret Fisher:
  # «Detect new digests for the same tag» — Dependabot: Yes, Dockerfiles: Yes).
  #
  # КУЛДАУН И МАЖОРЫ — ТЕ ЖЕ, ЧТО У ACTIONS. Неделя, потому что свежая
  # пересборка может содержать регресс, который откатят; мажор — решение, а не
  # бамп.
  - package-ecosystem: docker
    directories:
      - /prototype
      - /prototype/licensing
      - /storefront
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Moscow
    groups:
      base-images:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
