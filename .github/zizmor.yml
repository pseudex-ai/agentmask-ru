# zizmor runs in checks.yml under --persona=pedantic, and this file is the
# whole list of what it is told to accept. Every entry names its reason; an
# entry without one is a finding somebody silenced.
rules:
  # The backport job pushes the cherry-picked branches with the checkout's own
  # token (korthout/backport-action pushes through git, not the API), so
  # `persist-credentials: false` there would break the one thing it does.
  # Every other checkout in the repository sets it. (ship.yml, the previous
  # entry here, was retired by release-please.yml — its tag job uses the API.)
  artipacked:
    ignore:
      - backport.yml
